function sv() {
  cfg.bridge = $('#b').value.trim();
  cfg.uni = $('#u').value;
  cfg.fee = Math.max(0, +$('#f').value || 0);
  cfg.stopPct = +$('#slp').value;
  cfg.strictRR = +$('#srr').value;
  cfg.balancedRR = +$('#brr').value;
  cfg.maxOpenPos = +$('#mop').value;
  cfg.cooldownMins = +$('#cdm').value;
  normalizeCfg();
  cfg.onePerSymbol = !!$('#ops')?.checked;
  cfg.breakevenTrail = !!$('#bet')?.checked;
  cfg.eodSquareOff = !!$('#eod')?.checked;
  cfg.rthOnly=!!$('#rth')?.checked;
  cfg.quantGuard={maxQuoteAgeSec:clampNum($('#qage')?.value,3,300,20,{round:true}),strictSpreadPct:clampNum($('#qss')?.value,2,30,8),balancedSpreadPct:clampNum($('#qbs')?.value,3,40,10),minRvol:clampNum($('#qrvol')?.value,.5,5,1.1),minAdx:clampNum($('#qadx')?.value,10,50,18),blockSidewaysWithoutPattern:!!$('#qside')?.checked};
  cfg.geminiFilter = {
    enabled: !!$('#gm_en')?.checked,
    engineMode: $('#gm_mode')?.value || 'local',
    atmOnly: !!$('#gm_atmonly')?.checked,
    model: ($('#gm_model')?.value || 'gemini-2.5-pro').trim(),
    apiKey: ($('#gm_key')?.value || '').trim(),
    minConfluencePct: clampNum($('#gm_conf')?.value, 50, 95, 68, { round: true }),
    atmMaxDistPct: clampNum($('#gm_atm')?.value, 0.5, 15, 2.5),
    minOI: clampNum($('#gm_oi')?.value, 10, 50000, 200, { round: true }),
    maxIVPct: clampNum($('#gm_iv')?.value, 15, 500, 120)
  };
  save();
  if (cfg.geminiFilter.apiKey) {
    fetch(cfg.bridge + '/api/gemini/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: cfg.geminiFilter.apiKey, model: cfg.geminiFilter.model })
    }).catch(() => {});
  }
  ping();
  alert('Settings saved successfully.');
  render();
}

async function mm() {
  const out = $('#mst');
  out.className = 'mu mono';
  try {
    await fetch(cfg.bridge + '/api/moomoo/config', {
      method: 'POST',
      body: JSON.stringify({ key: $('#mk').value, secret: $('#ms').value, host: $('#mh').value, port: +$('#mp').value })
    });
    $('#mk').value = $('#ms').value = '';
    // The login handshake is asynchronous, so poll instead of reading the status once.
    for (let i = 1; i <= 14; i++) {
      out.textContent = 'Connecting to OpenD… ' + i + 's';
      await new Promise(r => setTimeout(r, 1000));
      const s = await api('/api/moomoo/status');
      if (s.connected) {
        out.className = 'g mono';
        out.textContent = '✔ Connected to OpenD at ' + s.host + ':' + s.port;
        ping();
        return;
      }
      if (s.error && s.error !== 'connecting') {
        out.className = 'r mono';
        out.textContent = '✖ ' + s.error;
        return;
      }
    }
    out.className = 'r mono';
    out.textContent = '✖ Timed out waiting for OpenD. Check the bridge terminal for [moomoo] logs.';
  } catch(e) {
    out.className = 'r mono';
    out.textContent = 'Bridge connection failed.';
  }
}

async function ping() {
  try {
    const st = await api('/api/moomoo/status');
    $('#dot').classList.add('online');
    const filterTag = cfg.geminiFilter?.enabled !== false ? ' · QUANT+TA READY' : '';
    $('#bs').textContent = 'BRIDGE ONLINE' + (st.connected ? ' · MOOMOO LINKED' : '') + filterTag;
    $('#bs').style.color = 'var(--green)';
  } catch(e) {
    $('#dot').classList.remove('online');
    $('#bs').textContent = 'BRIDGE OFFLINE · LOCAL QUANT READY';
    $('#bs').style.color = 'var(--red)';
  }
}

function render() {
  document.body.classList.toggle('paper-view', tab === 'paper');
  $('#v').innerHTML = tab === 'picks' ? rPicks() : tab === 'paper' ? rPaper() : tab === 'live' ? rLive() : rSet();
  if(tab === 'paper') requestAnimationFrame(()=>{syncPaperView();const vals={pfSearch:paperUI.search,pfSymbol:paperUI.symbol,pfSide:paperUI.side,pfTier:paperUI.tier,pfPnl:paperUI.pnl,pfSort:paperUI.sort,hfFrom:paperUI.from,hfTo:paperUI.to,hfSort:paperUI.historySort,hfTier:paperUI.histTier};Object.entries(vals).forEach(([id,v])=>{const e=document.getElementById(id);if(e)e.value=v;});applyPaperFilters();applyHistoryFilters();});
  if(tab === 'live') requestAnimationFrame(()=>updateLsCalculatorPreview());
  ['picks', 'paper', 'live', 'set'].forEach(t => {
    const el = document.getElementById('btn-' + t);
    if (el) el.classList.toggle('on', tab === t);
  });
}


// Display-only U.S. market session clock. This does not affect Auto-Picks or trading logic.
const ET_ZONE = 'America/New_York';
const etPartsFmt = new Intl.DateTimeFormat('en-US', {timeZone:ET_ZONE, year:'numeric', month:'2-digit', day:'2-digit', weekday:'short', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'});
const etClockFmt = new Intl.DateTimeFormat('en-US', {timeZone:ET_ZONE, weekday:'short', month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', timeZoneName:'short', hour12:true});
function etParts(d=new Date()) { const o={}; etPartsFmt.formatToParts(d).forEach(x=>{if(x.type!=='literal')o[x.type]=x.value}); return {y:+o.year,m:+o.month,d:+o.day,wd:o.weekday,h:+o.hour,min:+o.minute,s:+o.second}; }
function ymd(p){return `${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`}
function nthWeekday(y,m,weekday,n){let d=new Date(Date.UTC(y,m-1,1)),shift=(weekday-d.getUTCDay()+7)%7;return 1+shift+7*(n-1)}
function lastWeekday(y,m,weekday){let d=new Date(Date.UTC(y,m,0));return d.getUTCDate()-((d.getUTCDay()-weekday+7)%7)}
function easterUTC(y){let a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,n=Math.floor((a+11*h+22*l)/451),m=Math.floor((h+l-7*n+114)/31),day=(h+l-7*n+114)%31+1;return new Date(Date.UTC(y,m-1,day))}
function observed(y,m,d){let x=new Date(Date.UTC(y,m-1,d)),w=x.getUTCDay();if(w===6)x.setUTCDate(x.getUTCDate()-1);if(w===0)x.setUTCDate(x.getUTCDate()+1);return `${x.getUTCFullYear()}-${String(x.getUTCMonth()+1).padStart(2,'0')}-${String(x.getUTCDate()).padStart(2,'0')}`}
function marketCalendar(y){const z=(m,d)=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`, closed=new Set();closed.add(observed(y,1,1));closed.add(z(1,nthWeekday(y,1,1,3)));closed.add(z(2,nthWeekday(y,2,1,3)));let gf=easterUTC(y);gf.setUTCDate(gf.getUTCDate()-2);closed.add(`${gf.getUTCFullYear()}-${String(gf.getUTCMonth()+1).padStart(2,'0')}-${String(gf.getUTCDate()).padStart(2,'0')}`);closed.add(z(5,lastWeekday(y,5,1)));closed.add(observed(y,6,19));closed.add(observed(y,7,4));closed.add(z(9,nthWeekday(y,9,1,1)));closed.add(z(11,nthWeekday(y,11,4,4)));closed.add(observed(y,12,25));const thanks=nthWeekday(y,11,4,4), early=new Set([z(11,thanks+1)]);let xmas=new Date(Date.UTC(y,11,25)),cw=xmas.getUTCDay();if(cw>=2&&cw<=5)early.add(z(12,24));return {closed,early}}
function marketPhase(date=new Date()){const p=etParts(date),key=ymd(p),cal=marketCalendar(p.y),mins=p.h*60+p.min,weekend=p.wd==='Sat'||p.wd==='Sun',holiday=cal.closed.has(key),close=cal.early.has(key)?780:960;if(weekend)return {code:'closed',label:'US MARKET · CLOSED',detail:'Weekend'};if(holiday)return {code:'closed',label:'US MARKET · CLOSED',detail:'Market holiday'};if(mins>=570&&mins<close)return {code:'open',label:'US MARKET · OPEN',detail:cal.early.has(key)?'Early close 1:00 PM ET':'Closes 4:00 PM ET'};if(mins>=240&&mins<570)return {code:'extended',label:'US MARKET · PRE-MARKET',detail:'Regular open 9:30 AM ET'};if(mins>=close&&mins<1200)return {code:'extended',label:'US MARKET · AFTER-HOURS',detail:'Extended session to 8:00 PM ET'};return {code:'closed',label:'US MARKET · CLOSED',detail:'Next regular session pending'}}
// Local-time display: market status still follows New York hours, but every time shown is in the viewer's own timezone.
const localClockFmt = new Intl.DateTimeFormat(undefined, {weekday:'short', month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', timeZoneName:'short'});
const localEventFmt = new Intl.DateTimeFormat(undefined, {weekday:'short', hour:'numeric', minute:'2-digit'});
const localTimeFmt = new Intl.DateTimeFormat(undefined, {hour:'numeric', minute:'2-digit'});
// Converts a New York wall-clock time to the real instant (handles EDT/EST automatically).
function etWall(y,m,d,h,min){const want=Date.UTC(y,m-1,d,h,min);let t=want;for(let i=0;i<3;i++){const p=etParts(new Date(t));t-=Date.UTC(p.y,p.m-1,p.d,p.h,p.min)-want}return new Date(t)}
// Next regular-session boundary: today's close while open, otherwise the next trading-day open.
function nextMarketEvent(now=new Date()){
  const p=etParts(now),key=ymd(p),cal0=marketCalendar(p.y);
  if(!(p.wd==='Sat'||p.wd==='Sun')&&!cal0.closed.has(key)){
    const early=cal0.early.has(key),cm=early?780:960,open=etWall(p.y,p.m,p.d,9,30),close=etWall(p.y,p.m,p.d,Math.floor(cm/60),cm%60);
    if(now>=open&&now<close)return {kind:'close',at:close,early};
  }
  for(let i=0;i<=10;i++){
    const x=new Date(Date.UTC(p.y,p.m-1,p.d+i)),y=x.getUTCFullYear(),m=x.getUTCMonth()+1,d=x.getUTCDate(),wd=x.getUTCDay();
    if(wd===0||wd===6)continue;
    if(marketCalendar(y).closed.has(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`))continue;
    const open=etWall(y,m,d,9,30);
    if(open>now)return {kind:'open',at:open};
  }
  return null;
}
function fmtLocalEvent(d,now){return d.toDateString()===now.toDateString()?localTimeFmt.format(d):localEventFmt.format(d)}
function fmtDur(ms){const m=Math.max(0,Math.floor(ms/60000)),d=Math.floor(m/1440),h=Math.floor(m%1440/60);return d?`${d}d ${h}h`:`${h}h ${m%60}m`}
function updateMarketClock(){
  const now=new Date(),phase=marketPhase(now),led=$('#market-led'),state=$('#market-state'),time=$('#market-time'),next=$('#market-next'),box=$('#us-market-clock');
  if(!led||!state||!time||!next)return;
  led.className='market-led '+phase.code;
  state.textContent=phase.label;
  state.style.color=phase.code==='open'?'var(--green)':phase.code==='extended'?'var(--amber)':'var(--red)';
  time.textContent=localClockFmt.format(now);
  const ev=nextMarketEvent(now),note=(phase.detail==='Weekend'||phase.detail==='Market holiday')?phase.detail+' · ':'';
  next.textContent=ev?`${note}${ev.kind==='close'?'Closes':'Opens'} ${fmtLocalEvent(ev.at,now)}${ev.early?' (early)':''} · in ${fmtDur(ev.at-now)}`:phase.detail;
  if(box)box.title='U.S. equities session (holiday and early-close aware) · times shown in your local time · New York now: '+etClockFmt.format(now);
}
