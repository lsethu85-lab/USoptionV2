<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AlphaPulse | Pro Options Terminal</title>
<style>
:root {
  --bg: #0b0f17;
  --surface: #111723;
  --surface-raised: #182234;
  --border: #223048;
  --border-focus: #3b82f6;
  --tx-main: #f1f5f9;
  --tx-muted: #8494ab;
  --tx-faint: #4c5d77;
  --green: #10b981;
  --green-bg: rgba(16, 185, 129, 0.12);
  --red: #ef4444;
  --red-bg: rgba(239, 68, 68, 0.12);
  --blue: #3b82f6;
  --blue-bg: rgba(59, 130, 246, 0.14);
  --amber: #f59e0b;
  --amber-bg: rgba(245, 158, 11, 0.14);
  --mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f6fa;
    --surface: #ffffff;
    --surface-raised: #f8fafc;
    --border: #dbe2ea;
    --border-focus: #2563eb;
    --tx-main: #0f172a;
    --tx-muted: #64748b;
    --tx-faint: #94a3b8;
    --green: #059669;
    --green-bg: #ecfdf5;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --blue: #2563eb;
    --blue-bg: #eff6ff;
    --amber: #d97706;
    --amber-bg: #fffbeb;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--tx-main);
  font: 13px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  gap: 16px;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.5px;
}
.brand-badge {
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  color: #fff;
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 4px;
  font-weight: 800;
  letter-spacing: 1px;
}
nav { display: flex; gap: 6px; }
.btn {
  background: var(--surface-raised);
  color: var(--tx-main);
  border: 1px solid var(--border);
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 500;
  font-size: 12px;
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:hover { background: var(--border); }
.btn.on, .btn.pri {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.btn.sm { padding: 3px 8px; font-size: 11px; }
.btn.danger { color: var(--red); border-color: rgba(239,68,68,0.3); }
.btn.danger:hover { background: var(--red-bg); }
.status-pill {
  font-size: 11px;
  color: var(--tx-muted);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 8px var(--red);
}
.dot.online {
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
}
main {
  padding: 18px 20px;
  max-width: 1400px;
  margin: auto;
}
.kpi-deck {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
}
.kpi-label { font-size: 11px; color: var(--tx-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.kpi-val { font-size: 20px; font-weight: 700; font-family: var(--mono); margin-top: 4px; }
.wrap {
  overflow-x: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
}
table {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}
th, td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  text-align: right;
  white-space: nowrap;
}
th {
  background: var(--surface-raised);
  color: var(--tx-muted);
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
th:first-child, td:first-child { text-align: left; }
.tag {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  font-family: var(--mono);
}
.tag.Strict { background: var(--green-bg); color: var(--green); border: 1px solid rgba(16,185,129,0.25); }
.tag.Balanced { background: var(--blue-bg); color: var(--blue); border: 1px solid rgba(59,130,246,0.25); }
.tag.Aggressive { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(245,158,11,0.25); }
.tag.Buy { background: var(--green-bg); color: var(--green); border: 1px solid rgba(16,185,129,0.25); }
.tag.Sell { background: var(--red-bg); color: var(--red); border: 1px solid rgba(239,68,68,0.25); }
.sym-name { font-weight: 700; color: var(--tx-main); }
.sym-sub { font-size: 11px; color: var(--tx-muted); }
.g { color: var(--green); }
.r { color: var(--red); }
.mu { color: var(--tx-muted); }
.mono { font-family: var(--mono); }
input {
  background: var(--surface-raised);
  color: var(--tx-main);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 4px 8px;
  font-family: var(--mono);
  font-size: 12px;
  width: 82px;
  text-align: right;
}
input:focus { border-color: var(--border-focus); outline: none; }
.set { background: var(--surface); padding: 20px; border-radius: 8px; border: 1px solid var(--border); }
.set label { display: block; margin: 14px 0 4px; color: var(--tx-muted); font-size: 12px; font-weight: 600; }
.set input { width: 100%; max-width: 500px; text-align: left; padding: 7px 10px; }
.row { display: flex; gap: 8px; margin: 0 0 12px; flex-wrap: wrap; align-items: center; }
.actions-cell { display: flex; gap: 4px; justify-content: flex-end; }

.header-right { display:flex; align-items:center; justify-content:flex-end; gap:14px; margin-left:auto; }
.market-clock { display:flex; align-items:center; gap:9px; padding:6px 10px; border:1px solid var(--border); border-radius:7px; background:var(--surface-raised); min-width:290px; }
.market-led { width:8px; height:8px; border-radius:50%; background:var(--tx-faint); box-shadow:0 0 7px var(--tx-faint); flex:0 0 auto; }
.market-led.open { background:var(--green); box-shadow:0 0 8px var(--green); }
.market-led.extended { background:var(--amber); box-shadow:0 0 8px var(--amber); }
.market-led.closed { background:var(--red); box-shadow:0 0 8px var(--red); }
.market-main { min-width:0; }
.market-state { font:700 11px/1.25 var(--mono); letter-spacing:.35px; }
.market-meta { color:var(--tx-muted); font:10px/1.35 var(--mono); white-space:nowrap; }
@media (max-width:760px) { .header-right { width:100%; justify-content:space-between; } .market-clock { min-width:0; flex:1; } }


/* Paper Trading: traditional, no-horizontal-scroll responsive layout */
.paper-view main#v { max-width:1200px; }
.paper-view .paper-intro { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:16px; }
.paper-view .paper-intro h2 { margin:0 0 4px; font-size:22px; }
.paper-view .paper-toolbar { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }
.paper-view .paper-section { margin-top:18px; }
.paper-view .paper-section-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 10px; }
.paper-view .paper-section-title { font-size:14px; font-weight:800; letter-spacing:.4px; }
.paper-view .wrap { overflow:visible; background:transparent; border:0; box-shadow:none; }
.paper-view table, .paper-view tbody { display:block; width:100%; }
.paper-view thead { display:none; }
.paper-view tr { display:grid; grid-template-columns:minmax(230px,1.6fr) repeat(2,minmax(110px,.7fr)) minmax(90px,.5fr) minmax(140px,.8fr); gap:0; margin-bottom:12px; background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.08); }
.paper-view td { min-width:0; padding:11px 13px; border:0; border-right:1px solid var(--border); border-bottom:1px solid var(--border); text-align:left; white-space:normal; overflow-wrap:anywhere; }
.paper-view td:first-child { grid-row:span 2; }
.paper-view td:last-child { border-right:0; }
.paper-view td::before { content:attr(data-label); display:block; margin-bottom:5px; color:var(--tx-muted); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.45px; }
.paper-view td:first-child::before { content:'Contract'; }
.paper-view .actions-cell { justify-content:flex-start; flex-wrap:wrap; }
.paper-view input { width:78px; max-width:100%; }
.paper-view select { max-width:100%; }
.paper-view .paper-empty { display:block; padding:30px; text-align:center; border:1px dashed var(--border); border-radius:10px; background:var(--surface); }
.paper-view .quote-fresh { display:inline-block; margin-top:4px; font-size:10px; color:var(--tx-muted); }
@media (max-width:900px) {
  .paper-view tr { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .paper-view td:first-child { grid-column:1/-1; grid-row:auto; }
  .paper-view .paper-intro { flex-direction:column; }
  .paper-view .paper-toolbar { justify-content:flex-start; }
}
@media (max-width:560px) {
  header { padding:10px 12px; }
  nav { width:100%; overflow:visible; flex-wrap:wrap; }
  nav .btn { flex:1 1 auto; justify-content:center; }
  main { padding:14px 12px; }
  .paper-view tr { display:block; }
  .paper-view td { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; border-right:0; }
  .paper-view td::before { flex:0 0 108px; margin:0; }
  .paper-view td:first-child { display:block; }
  .paper-view td:first-child::before { margin-bottom:5px; }
  .paper-view .kpi-deck { grid-template-columns:1fr 1fr; }
  .paper-view .kpi-card { padding:11px; }
  .paper-view .kpi-val { font-size:16px; }
}

/* Non-disruptive live updates and Super Agent learning panel */
.agent-panel{margin:16px 0;padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.agent-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}.agent-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}.agent-metric{padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface2)}.agent-metric b{display:block;font-size:18px;margin-top:4px}.agent-list{margin:10px 0 0;padding-left:18px;font-size:12px;line-height:1.6}.safe-note{font-size:11px;color:var(--tx-muted);margin-top:10px}.refresh-status{font-size:11px;color:var(--tx-muted)}
html{scroll-behavior:auto} body{min-height:100vh;overflow-y:scroll}

/* Scanner control and Super Agent insight details */
.scanner-toggle.running{background:var(--green);color:#fff;border-color:var(--green)}
.scanner-toggle.paused{background:var(--amber-bg);color:var(--amber);border-color:rgba(245,158,11,.45)}
.scanner-state{font:700 11px/1.3 var(--mono)}
.agent-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.agent-insights{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.agent-insight{padding:11px;border:1px solid var(--border);border-radius:8px;background:var(--surface-raised)}
.agent-insight h4{margin:0 0 7px;font-size:12px}.agent-insight p{margin:4px 0;font-size:11px;color:var(--tx-muted)}
.agent-insight strong{color:var(--tx-main)}.agent-badge{display:inline-block;margin:2px 4px 2px 0;padding:2px 6px;border-radius:4px;font:10px var(--mono);background:var(--blue-bg);color:var(--blue)}

/* Evidence-based trade analyst */
.agent-drawer{position:fixed;right:18px;bottom:18px;width:min(430px,calc(100vw - 24px));max-height:min(720px,calc(100vh - 36px));z-index:50;display:none;flex-direction:column;border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:0 18px 60px rgba(0,0,0,.35);overflow:hidden}.agent-drawer.open{display:flex}.agent-chat-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:13px;border-bottom:1px solid var(--border);background:var(--surface2)}.agent-chat-body{padding:12px;overflow:auto}.agent-context{padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);font-size:11px}.agent-messages{display:grid;gap:9px;margin:12px 0}.agent-msg{max-width:92%;padding:9px 10px;border-radius:9px;font-size:12px;line-height:1.5;white-space:pre-wrap}.agent-msg.user{justify-self:end;background:var(--blue);color:#fff}.agent-msg.bot{justify-self:start;background:var(--surface2);border:1px solid var(--border)}.agent-quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.agent-chat-form{display:flex;gap:7px;padding:11px;border-top:1px solid var(--border)}.agent-chat-form input{flex:1;min-width:0}.agent-chat-status{padding:7px 11px;font-size:11px;color:var(--tx-muted);border-top:1px solid var(--border)}.agent-chat-status.error{color:var(--red)}.evidence-row{display:grid;grid-template-columns:120px 1fr;gap:7px;padding:4px 0;border-bottom:1px dashed var(--border);font-size:11px}.confidence{font-weight:800}.confidence.low{color:var(--amber)}.confidence.medium{color:var(--blue)}.confidence.high{color:var(--green)}.proposal{margin-top:10px;padding:9px;border:1px solid var(--border);border-radius:8px}.shadow-tag{padding:2px 6px;border-radius:4px;background:var(--blue-bg);color:var(--blue);font-size:10px}.agent-fab{position:fixed;right:18px;bottom:18px;z-index:40;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25)}

.agent-chat-bottom{margin-top:auto;background:var(--surface);border-top:1px solid var(--border)}
.agent-presets{display:flex;gap:6px;overflow-x:auto;padding:9px 11px;scrollbar-width:thin}.agent-presets .btn{flex:0 0 auto;white-space:nowrap}
.agent-provider{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 11px;font-size:10px;color:var(--tx-muted);border-top:1px solid var(--border)}
.agent-source{margin-top:5px;padding-top:5px;border-top:1px dashed var(--border);font-size:10px}.agent-source a{color:var(--blue)}

<script type="text/plain" id="bridge">
const http = require('http'), PORT = process.env.PORT || 8787, UA = { 'User-Agent': 'Mozilla/5.0' };
let cookie = '', crumb = '';
let moomoo = { key: process.env.MOOMOO_KEY || '', secret: process.env.MOOMOO_SECRET || '', host: '127.0.0.1', port: 33333 };
async function auth() {
  const r = await fetch('https://fc.yahoo.com', { headers: UA, redirect: 'manual' });
  cookie = (r.headers.getSetCookie?.() || []).map(c => c.split(';')[0]).join('; ');
  crumb = await (await fetch('https://query1.finance.yahoo.com/v1/test/getcrumb', { headers: { ...UA, cookie } })).text();
}
async function yf(path) {
  for (let i = 0; i < 2; i++) {
    if (!crumb) await auth();
    const r = await fetch('https://query2.finance.yahoo.com' + path + (path.includes('?') ? '&' : '?') + 'crumb=' + encodeURIComponent(crumb), { headers: { ...UA, cookie } });
    if (r.ok) return r.json();
    crumb = '';
  }
  throw new Error('Yahoo request failed');
}

let mm = null, mmReady = false, mmErr = '', subd = new Set(), mmTimer = null;
// Minimal protobuf reader for InitWebSocket.Response (retType=1, retMsg=2, errCode=3).
function pbInit(ab) {
  const u = new Uint8Array(ab), o = {}; let i = 0;
  const vi = () => { let r = 0n, s = 0n, b; do { b = u[i++]; r |= BigInt(b & 127) << s; s += 7n; } while (b & 128); return r; };
  while (i < u.length) {
    const t = Number(vi()), f = t >> 3, w = t & 7;
    if (w === 0) { const v = vi(); if (f === 1) o.retType = Number(BigInt.asIntN(32, v)); if (f === 3) o.errCode = Number(BigInt.asIntN(32, v)); }
    else if (w === 2) { const n = Number(vi()); if (f === 2) o.retMsg = Buffer.from(u.subarray(i, i + n)).toString('utf8'); i += n; }
    else if (w === 1) i += 8; else if (w === 5) i += 4; else break;
  }
  return o;
}
function mmClose() {
  clearTimeout(mmTimer);
  try { if (mm && typeof mm.stop === 'function') mm.stop(); } catch (e) {}
  mm = null; mmReady = false;
}
function mmConnect() {
  mmClose();
  let M;
  try { M = require('moomoo-api'); }
  catch (e) { mmErr = 'moomoo-api not installed. Run: npm i moomoo-api (in the same folder as server.js)'; return; }
  try {
    const C = M.default || M, me = new C();
    let refusal = null;
    mm = me; subd.clear(); mmErr = 'connecting';
    me.onlogin = (ret, msg) => {
      if (mm !== me) return;
      clearTimeout(mmTimer);
      mmReady = !!ret;
      if (ret) mmErr = '';
      else if (refusal) mmErr = 'OpenD refused the connection: ' + (refusal.retMsg || 'no message') + ' (code ' + refusal.retType + (refusal.errCode ? '/' + refusal.errCode : '') + '). Check the WebSocket key matches OpenD.';
      else mmErr = 'OpenD login failed: ' + (msg || 'check WebSocket key (plain text, not the MD5) and port');
      console.log('[moomoo] login', ret ? 'OK' : 'FAILED', refusal ? JSON.stringify(refusal) : (msg && msg.message || msg || ''));
    };
    me.start(moomoo.host, +moomoo.port, false, moomoo.key);
    // The SDK throws away OpenD's error reply to the init request; read it ourselves so the real reason is shown.
    const wb = me.websock;
    if (wb && typeof wb.sendBuff === 'function') {
      const orig = wb.sendBuff.bind(wb);
      wb.sendBuff = (cmd, buf, t) => {
        const p = orig(cmd, buf, t);
        return cmd !== 1 ? p : p.then(r => { try { if (r && r.buff) { const d = pbInit(r.buff); if (d.retType !== undefined && d.retType !== 0) refusal = d; } } catch (e) {} return r; });
      };
    }
    mmTimer = setTimeout(() => {
      if (mm === me && !mmReady && mmErr === 'connecting')
        mmErr = 'No login response from OpenD at ' + moomoo.host + ':' + moomoo.port + ' after 8s. Check OpenD is running, its WebSocket port is enabled, and the key matches.';
    }, 8000);
  } catch (e) { mm = null; mmErr = e.message; }
}
// A refused/dropped OpenD socket can throw asynchronously inside the SDK; keep the bridge alive and report it.
process.on('uncaughtException', e => { console.error('[bridge]', e.message); if (mm && !mmReady) mmErr = 'OpenD connection error: ' + e.message; });
process.on('unhandledRejection', e => { console.error('[bridge]', e && e.message || e); if (mm && !mmReady) mmErr = 'OpenD connection error: ' + (e && e.message || e); });
function toMoomooOptionCodes(raw) {
  const s = String(raw || '').toUpperCase().trim().replace(/^US[.:]/, '').replace(/-US$/, '').replace(/\s+/g, '');
  const m = /^([A-Z]{1,6})(\d{6}[CP])(\d{1,8})$/.exec(s);
  if (!m) return null;
  const root = m[1], ymdcp = m[2], d = m[3];
  const strikeMill = d.length === 8 ? parseInt(d, 10) : (d.length >= 5 ? parseInt(d, 10) : parseInt(d, 10) * 1000);
  const compact = `${root}${ymdcp}${strikeMill}`;
  const occ = `${root}${ymdcp}${String(strikeMill).padStart(8, '0')}`;
  return { compact, occ, candidates: compact === occ ? [compact] : [compact, occ] };
}
async function moomooQuote(code) {
  const parsed = toMoomooOptionCodes(code);
  if (!parsed || !mm || !mmReady) return null;
  for (const c of parsed.candidates) {
    const sec = { market: 11, code: c };
    try {
      if (!subd.has(sec.code)) {
        await mm.Sub({ c2s: { securityList: [sec], subTypeList: [1, 2], isSubOrUnSub: true, isRegOrUnRegPush: false } });
        subd.add(sec.code);
      }
      const res = await mm.GetBasicQot({ c2s: { securityList: [sec] } });
      const q = res?.s2c?.basicQotList?.[0];
      if (q && (Number(q.curPrice) > 0 || Number(q.lastClosePrice) > 0 || Number(q.openPrice) > 0)) {
        let bid = 0, ask = 0;
        try {
          const ob = (await mm.GetOrderBook({ c2s: { security: sec, num: 1 } }))?.s2c;
          bid = Number(ob?.orderBookBidList?.[0]?.price || 0);
          ask = Number(ob?.orderBookAskList?.[0]?.price || 0);
        } catch (e) {}
        const last = Number(q.curPrice) > 0 ? Number(q.curPrice) : (bid > 0 && ask > 0 ? +((bid + ask) / 2).toFixed(2) : Number(q.lastClosePrice) || 0);
        if (last > 0) return { last, curPrice: Number(q.curPrice || 0), bid, ask, volume: Number(q.volume || 0), oi: Number(q.optionExData?.openInterest || 0), code: c, occ: parsed.occ };
      }
    } catch (e) { mmErr = e.message; }
  }
  return null;
}
async function moomooQuotesBatch(codesCsv) {
  const rawList = String(codesCsv || '').split(',').map(s => s.trim()).filter(Boolean);
  const out = {};
  for (const raw of rawList) {
    const q = await moomooQuote(raw);
    if (q && q.last > 0) out[raw] = q;
  }
  return out;
}
if (moomoo.key) mmConnect();

const E = encodeURIComponent;
const routes = {
  '/api/chain': q => yf(`/v7/finance/options/${E(q.symbol)}` + (q.date ? `?date=${q.date}` : '')),
  '/api/quote': q => yf(`/v7/finance/quote?symbols=${E(q.symbols)}`),
  '/api/chart': q => yf(`/v8/finance/chart/${E(q.symbol)}?range=${q.range || '6mo'}&interval=${q.interval || '1d'}`),
  '/api/moomoo/quote': async q => ({ quote: await moomooQuote(q.code) }),
  '/api/moomoo/quotes': async q => ({ quotes: await moomooQuotesBatch(q.codes) }),
  '/api/moomoo/status': async () => ({ configured: !!moomoo.key, connected: mmReady, error: mmErr, host: moomoo.host, port: moomoo.port }),
};

http.createServer(async (req, res) => {
  res.setHeader('Access-Control-Allow-Origin', '*');
  res.setHeader('Access-Control-Allow-Headers', 'content-type');
  if (req.method === 'OPTIONS') return res.end();
  const u = new URL(req.url, 'http://x'), q = Object.fromEntries(u.searchParams);
  const send = (c, o) => { res.writeHead(c, { 'Content-Type': 'application/json' }); res.end(JSON.stringify(o)); };
  try {
    if (req.method === 'POST' && u.pathname === '/api/moomoo/config') {
      let b = ''; for await (const chunk of req) b += chunk; const c = JSON.parse(b || '{}');
      for (const k of ['key', 'secret', 'host', 'port']) if (c[k] !== undefined && c[k] !== '' && c[k] !== null) moomoo[k] = c[k];
      mmConnect();
      return send(200, { ok: true });
    }
    const h = routes[u.pathname];
    if (!h) return send(404, { error: 'not found' });
    send(200, await h(q));
  } catch (e) { send(500, { error: e.message }); }
}).listen(PORT, '127.0.0.1', () => console.log('Bridge on http://127.0.0.1:' + PORT));
</script>

<script>
const $ = s => document.querySelector(s);
let cfg = {
  bridge: 'http://localhost:8787',
  uni: 'SPY,QQQ,IWM,AAPL,MSFT,NVDA,TSLA,AMZN,META',
  fee: 0.69,
  strictRR: 1.5,

  if (typeof cfg.breakevenTrail !== 'boolean') cfg.breakevenTrail = true;
  if (typeof cfg.eodSquareOff !== 'boolean') cfg.eodSquareOff = true;

  if (!cfg.superAgent || typeof cfg.superAgent !== 'object') cfg.superAgent={enabled:true,history:[],blocked:0};
  if (!Array.isArray(cfg.superAgent.history)) cfg.superAgent.history=[];
  cfg.scannerPaused = cfg.scannerPaused === true;
  if(!cfg.analyst||typeof cfg.analyst!=='object')cfg.analyst={messages:[],proposals:[],approvedRules:[]};
  if(!Array.isArray(cfg.analyst.messages))cfg.analyst.messages=[];if(!Array.isArray(cfg.analyst.proposals))cfg.analyst.proposals=[];if(!Array.isArray(cfg.analyst.approvedRules))cfg.analyst.approvedRules=[];if(!cfg.analyst.dailyReports||typeof cfg.analyst.dailyReports!=='object')cfg.analyst.dailyReports={};
} catch(e) {}

function clampNum(v, min, max, def, o = {}) {
  let n = Number(v);
  if (!Number.isFinite(n) || (!n && !o.allowZero)) n = def;
  n = Math.min(max, Math.max(min, n));
  return o.round ? Math.round(n) : n;
}
function normalizeCfg() {
  cfg.strictRR = clampNum(cfg.strictRR, 0.1, 10, 1.5);
  cfg.balancedRR = clampNum(cfg.balancedRR, 0.1, 10, 1.5);
  cfg.stopPct = clampNum(cfg.stopPct, 5, 60, 25);
  cfg.maxOpenPos = clampNum(cfg.maxOpenPos, 1, 20, 3, { round: true });
  cfg.cooldownMins = clampNum(cfg.cooldownMins, 0, 240, 30, { round: true, allowZero: true });
}

const save = () => { try { localStorage.setItem('opt', JSON.stringify(cfg)); } catch(e){} };

const api = async (p) => {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 8000);
  try {
    const r = await fetch(cfg.bridge + p, { signal: ctrl.signal });
    clearTimeout(timer);
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch (e) {
    clearTimeout(timer);
    throw e;
  }
};

const AUTO_PICK_POLICY = Object.freeze({ premiumMin: 0.25, premiumMax: 3.50, strictMin: 76, balancedMin: 72, maxSpreadPct: 0.10, minVolume: 50, minOI: 200, scanMs: 30000 });
// Single source of truth for tiering and the per-tier risk plan (used by scoring, the picks table and order creation).
const tierForScore = s => s >= AUTO_PICK_POLICY.strictMin ? 'Strict' : s >= AUTO_PICK_POLICY.balancedMin ? 'Balanced' : null;
const tierRR = tier => tier === 'Strict' ? cfg.strictRR : cfg.balancedRR;
function riskPlan(mid, tier, intraday) {
  const slMult = 1 - cfg.stopPct / 100;
  const stop = +(mid * (intraday ? slMult : Math.min(slMult, 0.70))).toFixed(2);
  const rr = tierRR(tier);
  return { stop, rr, tgt: +(mid + (mid - stop) * rr).toFixed(2) };
}
let tab = 'picks', mode = 'intraday', tier = 'All', picks = [], msg = '', busy = false, autoTradeMsg = 'Auto-entry armed';

function setTab(t) {

  render();

// ---- Contract parsing: every input format is normalised to ONE canonical OCC contract ----
// Accepts  OCC            NFLX261106P00061000
//          Moomoo compact NFLX261106P61000  (a US. prefix or -US suffix is fine)
//          Display text   NFLX 11-06 61P · NFLX 11/06 61.5 PUT · NFLX 2026-11-06 61P · NFLX Nov 6 2026 61P · NFLX 261106 61P
// Before this, text such as "NFLX 11-06 61P" was stored as-is: the underlying became "NFLX " (trailing space),
// so the 5m chart request failed and the Moomoo link pointed at a page that does not exist (404).
const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

function contractFromParts(root, y, mo, d, call, strike) {
  if (!root || !(y >= 2000 && y <= 2100) || !(mo >= 1 && mo <= 12) || !(d >= 1 && d <= 31) || !Number.isFinite(strike) || !(strike > 0)) return null;
  const mid = new Date(Date.UTC(y, mo - 1, d));
  if (mid.getUTCMonth() !== mo - 1 || mid.getUTCDate() !== d) return null; // rejects impossible dates such as 02-31
  const z = n => String(n).padStart(2, '0');
  const close = etWall(y, mo, d, 16, 0); // 4:00 PM New York on expiry day (EDT/EST handled)
  return {
    root, y, m: mo, d, call, strike,
    occ: `${root}${z(y % 100)}${z(mo)}${z(d)}${call ? 'C' : 'P'}${String(Math.round(strike * 1000)).padStart(8, '0')}`,
    expMidTs: Math.floor(mid.getTime() / 1000),                 // 00:00 UTC of expiry day = the key Yahoo's option chain uses
    dte: Math.max(0, (close.getTime() - Date.now()) / 864e5),
    label: `${root} ${z(d)} ${MONTHS[mo - 1]} ${y} $${+strike.toFixed(3)} ${call ? 'CALL' : 'PUT'}`
  };
}

function parseExpiryText(txt, refTs) {
  const ref = Number(refTs) || Date.now();
  let y, mo, d, m;
  if ((m = /^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/.exec(txt))) { y = +m[1]; mo = +m[2]; d = +m[3]; }            // 2026-11-06
  else if ((m = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4}|\d{2})$/.exec(txt))) { mo = +m[1]; d = +m[2]; y = +m[3]; if (y < 100) y += 2000; } // 11-06-2026 (US order)
  else if ((m = /^(\d{1,2})[-\/.](\d{1,2})$/.exec(txt))) { mo = +m[1]; d = +m[2]; }                                // 11-06
  else if ((m = /^(\d{4})(\d{2})(\d{2})$/.exec(txt))) { y = +m[1]; mo = +m[2]; d = +m[3]; }                         // 20261106

function parseContractInput(raw, refTs) {

  let m = /^([A-Z]{1,6})(\d{2})(\d{2})(\d{2})([CP])(\d{1,8})$/.exec(s.replace(/ /g, ''));
  if (m) { // OCC (8 digits, thousandths) or Moomoo compact (thousandths, no padding). 1-4 digits = whole dollars.
    const digits = m[6];
    return contractFromParts(m[1], 2000 + +m[2], +m[3], +m[4], m[5] === 'C', digits.length >= 5 ? parseInt(digits, 10) / 1000 : parseInt(digits, 10));

  if ((m = /^([A-Z]{1,6}) (.+?) ?(\d+(?:\.\d+)?) ?(CALL|PUT|C|P)$/.exec(s))) [, root, dateTxt, strikeTxt, typeTxt] = m;      // NFLX 11-06 61P
  else if ((m = /^([A-Z]{1,6}) (.+?) (CALL|PUT|C|P) ?(\d+(?:\.\d+)?)$/.exec(s))) [, root, dateTxt, typeTxt, strikeTxt] = m;  // NFLX 11-06 P 61

}

const N = x => {

  return x > 0 ? 1 - p : p;
};

function greeks(S, K, T, iv, call) {

        d2 = d1 - sd,
        pdf = .3989423 * Math.exp(-d1*d1/2);
  return {
    d: call ? N(d1) : N(d1) - 1,
    th: (-S * pdf * iv / (2 * Math.sqrt(T)) - (call ? 1 : -1) * r * K * Math.exp(-r*T) * N(call ? d2 : -d2)) / 365

}

const ema = (a, n) => { const k = 2 / (n + 1); return a.reduce((e, x, i) => i ? x*k + e*(1-k) : x, a[0]); };
const rsi = (c, n=14) => {

  for (let i = c.length - n; i < c.length; i++) {

};
const hv = c => {

const cl = (x, a=0, z=1) => Math.max(a, Math.min(z, x));

function pick(o, S, T, call, m, b, fs, H, ed) {

  if (!(bid > 0) || !(ask > 0) || !(iv > 0) || (o.openInterest || 0) < AUTO_PICK_POLICY.minOI || (o.volume || 0) < AUTO_PICK_POLICY.minVolume) return null;

async function analyze(sym) {

        S = c.at(-1);
  const e20 = ema(c, 20), e50 = ema(c, 50), R = rsi(c), H = hv(c), chg = q.regularMarketChangePercent || 0;
  const b = (S > e20 ? 20 : -20) + (e20 > e50 ? 25 : -25) + (S > e50 ? 10 : -10) + (R > 55 ? 15 : R < 45 ? -15 : 0) + (chg > .3 ? 15 : chg < -.3 ? -15 : 0);

function executeEligibleAutoPicks() {

    const result = createPaperOrder(p, 'Auto-Picks hard trigger');

function sendPickToLive(code) {
  const p = picks.find(x => x.code === code);
  if (!p) return;
  const livePx = Number(p.live) > 0 ? Number(p.live) : Number(p.mid);
  lsDraft.code = p.code;
  lsDraft.entry = +livePx.toFixed(2);
  lsDraft.qty = lsFitQty(lsDraft.entry, lsDraft.budget || 500, lsDraft.maxRisk || 25, lsDraft.stopPct || 25);
  setTab('live');
}

function add(code) {
  const p = picks.find(x => x.code === code);
  if (!p) return;
  const result = createPaperOrder(p, 'Manual Auto-Picks');
  if (!result.ok) { alert(result.reason === 'Already open' ? 'This contract is already open in Paper Trading.' : 'Contract no longer meets the hard Auto-Picks policy.'); return; }
  cfg.autoPickExecuted[code] = Date.now();
  save();
  setTab('paper');
}

function ed(i, k, v) {
  if (!cfg.pos[i]) return;
  cfg.pos[i][k] = Math.max(0, +v);
  save();
  render();
}

function setRR(i, ratio) {
  const p = cfg.pos[i];
  if (!p) return;
  if (ratio === 'custom') return;
  p.rr = +ratio;
  const risk = Math.max(0, p.entry - (p.stop || 0));
  p.tgt = +(p.entry + risk * p.rr).toFixed(2);
  save();
  render();
}

function setCustomRR(i, value) {
  const p = cfg.pos[i];
  const ratio = Math.max(0.1, +value || 0);
  if (!p || !ratio) return;
  p.rr = ratio;
  const risk = Math.max(0, p.entry - (p.stop || 0));
  p.tgt = +(p.entry + risk * ratio).toFixed(2);
  save();
  render();
}

const BE_FEE_BUFFER = 0.02; // breakeven + small fee buffer
function armBreakeven(p, reason, initStop) {
  p.initialStop = initStop ?? (p.initialStop || p.stop);
  p.stop = +(p.entry + BE_FEE_BUFFER).toFixed(2);
  p.breakevenArmed = true;
  (p.timeline ??= []).push({ at: Date.now(), type: 'TRAIL_BE', price: p.live, newStop: p.stop, reason });
}

function toggleAutoClose(i) {

function classifyFailure(p){
  const e=p.entrySnapshot||{},loss=Number(p.realizedPL)<0,move=e.entry?((Number(p.exitPrice||p.live)-e.entry)/e.entry*100):0,reasons=[];
  if(!loss)return {primary:'Profitable outcome',factors:['Target/exit produced positive net P&L'],confidence:'medium'};
  if(String(p.closeReason||'').includes('Stop loss'))reasons.push('Stop loss reached');
  if(e.spreadPct!=null && Number(e.spreadPct)>10)reasons.push('Wide entry spread');
  if(e.theta!=null && e.mid!=null && Math.abs(Number(e.theta))/(Number(e.mid)||1)>.15)reasons.push('High theta burden');
  if(e.volume==null || e.oi==null) {
    reasons.push('Telemetry missing at entry (legacy/unverified liquidity)');
  } else {
    if(Number(e.volume)<200)reasons.push('Light option volume');
    if(Number(e.oi)<300)reasons.push('Limited open interest');
  }
  if(e.earningsDays!=null&&Number(e.earningsDays)<2)reasons.push('Event proximity');
  if(move<-20)reasons.push('Large premium reversal');
  const primary=reasons[0]||'Price moved against the setup after entry';
  const completeness=['underlying','spreadPct','theta','volume','oi'].filter(k=>e[k]!=null).length;
  return {primary,factors:reasons.slice(1).length?reasons.slice(1):['No single technical cause is proven by stored evidence'],confidence:completeness>=4?'medium':'low'};
}
function comparableTrades(p){const key=agentKey(p);return (cfg.closed||[]).filter(x=>x.autoEntered&&x!==p&&agentKey(x)===key);}
function updateShadowTests(closed){
  (cfg.analyst.proposals||[]).filter(x=>x.status==='shadow').forEach(x=>{if(x.pattern===agentKey(closed)){x.observations=(x.observations||0)+1;if(Number(closed.realizedPL)<=0)x.avoidedLosses=(x.avoidedLosses||0)+1;else x.missedWins=(x.missedWins||0)+1;x.updatedAt=Date.now();}});
}
function closePos(i, reason = 'Manual close') {
  const p = cfg.pos[i];
  if (!p) return;
  const feeTotal = 2 * cfg.fee * p.qty;
  const realizedPL = (p.live - p.entry) * 100 * p.qty - feeTotal;
  cfg.closed.push({
    ...p,
    exitPrice: p.live,
    realizedPL,
    feeTotal,
    closedAt: Date.now(),
    closeReason: reason,
    autoClosed: reason !== 'Manual close',
    exitSnapshot:{price:p.live,quoteSource:p.src||'Unknown',quoteTime:p.ts||Date.now(),closedAt:Date.now()},
    timeline:[...(p.timeline||[]),{at:Date.now(),type:'EXIT',price:p.live,source:p.src||'Unknown',reason}]
  });
  const justClosed=cfg.closed[cfg.closed.length-1];justClosed.failure=classifyFailure(justClosed);updateShadowTests(justClosed);
  recordAgentLesson(cfg.closed[cfg.closed.length-1]);
  cfg.pos.splice(i, 1);
  save();
  render();
}

function exportTradeHistory() {
  const rows = [['Status','Opened At','Closed At','Underlying','Contract','Side','Setup Tier','Strategy Tag','Option Type','Expiry','Strike','Quantity','Entry Price','Live/Exit Price','Stop Loss','Target','Risk Amount','Reward Amount','R:R Value','Auto-Close Status','Close Reason','Net P&L','P&L %','Fees','Quote Source']];
  const append = (p, closed) => {
    const px = closed ? p.exitPrice : p.live;
    const fees = closed ? (p.feeTotal ?? 2*cfg.fee*p.qty) : 2*cfg.fee*p.qty;
    const pnl = closed ? (p.realizedPL ?? ((px-p.entry)*100*p.qty-fees)) : ((px-p.entry)*100*p.qty-fees);
    const capital = p.entry*100*p.qty;
    const risk = Math.max(0,p.entry-(p.stop||0))*100*p.qty;
    const reward = Math.max(0,(p.tgt||p.entry)-p.entry)*100*p.qty;
    const rr = +(p.rr || (risk ? reward/risk : 0));
    rows.push([closed?'Closed':'Open',new Date(p.openedAt||p.id||Date.now()).toISOString(),closed?new Date(p.closedAt||Date.now()).toISOString():'',p.sym,p.code,sideOf(p),(p.tier ? `${p.tier}${p.score != null ? ' ' + p.score : ''}` : 'Not captured'),(p.m||'intraday').toUpperCase(),p.call?'Call':'Put',p.exp,p.k,p.qty,p.entry,px,p.stop||'',p.tgt||'',risk.toFixed(2),reward.toFixed(2),`1:${rr.toFixed(2)}`,p.autoClose===false?'Disabled':(p.autoClosed?'Triggered':'Armed'),p.closeReason||'',pnl.toFixed(2),capital?(pnl/capital*100).toFixed(2):'0.00',fees.toFixed(2),p.src||'']);
  };
  cfg.pos.forEach(p=>append(p,false));
  cfg.closed.forEach(p=>append(p,true));
  if(rows.length===1){alert('No paper trades to export.');return;}
  const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv='\uFEFF'+rows.map(r=>r.map(esc).join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url; a.download=`AlphaPulse_Trade_History_${new Date().toISOString().slice(0,10)}.csv`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

const tierLabel=p=>p&&p.tier?`${p.tier}${p.score!=null?' '+p.score:''}`:'None';
function tierFilterOptions(list){
  const groups=['Strict','Balanced'];
  let h='<option value="">All tiers</option>';
  groups.forEach(g=>{
    const rows=(list||[]).filter(p=>p.tier===g);
    if(!rows.length)return;
    const counts=new Map();rows.forEach(p=>{const l=tierLabel(p);counts.set(l,(counts.get(l)||0)+1);});
    const items=[...counts.entries()].sort((a,b)=>(parseFloat(b[0].split(' ')[1])||0)-(parseFloat(a[0].split(' ')[1])||0));
    h+=`<optgroup label="${g}"><option value="tier:${g}">All ${g} (${rows.length})</option>${items.map(([l,c])=>`<option value="score:${l}">${l} (${c})</option>`).join('')}</optgroup>`;
  });
  const none=(list||[]).filter(p=>!p.tier).length;
  if(none)h+=`<option value="tier:None">Not captured (${none})</option>`;
  return h;
}

function rPaper() {

function updatePaperLiveDOM() {
  if (tab !== 'paper') return;
  let activeTot = 0, closedTot = 0, totalFees = 0, activeCapital = 0, closedCapital = 0, openWinners = 0;
  cfg.pos.forEach((p, i) => {
    const fee = 2 * cfg.fee * p.qty;
    const pl = (p.live - p.entry) * 100 * p.qty - fee;
    const capital = p.entry * 100 * p.qty;
    const plPct = capital > 0 ? pl / capital * 100 : 0;
    activeTot += pl;
    activeCapital += capital;
    totalFees += fee;
    if (pl >= 0) openWinners++;

    const row = document.querySelector(`.paper-open-row[data-code="${p.code}"]`) || document.querySelectorAll('.paper-open-row')[i];
    if (row) {
      row.dataset.live = p.live;
      row.dataset.profit = pl;
      row.dataset.pnl = pl >= 0 ? 'profit' : 'loss';
      const liveVal = row.querySelector('.paper-live-val');
      if (liveVal) liveVal.textContent = p.live.toFixed(2);
      const liveSrc = row.querySelector('.paper-live-src');
      if (liveSrc) liveSrc.textContent = p.src ? `[${p.src}]` : '';
      const pnlCell = row.querySelector('.paper-pnl-cell');
      if (pnlCell) {
        pnlCell.className = `mono ${pl >= 0 ? 'g' : 'r'} font-weight-bold paper-pnl-cell`;
        pnlCell.innerHTML = `${pl >= 0 ? '+' : ''}${pl.toFixed(2)} <span style="font-size:11px;">(${plPct >= 0 ? '+' : ''}${plPct.toFixed(2)}%)</span>`;
      }
      const stopInp = row.querySelector('input[title="Stop Loss"]');
      if (stopInp && document.activeElement !== stopInp && p.stop) {
        stopInp.value = Number(p.stop).toFixed(2);
      }
    }
  });
  (cfg.closed || []).forEach(p => {
    const fee = p.feeTotal != null ? p.feeTotal : (2 * cfg.fee * p.qty);
    closedTot += Number(p.realizedPL || 0);
    closedCapital += p.entry * 100 * p.qty;
    totalFees += fee;
  });
  const grandTot = activeTot + closedTot;
  const totalCapital = activeCapital + closedCapital;
  const grandPct = totalCapital > 0 ? grandTot / totalCapital * 100 : 0;
  const activePct = activeCapital > 0 ? activeTot / activeCapital * 100 : 0;
  const kComb = document.getElementById('kpiCombined');
  if (kComb) {
    kComb.className = `kpi-val ${grandTot >= 0 ? 'g' : 'r'}`;
    kComb.innerHTML = `${grandTot >= 0 ? '+' : ''}$${grandTot.toFixed(2)} <span style="font-size:14px;">(${grandPct >= 0 ? '+' : ''}${grandPct.toFixed(2)}%)</span>`;
  }
  const kAct = document.getElementById('kpiActive');
  if (kAct) {
    kAct.className = `kpi-val ${activeTot >= 0 ? 'g' : 'r'}`;
    kAct.innerHTML = `${activeTot >= 0 ? '+' : ''}$${activeTot.toFixed(2)} <span style="font-size:14px;">(${activePct >= 0 ? '+' : ''}${activePct.toFixed(2)}%)</span>`;
  }
  const kWin = document.getElementById('kpiOpenWin');
  if (kWin) kWin.innerHTML = `${openWinners} <span class="mu" style="font-size:12px">of ${cfg.pos.length}</span>`;
}

function updatePicksLiveDOM() {
  if (tab !== 'picks') return;
  picks.forEach(p => {
    const row = document.querySelector(`.pick-row[data-code="${p.code}"]`);
    if (!row) return;
    const livePx = Number(p.live) > 0 ? Number(p.live) : Number(p.mid);
    const valEl = row.querySelector('.pick-live-val');
    if (valEl) valEl.textContent = livePx.toFixed(2);
    const srcEl = row.querySelector('.pick-src');
    if (srcEl) srcEl.textContent = p.src || 'Yahoo';
    const baEl = row.querySelector('.pick-ba-cell');
    if (baEl) baEl.textContent = `${p.bid.toFixed(2)} / ${p.ask.toFixed(2)}`;
    const planEl = row.querySelector('.pick-plan-cell');
    if (planEl) planEl.innerHTML = `<span class="r">${p.stop.toFixed(2)}</span> → <span class="g">${p.tgt.toFixed(2)}</span>`;
  });
}

let quoteRefreshBusy=false;
async function refresh() {
  const hasPicks = tab === 'picks' && picks.length > 0;
  if (quoteRefreshBusy || (!cfg.pos.length && !(cfg.livePos && cfg.livePos.length) && !hasPicks) || document.hidden) return;
  quoteRefreshBusy=true;
  try {
  if (hasPicks) {
    const changed = await syncPicksLivePrices();
    if (changed && tab === 'picks') updatePicksLiveDOM();
  }
  const g = {};
  cfg.pos.forEach(p => {
    if (!p.exp || !p.sym) {
      const c = parseContractInput(p.code);
      if (c) { p.sym = p.sym || c.root; p.exp = p.exp || c.expMidTs; p.code = c.occ; }
    }
    if (p.sym && p.exp) (g[p.sym + '|' + p.exp] ??= []).push(p);
  });
  for (const k in g) {
    try {
      const [s, e] = k.split('|');
      const o = (await api(`/api/chain?symbol=${encodeURIComponent(s)}&date=${e}`)).optionChain.result[0].options[0];
      g[k].forEach(p => {
        const c = [...o.calls, ...o.puts].find(x => x.contractSymbol === p.code);
        if (c) {
          const b = c.bid || 0, a = c.ask || 0, l = c.lastPrice || 0;
          p.live = l > 0 ? l : ((b > 0 && a > 0) ? +((b + a) / 2).toFixed(2) : p.live);
          p.src = l > 0 ? 'Yahoo Live' : 'Yahoo Mid';
          p.ts = (c.lastTradeDate || 0) * 1000;
        }
      });
    } catch(e) {}
  }
  for (const p of cfg.pos) {
    try {
      const q = (await api('/api/moomoo/quote?code=' + encodeURIComponent(p.code))).quote;
      if (q && q.last > 0) {
        p.live = q.last;
        p.src = 'Moomoo';
        p.ts = Date.now();
        p.timeline=p.timeline||[];const last=p.timeline.at(-1);if(!last||Date.now()-last.at>=60000)p.timeline.push({at:Date.now(),type:'QUOTE',price:p.live,source:p.src});p.timeline=p.timeline.slice(-120);
      }
    } catch(e) {}
  }
  for (const p of (cfg.livePos || [])) {
    try {
      if (!p.exp || !p.sym) {
        const c = parseContractInput(p.code);
        if (c) { p.sym = p.sym || c.root; p.exp = p.exp || c.expMidTs; p.code = c.occ; }
      }
      const q = (await api('/api/moomoo/quote?code=' + encodeURIComponent(p.code))).quote;
      if (q && q.last > 0) {
        p.live = q.last;
        p.src = 'Moomoo';
        if (p.live > (p.highestSeen || p.entry)) p.highestSeen = p.live;
        evaluateLiveStrikeDecision(p);
      } else if (p.sym && p.exp) {
        const o = (await api(`/api/chain?symbol=${encodeURIComponent(p.sym)}&date=${p.exp}`)).optionChain.result[0]?.options?.[0];
        if (o) {
          const c = [...(o.calls || []), ...(o.puts || [])].find(x => x.contractSymbol === p.code);
          if (c) {
            const b = c.bid || 0, a = c.ask || 0, l = c.lastPrice || 0;
            p.live = l > 0 ? l : ((b > 0 && a > 0) ? +((b + a) / 2).toFixed(2) : p.live);
            p.src = l > 0 ? 'Yahoo Live' : 'Yahoo Mid';
            if (p.live > (p.highestSeen || p.entry)) p.highestSeen = p.live;
            evaluateLiveStrikeDecision(p);
          }
        }
      }
    } catch(e) {}
  }
  const phase = typeof marketPhase === 'function' ? marketPhase() : { code: 'open' };
  const isRthOpen = phase.code === 'open';
  const etNow = typeof etParts === 'function' ? etParts() : null;
  const calNow = etNow && typeof marketCalendar === 'function' ? marketCalendar(etNow.y) : null;
  const closeMins = (etNow && calNow && calNow.early.has(ymd(etNow))) ? 780 : 960;
  const nowMins = etNow ? (etNow.h * 60 + etNow.min) : 0;
  const isEodWindow = isRthOpen && etNow && nowMins >= (closeMins - 5) && nowMins < closeMins;

  const exits = [];
  const targetHitSymbols = new Set();

  cfg.pos.forEach((p, i) => {
    if (p.autoClose === false || !(p.live > 0)) return;
    // Block fake off-hours stop/target triggers on stale quotes when RTH-Only protection is enabled
    if (cfg.rthOnly !== false && !isRthOpen) return;

    // 1. Breakeven Stop-Trail at 0.7R (prevents +32% winners like QQQ 716P from turning into -36% losers)
    if (cfg.breakevenTrail !== false && !p.breakevenArmed && p.entry > 0) {
      const initStop = p.initialStop || p.stop || (p.entry * 0.75);
      const risk = Math.max(0.05, p.entry - initStop);
      const triggerPx = p.target1 || +(p.entry + risk * 0.7).toFixed(2);
      if (p.live >= triggerPx && p.stop < p.entry) {
        armBreakeven(p, '0.7R reached -> Stop trailed to Breakeven', initStop);
      }
    }

    // 2. Check Target, Stop Loss, and Intraday EOD Auto-Square-Off
    if (p.tgt > 0 && p.live >= p.tgt) {
      exits.push({ i, reason: p.breakevenArmed ? 'Auto-close: Target 2 hit' : 'Auto-close: Target hit' });
      targetHitSymbols.add(p.sym);
    } else if (p.stop > 0 && p.live <= p.stop) {
      exits.push({ i, reason: p.breakevenArmed ? 'Auto-close: Breakeven stop hit' : 'Auto-close: Stop loss hit' });
    } else if (cfg.eodSquareOff !== false && (p.m || 'intraday') === 'intraday' && isEodWindow) {
      exits.push({ i, reason: 'Auto-close: Intraday EOD square-off (3:55 PM ET)' });
    }
  });

  // 3. Sibling Protection: if any strike on symbol S hit Target, trail any remaining open position on S to Breakeven
  if (targetHitSymbols.size > 0 && cfg.breakevenTrail !== false) {
    cfg.pos.forEach(p => {
      if (targetHitSymbols.has(p.sym) && p.stop < p.entry) {
        armBreakeven(p, 'Sibling strike hit target -> Stop trailed to Breakeven');
      }
    });
  }
  const pageY=window.scrollY;
  const scrollers=[...document.querySelectorAll('.paper-view .wrap')].map((e,i)=>({i,top:e.scrollTop,left:e.scrollLeft}));
  exits.sort((a,b) => b.i-a.i).forEach(x => closePos(x.i, x.reason));
  save();
  // Update Paper Trading live prices and P&L in place without resetting scroll
  if(tab==='paper'){
    if(exits.length){
      requestAnimationFrame(()=>{window.scrollTo(0,pageY);document.querySelectorAll('.paper-view .wrap').forEach((e,i)=>{const x=scrollers.find(v=>v.i===i);if(x){e.scrollTop=x.top;e.scrollLeft=x.left;}});});
    } else {
      updatePaperLiveDOM();
    }
  }
  if(tab==='live')renderLiveMonitor(); // LiveStrikes premiums update in place; the calculator form is left untouched
  } finally { quoteRefreshBusy=false; }
}

// Sizes the position by BOTH the cash budget and the max-risk-per-trade cap (never less than 1 contract).
function lsFitQty(entry, budget, maxRisk, stopPct) {
  const costPerContract = entry * 100 + cfg.fee;
  const riskPerContract = entry * 100 * (stopPct / 100) + (2 * cfg.fee);
  return Math.max(1, Math.min(Math.floor(budget / costPerContract), Math.floor(maxRisk / riskPerContract)));
}

function lsMetrics(d) {
  const { entry, qty, budget, stopPct, tgtPct, trailPct, limitBufPct } = d;
  const maxRisk = d.maxRisk || 0;
  const capital = entry * 100 * qty;
  const roundtripFee = 2 * cfg.fee * qty;
  const totalOutlay = capital + (cfg.fee * qty);
  const slTrigger = +(entry * (1 - stopPct / 100)).toFixed(2);
  const slLimit = +(slTrigger * (1 - limitBufPct / 100)).toFixed(2);
  const tpLimit = +(entry * (1 + tgtPct / 100)).toFixed(2);
  const trailDrop = +(entry * (trailPct / 100)).toFixed(2);
  const trailFloorInit = +(entry - trailDrop).toFixed(2);
  const breakevenPx = +(entry + (roundtripFee / (100 * qty))).toFixed(2);
  const netProfitAtTp = (tpLimit - entry) * 100 * qty - roundtripFee;
  const netProfitPct = capital > 0 ? (netProfitAtTp / capital) * 100 : 0;
  const netLossAtSl = (slTrigger - entry) * 100 * qty - roundtripFee;
  const netLossPct = capital > 0 ? (netLossAtSl / capital) * 100 : 0;
  const worstLoss = (slLimit - entry) * 100 * qty - roundtripFee; // if the stop-limit fills at its limit price
  const rr = Math.abs(netLossAtSl) > 0 ? Math.abs(netProfitAtTp / netLossAtSl) : 0;
  const prof = LS_PROFILES[d.profile] || {};
  const minRR = prof.minNetRR || 0;
  const riskPctOfBudget = budget > 0 ? Math.abs(netLossAtSl) / budget * 100 : 0;
  const occ = parseOccMeta(d.code);
  const warnings = [];
  if (totalOutlay > budget) warnings.push(`Position cost $${totalOutlay.toFixed(2)} exceeds your $${budget.toFixed(0)} budget.`);
  if (maxRisk > 0 && Math.abs(netLossAtSl) > maxRisk) warnings.push(`Loss at stop is $${Math.abs(netLossAtSl).toFixed(2)}, above your $${maxRisk.toFixed(0)} max risk per trade. Use a cheaper premium, tighter stop, or fewer contracts.`);
  if (minRR && rr < minRR - 0.05) warnings.push(`Net R:R 1:${rr.toFixed(2)} is below the ${d.profile} minimum of 1:${minRR.toFixed(1)}. Raise the target or lower the stop %.`);
  if (budget > 0 && capital / budget > 0.4 && d.profile !== 'advanced') warnings.push(`This one position uses ${(capital / budget * 100).toFixed(0)}% of your budget. Keep a single trade at or below ~40%.`);
  if (occ && d.profile !== 'advanced' && occ.dte < 2) warnings.push(`Only ${occ.dte.toFixed(1)} day(s) to expiry. Theta can eat 40-60% of the premium per day, so prefer 7-30 DTE.`);
  return { capital, roundtripFee, totalOutlay, slTrigger, slLimit, tpLimit, trailDrop, trailFloorInit, breakevenPx,
    netProfitAtTp, netProfitPct, netLossAtSl, netLossPct, worstLoss, rr, minRR, riskPctOfBudget, maxRisk, warnings };
}

function updateLiveStrikeField(i, field, val) {

function emaSeries(arr, period) {
  if (!arr || !arr.length) return [];
  const k = 2 / (period + 1);
  const out = [arr[0]];
  for (let i = 1; i < arr.length; i++) {
    out.push(arr[i] * k + out[i - 1] * (1 - k));
  }
  return out;
}

function macdCalc(closes) {
  if (!closes || closes.length < 26) return { macd: 0, signal: 0, hist: 0 };
  const e12 = emaSeries(closes, 12);
  const e26 = emaSeries(closes, 26);
  const macdLine = closes.map((_, i) => e12[i] - e26[i]);
  const sigLine = emaSeries(macdLine, 9);
  const macd = macdLine.at(-1) || 0;
  const signal = sigLine.at(-1) || 0;
  return { macd, signal, hist: macd - signal };
}

function vwapCalc(highs, lows, closes, vols) {
  if (!closes || !closes.length) return 0;
  let pv = 0, vTot = 0;
  for (let i = 0; i < closes.length; i++) {
    const c = closes[i], h = highs?.[i] ?? c, l = lows?.[i] ?? c, v = vols?.[i] ?? 0;
    if (c == null || !(v > 0)) continue;
    const tp = (h + l + c) / 3;
    pv += tp * v;
    vTot += v;
  }
  return vTot > 0 ? pv / vTot : closes.at(-1);
}

function detectIntradayPattern(opens, highs, lows, closes) {
  const n = closes.length;
  if (n < 4) return 'Neutral Bar';
  const o = opens[n - 1], h = highs[n - 1], l = lows[n - 1], c = closes[n - 1];
  const po = opens[n - 2], ph = highs[n - 2], pl = lows[n - 2], pc = closes[n - 2];
  const body = Math.abs(c - o), range = Math.max(0.001, h - l);
  const upperWick = h - Math.max(o, c), lowerWick = Math.min(o, c) - l;

  if (c > o && pc < po && c >= po && o <= pc) return 'Bullish Engulfing';
  if (c < o && pc > po && c <= po && o >= pc) return 'Bearish Engulfing';
  if (lowerWick > body * 2 && upperWick < body * 0.8) return 'Bullish Hammer / Pinbar';
  if (upperWick > body * 2 && lowerWick < body * 0.8) return 'Shooting Star (Rejection)';
  if (c > ph && pc > highs[n - 3]) return 'Momentum Breakout';
  if (c < pl && pc < lows[n - 3]) return 'Support Breakdown';
  return c >= o ? 'Bullish Continuation' : 'Bearish Pullback';
}

function evaluateLiveStrikeDecision(p) {
  const t = p.ta || {};
  const peak = Math.max(p.entry, p.highestSeen || p.entry, p.live || p.entry);
  p.highestSeen = peak;
  const trailStopPx = +(peak * (1 - (p.trailPct || 12) / 100)).toFixed(2);
  const isCall = p.call !== false;
  // The monitor works any time of day. With the US market closed the premium is the last traded price, so say so.
  const closedNow = typeof marketPhase === 'function' && marketPhase().code !== 'open';
  const closedNote = closedNow ? ' US market is closed, so this uses the last traded premium.' : '';
  const sellNow = closedNow ? 'SELL AT OPEN' : 'SELL NOW';

  // 1. Hard price rules first (Stop Loss, Target, Trailing Stop)
  if (p.live <= p.slPrice) {
    t.action = `${sellNow} · STOP LOSS HIT`;
    t.tone = 'sell';
    t.reason = `Live premium ($${p.live.toFixed(2)}) breached -${p.stopPct}% Stop Loss ($${p.slPrice.toFixed(2)}). Protect capital immediately.${closedNote}`;
    p.ta = t;
    return;
  }
  if (p.live >= p.tgtPrice) {
    t.action = closedNow ? 'SELL AT OPEN / LOCK PROFIT · TARGET HIT' : 'SELL / LOCK PROFIT · TARGET HIT';
    t.tone = 'sell';
    t.reason = `Live premium ($${p.live.toFixed(2)}) reached +${p.tgtPct}% Target ($${p.tgtPrice.toFixed(2)}). Book profit or ratchet stop.${closedNote}`;
    p.ta = t;
    return;
  }
  if (peak > p.entry * 1.06 && p.live <= trailStopPx) {
    t.action = closedNow ? 'SELL AT OPEN · TRAILING STOP TRIGGERED' : 'SELL · TRAILING STOP TRIGGERED';
    t.tone = 'sell';
    t.reason = `Pulled back ${p.trailPct}% from peak ($${peak.toFixed(2)}) to trailing stop ($${trailStopPx.toFixed(2)}).${closedNote}`;
    p.ta = t;
    return;
  }

  // 2. Technical Analysis confluence score (EMA 5/10/20, VWAP, RSI, MACD, Chart Pattern)
  if (!t.e20 || !t.vwap) {
    t.tone = 'warn';
    if (t.status === 'error') {
      t.action = 'NO CHART DATA · SEE REASON';
      t.reason = t.error || 'The 5m chart request failed.';
    } else {
      t.action = 'HOLD · LOADING 5M CHART…';
      t.reason = 'Fetching 5m bars for EMA 5/10/20, VWAP, RSI & MACD. This also works with the market closed (it uses the last session).';
    }
    p.ta = t;
    return;
  }

  let bullPts = 0, bearPts = 0;
  const S = t.lastUnderlying || t.e5;
  // EMA 5 vs 10 vs 20 alignment
  if (t.e5 > t.e10 && t.e10 > t.e20) bullPts += 2;
  else if (t.e5 < t.e10 && t.e10 < t.e20) bearPts += 2;
  else if (t.e5 > t.e10) bullPts += 1;
  else bearPts += 1;

  // Price vs intraday VWAP
  if (S > t.vwap) bullPts += 2; else bearPts += 2;

  // RSI (14)
  if (t.rsi >= 53 && t.rsi <= 74) bullPts += 1;
  else if (t.rsi <= 47 && t.rsi >= 26) bearPts += 1;
  else if (t.rsi > 78) bearPts += 1; // Overbought exhaustion
  else if (t.rsi < 22) bullPts += 1; // Oversold bounce

  // MACD Histogram
  if (t.macdHist > 0) bullPts += 1; else bearPts += 1;

  // Candlestick pattern
  if (/Bullish|Breakout|Hammer/.test(t.pattern)) bullPts += 1;
  if (/Bearish|Breakdown|Shooting/.test(t.pattern)) bearPts += 1;

  const favorPts = isCall ? bullPts : bearPts;
  const againstPts = isCall ? bearPts : bullPts;

  if (favorPts >= 5) {
    t.action = 'KEEP / HOLD STRIKE (STRONG TREND)';
    t.tone = 'keep';
    t.reason = `${isCall ? 'Bullish' : 'Bearish'} alignment: ${isCall ? 'EMA5 > EMA10 > EMA20 & above VWAP' : 'EMA5 < EMA10 < EMA20 & below VWAP'}, MACD ${t.macdHist >= 0 ? '+' : '-'}${Math.abs(t.macdHist).toFixed(3)}, RSI ${t.rsi.toFixed(0)} (${t.pattern}).`;
  } else if (againstPts >= 5) {
    t.action = 'SELL STRIKE (TA REVERSAL)';
    t.tone = 'sell';
    t.reason = `Intraday trend flipped against ${isCall ? 'CALL' : 'PUT'}: EMA 5/10 crossed against EMA 20 & VWAP ($${t.vwap.toFixed(2)}), MACD hist ${t.macdHist.toFixed(3)}, RSI ${t.rsi.toFixed(0)} (${t.pattern}).`;
  } else {
    t.action = 'HOLD WITH TIGHT TRAIL (CHOPPY)';
    t.tone = 'warn';
    t.reason = `Mixed intraday signals (${favorPts} pro vs ${againstPts} against). Keep trailing stop active at $${trailStopPx.toFixed(2)} (${t.pattern}).`;
  }
  if (taIsStale(t)) {
    t.action = 'LAST SESSION · ' + t.action;
    t.reason += ` Chart data is from ${fmtTs(t.barAt)} (market closed or feed delayed); the signal refreshes when new 5m bars arrive.`;
  }
  if (t.status === 'error' && t.error) t.reason += ` (Latest chart refresh failed: ${t.error})`;
  p.ta = t;
}

const TA_STALE_MS = 30 * 60 * 1000; // newest 5m bar older than this = market closed or feed delayed
const taIsStale = t => !!(t && t.barAt) && (Date.now() - t.barAt) > TA_STALE_MS;

// EMA/VWAP/RSI/MACD/pattern from Yahoo's 5-day 5m series. The multi-day bars warm up EMA, RSI and MACD, so they are
// valid at 9:35 AM and after the close. VWAP resets every day, so it uses the latest session only.
function computeIntradayTA(res) {
  const ts = res.timestamp || [], q = res.indicators?.quote?.[0] || {};
  const off = Number(res.meta?.gmtoffset), gmt = Number.isFinite(off) ? off : -14400;
  const bars = [];
  ts.forEach((t, i) => {
    const c = q.close?.[i];
    if (c == null || !Number.isFinite(c)) return;
    bars.push({ t, day: Math.floor((t + gmt) / 86400), o: q.open?.[i] ?? c, h: q.high?.[i] ?? c, l: q.low?.[i] ?? c, c, v: q.volume?.[i] ?? 0 });
  });
  if (bars.length < 6) return null;
  const last = bars.at(-1), session = bars.filter(b => b.day === last.day);
  const closes = bars.map(b => b.c), mc = macdCalc(closes);
  return {
    lastUnderlying: last.c,
    e5: ema(closes, 5), e10: ema(closes, 10), e20: ema(closes, 20),
    vwap: vwapCalc(session.map(b => b.h), session.map(b => b.l), session.map(b => b.c), session.map(b => b.v)),
    rsi: rsi(closes, 14),
    macd: mc.macd, macdSig: mc.signal, macdHist: mc.hist,
    pattern: detectIntradayPattern(bars.map(b => b.o), bars.map(b => b.h), bars.map(b => b.l), closes),
    barAt: last.t * 1000, sessionBars: session.length
  };
}

function taErrorMessage(e, sym) {
  const msg = String((e && e.message) || e || '');
  if (/failed to fetch|networkerror|load failed|abort/i.test(msg)) return `Bridge unreachable at ${cfg.bridge}. Start server.js (node server.js) and check Settings > Local Bridge URL.`;
  if (/^\d{3}$/.test(msg)) return `Chart request for ${sym} failed (HTTP ${msg}). Yahoo may be rate limiting, or the symbol is wrong.`;
  return msg;
}

// Repairs rows saved by earlier versions (code "NFLX 11-06 61P", underlying "NFLX ", wrong expiry key) so they re-sync.
function migrateLivePos() {
  let changed = false;
  (cfg.livePos || []).forEach(p => {
    const c = parseContractInput(p.code, p.openedAt || p.id);
    if (!c) return;
    const fix = { code: c.occ, sym: c.root, call: c.call, k: c.strike, exp: c.expMidTs };
    Object.keys(fix).forEach(key => { if (p[key] !== fix[key]) { p[key] = fix[key]; changed = true; } });
    if (p.ta && p.ta.status !== 'ok') { p.ta.status = 'loading'; p.ta.error = null; }
  });
  if (changed) save();
}

let taBusy = false;
async function updateLiveStrikesTA() {
  if (taBusy || !cfg.livePos || !cfg.livePos.length || document.hidden) return;
  taBusy = true;
  try {
    const bySym = {};
    cfg.livePos.forEach(p => (bySym[p.sym] ??= []).push(p));
    for (const sym of Object.keys(bySym)) {
      try {
        if (!/^[A-Z][A-Z0-9.\-]{0,9}$/.test(sym)) throw new Error(`Underlying "${sym}" is not a valid ticker. Remove this row and re-add it with a recognised contract code.`);
        const ch = await api(`/api/chart?symbol=${encodeURIComponent(sym)}&range=5d&interval=5m`);
        const res = ch?.chart?.result?.[0];
        if (!res) throw new Error(ch?.chart?.error?.description || `Yahoo returned no chart data for ${sym}.`);
        const ta = computeIntradayTA(res);
        if (!ta) throw new Error(`Yahoo returned fewer than 6 five-minute bars for ${sym}.`);
        bySym[sym].forEach(p => { p.ta = { ...(p.ta || {}), ...ta, status: 'ok', error: null, updatedAt: Date.now() }; evaluateLiveStrikeDecision(p); });
      } catch (e) {
        const error = taErrorMessage(e, sym);
        bySym[sym].forEach(p => { p.ta = { ...(p.ta || {}), status: 'error', error }; evaluateLiveStrikeDecision(p); });
      }
    }
    save();
    if (tab === 'live') renderLiveMonitor();
  } finally { taBusy = false; }
}

// Builds the KPI strip and the monitor table separately so they can refresh every few seconds
// without rebuilding (and stealing focus from) the calculator form above them.

  const rows = (cfg.livePos || []).map((p, i) => {
    evaluateLiveStrikeDecision(p);

    const cap = p.entry * 100 * p.qty;
    const grossPL = (p.live - p.entry) * 100 * p.qty;
    const netPL = grossPL - fee;
    const netPLPct = cap > 0 ? (netPL / cap) * 100 : 0;
    const peak = Math.max(p.entry, p.highestSeen || p.entry, p.live || p.entry);
    const trailStopPx = +(peak * (1 - (p.trailPct || 12) / 100)).toFixed(2);
    const slNetPL = (p.slPrice - p.entry) * 100 * p.qty - fee;
    const tpNetPL = (p.tgtPrice - p.entry) * 100 * p.qty - fee;

    totNetPL += netPL;
    totCap += cap;
    totFees += fee;
    const tone = p.ta?.tone;

    const t = p.ta || {};
    return `<tr>
      <td>
        <div class="sym-name">${p.sym} · ${p.code}</div>

        <span style="font-size:11px">(${netPLPct >= 0 ? '+' : ''}${netPLPct.toFixed(2)}%)</span>

      </td>
      <td style="text-align:left;max-width:340px;white-space:normal">
        <div class="ls-signal-box ${t.tone || 'warn'}">${t.action || 'ANALYZING…'}</div>
        <div style="font-size:11px;line-height:1.35;margin-bottom:4px">${t.reason || ''}</div>

          <span class="ls-ta-pill">Spot $${(t.lastUnderlying || 0).toFixed(2)}</span>
          <span class="ls-ta-pill">VWAP $${(t.vwap || 0).toFixed(2)}</span>
          <span class="ls-ta-pill">EMA 5/10/20: ${(t.e5 || 0).toFixed(2)} / ${(t.e10 || 0).toFixed(2)} / ${(t.e20 || 0).toFixed(2)}</span>

          <span class="ls-ta-pill">${t.pattern || '5m Pattern'}</span>
          ${t.barAt ? `<span class="ls-ta-pill" ${taIsStale(t) ? 'style="color:var(--amber)"' : ''}>${taIsStale(t) ? 'Last session' : '5m bars'} · ${fmtTs(t.barAt)}</span>` : ''}

        </div>

  const totNetPct = totCap > 0 ? (totNetPL / totCap) * 100 : 0;

  const kpi = `

    </div>
  </div>`;

  const monitor = `
  <div class="paper-section-head">

  <div class="wrap"><table>
    <thead>

        <th>Moomoo TP / SL-Limit / Trail</th>

    </thead>
    <tbody>
      ${rows || '<tr><td colspan="8" class="mu" style="text-align:center;padding:28px">No contracts in LiveStrikes yet. Configure your premium above and click <b>+ Add Strike to LiveStrikes Monitor</b>.</td></tr>'}

  return { kpi, monitor };
}

  cfg.onePerSymbol = !!$('#ops')?.checked;
  cfg.breakevenTrail = !!$('#bet')?.checked;
  cfg.eodSquareOff = !!$('#eod')?.checked;
  cfg.rthOnly = !!$('#rth')?.checked;
  save();
  ping();
  alert('Settings saved successfully.');
  render();
}

async function mm() {
  const out = $('#mst');
  out.className = 'mu mono';
  try {
    await fetch(cfg.bridge + '/api/moomoo/config', {
      method: 'POST',
      body: JSON.stringify({ key: $('#mk').value, secret: $('#ms').value, host: $('#mh').value, port: +$('#mp').value })
    });
    $('#mk').value = $('#ms').value = '';
    // The login handshake is asynchronous, so poll instead of reading the status once.
    for (let i = 1; i <= 14; i++) {
      out.textContent = 'Connecting to OpenD… ' + i + 's';
      await new Promise(r => setTimeout(r, 1000));
      const s = await api('/api/moomoo/status');
      if (s.connected) {
        out.className = 'g mono';
        out.textContent = '✔ Connected to OpenD at ' + s.host + ':' + s.port;
        ping();
        return;
      }
      if (s.error && s.error !== 'connecting') {
        out.className = 'r mono';
        out.textContent = '✖ ' + s.error;
        return;
      }
    }
    out.className = 'r mono';
    out.textContent = '✖ Timed out waiting for OpenD. Check the bridge terminal for [moomoo] logs.';
  } catch(e) {
    out.className = 'r mono';
    out.textContent = 'Bridge connection failed.';
  }
}

async function ping() {
  try {
    const st = await api('/api/moomoo/status');
    $('#dot').classList.add('online');
    $('#bs').textContent = 'BRIDGE ONLINE' + (st.connected ? ' · MOOMOO LINKED' : '');
    $('#bs').style.color = 'var(--green)';
  } catch(e) {
    $('#dot').classList.remove('online');
    $('#bs').textContent = 'BRIDGE OFFLINE';
    $('#bs').style.color = 'var(--red)';
  }
}

function render() {
  document.body.classList.toggle('paper-view', tab === 'paper');
  $('#v').innerHTML = tab === 'picks' ? rPicks() : tab === 'paper' ? rPaper() : tab === 'live' ? rLive() : rSet();
  if(tab === 'paper') requestAnimationFrame(()=>{syncPaperView();const vals={pfSearch:paperUI.search,pfSymbol:paperUI.symbol,pfSide:paperUI.side,pfTier:paperUI.tier,pfPnl:paperUI.pnl,pfSort:paperUI.sort,hfFrom:paperUI.from,hfTo:paperUI.to,hfSort:paperUI.historySort,hfTier:paperUI.histTier};Object.entries(vals).forEach(([id,v])=>{const e=document.getElementById(id);if(e)e.value=v;});applyPaperFilters();applyHistoryFilters();});
  if(tab === 'live') requestAnimationFrame(()=>updateLsCalculatorPreview());
  ['picks', 'paper', 'live', 'set'].forEach(t => {
    const el = document.getElementById('btn-' + t);
    if (el) el.classList.toggle('on', tab === t);
  });
}


// Display-only U.S. market session clock. This does not affect Auto-Picks or trading logic.
const ET_ZONE = 'America/New_York';
const etPartsFmt = new Intl.DateTimeFormat('en-US', {timeZone:ET_ZONE, year:'numeric', month:'2-digit', day:'2-digit', weekday:'short', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'});
const etClockFmt = new Intl.DateTimeFormat('en-US', {timeZone:ET_ZONE, weekday:'short', month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', timeZoneName:'short', hour12:true});
function etParts(d=new Date()) { const o={}; etPartsFmt.formatToParts(d).forEach(x=>{if(x.type!=='literal')o[x.type]=x.value}); return {y:+o.year,m:+o.month,d:+o.day,wd:o.weekday,h:+o.hour,min:+o.minute,s:+o.second}; }
function ymd(p){return `${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`}
function nthWeekday(y,m,weekday,n){let d=new Date(Date.UTC(y,m-1,1)),shift=(weekday-d.getUTCDay()+7)%7;return 1+shift+7*(n-1)}
function lastWeekday(y,m,weekday){let d=new Date(Date.UTC(y,m,0));return d.getUTCDate()-((d.getUTCDay()-weekday+7)%7)}
function easterUTC(y){let a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,n=Math.floor((a+11*h+22*l)/451),m=Math.floor((h+l-7*n+114)/31),day=(h+l-7*n+114)%31+1;return new Date(Date.UTC(y,m-1,day))}
function observed(y,m,d){let x=new Date(Date.UTC(y,m-1,d)),w=x.getUTCDay();if(w===6)x.setUTCDate(x.getUTCDate()-1);if(w===0)x.setUTCDate(x.getUTCDate()+1);return `${x.getUTCFullYear()}-${String(x.getUTCMonth()+1).padStart(2,'0')}-${String(x.getUTCDate()).padStart(2,'0')}`}
function marketCalendar(y){const z=(m,d)=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`, closed=new Set();closed.add(observed(y,1,1));closed.add(z(1,nthWeekday(y,1,1,3)));closed.add(z(2,nthWeekday(y,2,1,3)));let gf=easterUTC(y);gf.setUTCDate(gf.getUTCDate()-2);closed.add(`${gf.getUTCFullYear()}-${String(gf.getUTCMonth()+1).padStart(2,'0')}-${String(gf.getUTCDate()).padStart(2,'0')}`);closed.add(z(5,lastWeekday(y,5,1)));closed.add(observed(y,6,19));closed.add(observed(y,7,4));closed.add(z(9,nthWeekday(y,9,1,1)));closed.add(z(11,nthWeekday(y,11,4,4)));closed.add(observed(y,12,25));const thanks=nthWeekday(y,11,4,4), early=new Set([z(11,thanks+1)]);let xmas=new Date(Date.UTC(y,11,25)),cw=xmas.getUTCDay();if(cw>=2&&cw<=5)early.add(z(12,24));return {closed,early}}
function marketPhase(date=new Date()){const p=etParts(date),key=ymd(p),cal=marketCalendar(p.y),mins=p.h*60+p.min,weekend=p.wd==='Sat'||p.wd==='Sun',holiday=cal.closed.has(key),close=cal.early.has(key)?780:960;if(weekend)return {code:'closed',label:'US MARKET · CLOSED',detail:'Weekend'};if(holiday)return {code:'closed',label:'US MARKET · CLOSED',detail:'Market holiday'};if(mins>=570&&mins<close)return {code:'open',label:'US MARKET · OPEN',detail:cal.early.has(key)?'Early close 1:00 PM ET':'Closes 4:00 PM ET'};if(mins>=240&&mins<570)return {code:'extended',label:'US MARKET · PRE-MARKET',detail:'Regular open 9:30 AM ET'};if(mins>=close&&mins<1200)return {code:'extended',label:'US MARKET · AFTER-HOURS',detail:'Extended session to 8:00 PM ET'};return {code:'closed',label:'US MARKET · CLOSED',detail:'Next regular session pending'}}
// Local-time display: market status still follows New York hours, but every time shown is in the viewer's own timezone.
const localClockFmt = new Intl.DateTimeFormat(undefined, {weekday:'short', month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', timeZoneName:'short'});
const localEventFmt = new Intl.DateTimeFormat(undefined, {weekday:'short', hour:'numeric', minute:'2-digit'});
const localTimeFmt = new Intl.DateTimeFormat(undefined, {hour:'numeric', minute:'2-digit'});
// Converts a New York wall-clock time to the real instant (handles EDT/EST automatically).
function etWall(y,m,d,h,min){const want=Date.UTC(y,m-1,d,h,min);let t=want;for(let i=0;i<3;i++){const p=etParts(new Date(t));t-=Date.UTC(p.y,p.m-1,p.d,p.h,p.min)-want}return new Date(t)}
// Next regular-session boundary: today's close while open, otherwise the next trading-day open.
function nextMarketEvent(now=new Date()){
  const p=etParts(now),key=ymd(p),cal0=marketCalendar(p.y);
  if(!(p.wd==='Sat'||p.wd==='Sun')&&!cal0.closed.has(key)){
    const early=cal0.early.has(key),cm=early?780:960,open=etWall(p.y,p.m,p.d,9,30),close=etWall(p.y,p.m,p.d,Math.floor(cm/60),cm%60);
    if(now>=open&&now<close)return {kind:'close',at:close,early};
  }
  for(let i=0;i<=10;i++){
    const x=new Date(Date.UTC(p.y,p.m-1,p.d+i)),y=x.getUTCFullYear(),m=x.getUTCMonth()+1,d=x.getUTCDate(),wd=x.getUTCDay();
    if(wd===0||wd===6)continue;
    if(marketCalendar(y).closed.has(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`))continue;
    const open=etWall(y,m,d,9,30);
    if(open>now)return {kind:'open',at:open};
  }
  return null;
}
function fmtLocalEvent(d,now){return d.toDateString()===now.toDateString()?localTimeFmt.format(d):localEventFmt.format(d)}
function fmtDur(ms){const m=Math.max(0,Math.floor(ms/60000)),d=Math.floor(m/1440),h=Math.floor(m%1440/60);return d?`${d}d ${h}h`:`${h}h ${m%60}m`}
function updateMarketClock(){
  const now=new Date(),phase=marketPhase(now),led=$('#market-led'),state=$('#market-state'),time=$('#market-time'),next=$('#market-next'),box=$('#us-market-clock');
  if(!led||!state||!time||!next)return;
  led.className='market-led '+phase.code;
  state.textContent=phase.label;
  state.style.color=phase.code==='open'?'var(--green)':phase.code==='extended'?'var(--amber)':'var(--red)';
  time.textContent=localClockFmt.format(now);
  const ev=nextMarketEvent(now),note=(phase.detail==='Weekend'||phase.detail==='Market holiday')?phase.detail+' · ':'';
  next.textContent=ev?`${note}${ev.kind==='close'?'Closes':'Opens'} ${fmtLocalEvent(ev.at,now)}${ev.early?' (early)':''} · in ${fmtDur(ev.at-now)}`:phase.detail;
  if(box)box.title='U.S. equities session (holiday and early-close aware) · times shown in your local time · New York now: '+etClockFmt.format(now);
}
