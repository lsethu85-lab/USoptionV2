}
@media (prefers-color-scheme: light) {

    --bg: #f4f6fa;
    --surface: #ffffff;
    --surface-raised: #f8fafc;
    --surface2: #f1f5f9;
    --border: #dbe2ea;
    --border-focus: #2563eb;
    --accent: #2563eb;
    --tx-main: #0f172a;
    --tx: #0f172a;
    --tx-muted: #64748b;
    --tx-faint: #94a3b8;
    --green: #059669;
    --green-bg: #ecfdf5;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --blue: #2563eb;
    --blue-bg: #eff6ff;
    --amber: #d97706;
    --amber-bg: #fffbeb;
    --purple: #7c3aed;
    --purple-bg: #f5f3ff;
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: auto; }
body {
  margin: 0;
  min-height: 100vh;
  overflow-y: scroll;
  background: var(--bg);
  color: var(--tx-main);
  font: 13px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  gap: 12px;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.5px;
}
.brand-badge {
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  color: #fff;
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 4px;
  font-weight: 800;
  letter-spacing: 1px;
}
nav { display: flex; gap: 6px; flex-wrap: wrap; }
.btn {
  background: var(--surface-raised);
  color: var(--tx-main);
  border: 1px solid var(--border);
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 500;
  font-size: 12px;
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:hover { background: var(--border); }
.btn.on, .btn.pri {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.btn.sm { padding: 3px 8px; font-size: 11px; }
.btn.danger { color: var(--red); border-color: rgba(239,68,68,0.3); }
.btn.danger:hover { background: var(--red-bg); }
.status-pill {
  font-size: 11px;
  color: var(--tx-muted);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 8px var(--red);
}
.dot.online {
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
}
main {
  padding: 18px 20px;
  max-width: 1440px;
  margin: auto;
}
.kpi-deck {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
}
.ws{display:flex;flex-direction:column;gap:6px;font:11.5px/1.35 var(--mono)}
.ws .a{color:var(--amber)}.ws .mu{color:var(--tx-muted)}
.ws-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 8px;background:var(--surface-raised);border:1px solid var(--border);border-radius:3px}
.ws-sep{width:1px;align-self:stretch;background:var(--border);margin:0 4px}
.ws-stat{display:flex;flex-direction:column;padding:0 10px;min-width:70px}
.ws-stat i{font-style:normal;font-size:9.5px;color:var(--tx-muted);text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center}
.ws-stat b{font-size:13px}
.ws-btn{background:var(--surface);color:var(--tx-main);border:1px solid var(--border);border-radius:2px;padding:3px 8px;font:600 11px var(--mono);cursor:pointer;display:inline-flex;align-items:center}
.ws-btn:hover{border-color:var(--accent)}.ws-btn.g{color:var(--green);border-color:var(--green)}.ws-btn.r{color:var(--red);border-color:var(--red)}
.ws-main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:6px}
@media(max-width:1100px){.ws-main{grid-template-columns:1fr}}
.ws-panel{background:var(--surface);border:1px solid var(--border);border-radius:3px;min-width:0}
.ws-ph{display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--surface-raised);border-bottom:1px solid var(--border);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.ws-tabs{gap:0;padding:0 8px 0 0}.ws-tabs>button:not(.ws-btn){background:none;border:0;border-bottom:2px solid transparent;color:var(--tx-muted);font:700 11px var(--mono);text-transform:uppercase;padding:7px 14px;cursor:pointer}
.ws-tabs>button.on{color:var(--tx-main);border-bottom-color:var(--accent)}
.ws-scroll{overflow:auto;max-height:340px}
.ws-t{width:100%;border-collapse:collapse}
.ws-t th{position:sticky;top:0;background:var(--surface-raised);text-align:left;padding:4px 6px;font-size:10px;color:var(--tx-muted);text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap}
.ws-t td{padding:3px 6px;border-bottom:1px solid var(--border);white-space:nowrap}
.ws-t tr:nth-child(even) td{background:rgba(127,127,127,.05)}.ws-t tr:hover td{background:var(--blue-bg)}
.ws-in,.ws-pg input[type=number]{width:62px;background:var(--surface-raised);color:var(--tx-main);border:1px solid var(--border);border-radius:2px;padding:2px 4px;font:11px var(--mono)}
.ws-pg h4{margin:0;padding:4px 8px;background:var(--surface2);font-size:10px;text-transform:uppercase;color:var(--tx-muted);letter-spacing:.5px}
.ws-pg label{display:flex;align-items:center;padding:3px 8px;border-bottom:1px solid var(--border)}.ws-pg label input{margin-left:auto}
.ws-pg textarea{width:100%;background:var(--surface-raised);color:var(--tx-main);border:1px solid var(--border);border-radius:2px;font:10.5px var(--mono);padding:4px}
.ws-perf{display:grid;grid-template-columns:260px minmax(0,1fr) 200px;gap:10px;padding:0 8px 8px}@media(max-width:1000px){.ws-perf{grid-template-columns:1fr}}
.ws-sb{display:flex;flex-wrap:wrap;gap:16px;padding:3px 8px;background:var(--surface-raised);border:1px solid var(--border);border-radius:3px;font-size:10.5px;color:var(--tx-muted)}
.qh{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:5px;border-radius:50%;background:var(--border);color:var(--tx-main);font:700 10px var(--mono);cursor:help;position:relative;text-transform:none;letter-spacing:0}
.qh:hover::after,.qh:focus::after{content:attr(data-tip);position:absolute;left:0;top:130%;width:250px;padding:8px 10px;background:var(--surface-raised);border:1px solid var(--border);border-radius:8px;font:400 11px/1.45 system-ui,sans-serif;color:var(--tx-main);z-index:60;white-space:normal;text-align:left;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.kpi-label { font-size: 11px; color: var(--tx-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.kpi-val { font-size: 20px; font-weight: 700; font-family: var(--mono); margin-top: 4px; }
.wrap {
  overflow-x: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
}
table {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}
th, td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  text-align: right;
  white-space: nowrap;
}
th {
  background: var(--surface-raised);
  color: var(--tx-muted);
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
th:first-child, td:first-child { text-align: left; }
.tag {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  font-family: var(--mono);
}
.tag.Strict { background: var(--green-bg); color: var(--green); border: 1px solid rgba(16,185,129,0.25); }
.tag.Balanced { background: var(--blue-bg); color: var(--blue); border: 1px solid rgba(59,130,246,0.25); }
.tag.Aggressive { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(245,158,11,0.25); }
.tag.Strategy { background: var(--purple-bg); color: var(--purple); border: 1px solid rgba(168,85,247,0.3); }
.tag.Buy { background: var(--green-bg); color: var(--green); border: 1px solid rgba(16,185,129,0.25); }
.tag.Sell { background: var(--red-bg); color: var(--red); border: 1px solid rgba(239,68,68,0.25); }
.sym-name { font-weight: 700; color: var(--tx-main); }
.sym-sub { font-size: 11px; color: var(--tx-muted); }
.g { color: var(--green); }
.r { color: var(--red); }
.amber { color: var(--amber); }
.mu { color: var(--tx-muted); }
.mono { font-family: var(--mono); }
input, select {
  background: var(--surface-raised);
  color: var(--tx-main);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 4px 8px;
  font-family: var(--mono);
  font-size: 12px;
}
input { width: 82px; text-align: right; }
input:focus, select:focus { border-color: var(--border-focus); outline: none; }
.set { background: var(--surface); padding: 20px; border-radius: 8px; border: 1px solid var(--border); }
.set label { display: block; margin: 14px 0 4px; color: var(--tx-muted); font-size: 12px; font-weight: 600; }
.set input { width: 100%; max-width: 500px; text-align: left; padding: 7px 10px; }
.row { display: flex; gap: 8px; margin: 0 0 12px; flex-wrap: wrap; align-items: center; }
.actions-cell { display: flex; gap: 4px; justify-content: flex-end; flex-wrap: wrap; }

.header-right { display:flex; align-items:center; justify-content:flex-end; gap:14px; margin-left:auto; }
.market-clock { display:flex; align-items:center; gap:9px; padding:6px 10px; border:1px solid var(--border); border-radius:7px; background:var(--surface-raised); min-width:270px; }
.market-led { width:8px; height:8px; border-radius:50%; background:var(--tx-faint); box-shadow:0 0 7px var(--tx-faint); flex:0 0 auto; }
.market-led.open { background:var(--green); box-shadow:0 0 8px var(--green); }
.market-led.extended { background:var(--amber); box-shadow:0 0 8px var(--amber); }
.market-led.closed { background:var(--red); box-shadow:0 0 8px var(--red); }
.market-main { min-width:0; }
.market-state { font:700 11px/1.25 var(--mono); letter-spacing:.35px; }
.market-meta { color:var(--tx-muted); font:10px/1.35 var(--mono); white-space:nowrap; }
@media (max-width:760px) { .header-right { width:100%; justify-content:space-between; } .market-clock { min-width:0; flex:1; } }

/* Paper Trading Layout */
.paper-view main#v { max-width:1280px; }
.paper-intro { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
.paper-intro h2 { margin:0 0 4px; font-size:22px; }
.paper-toolbar { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }
.paper-section-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:16px 0 10px; flex-wrap:wrap; }
.paper-section-title { font-size:14px; font-weight:800; letter-spacing:.4px; }
.paper-view .wrap { overflow:visible; background:transparent; border:0; box-shadow:none; }
.paper-view table, .paper-view tbody { display:block; width:100%; }
.paper-view thead { display:none; }
.paper-view tr { display:grid; grid-template-columns:minmax(230px,1.6fr) repeat(2,minmax(110px,.7fr)) minmax(90px,.5fr) minmax(140px,.8fr); gap:0; margin-bottom:12px; background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.08); }
.paper-view td { min-width:0; padding:11px 13px; border:0; border-right:1px solid var(--border); border-bottom:1px solid var(--border); text-align:left; white-space:normal; overflow-wrap:anywhere; }
.paper-view td:first-child { grid-row:span 2; }
.paper-view td:last-child { border-right:0; }
.paper-view td::before { content:attr(data-label); display:block; margin-bottom:5px; color:var(--tx-muted); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.45px; }
.paper-view td:first-child::before { content:'Contract'; }
.paper-view .actions-cell { justify-content:flex-start; flex-wrap:wrap; }
.paper-view input { width:78px; max-width:100%; }
@media (max-width:900px) {
  .paper-view tr { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .paper-view td:first-child { grid-column:1/-1; grid-row:auto; }
  .paper-intro { flex-direction:column; }
  .paper-toolbar { justify-content:flex-start; }
}
@media (max-width:560px) {
  header { padding:10px 12px; }
  nav { width:100%; }
  nav .btn { flex:1 1 auto; justify-content:center; }
  main { padding:14px 12px; }
  .paper-view tr { display:block; }
  .paper-view td { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; border-right:0; }
  .paper-view td::before { flex:0 0 108px; margin:0; }
  .paper-view td:first-child { display:block; }
  .paper-view td:first-child::before { margin-bottom:5px; }
  .paper-view .kpi-deck { grid-template-columns:1fr 1fr; }
}

.paper-view-toggle.active { background:var(--accent); color:#fff; border-color:var(--accent); }
@media(min-width:901px){
 body.paper-view.paper-compact .wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface);max-height:62vh}
 body.paper-view.paper-compact table{display:table;width:100%;min-width:1120px;table-layout:fixed;border-collapse:collapse}
 body.paper-view.paper-compact thead{display:table-header-group;position:sticky;top:0;z-index:4}
 body.paper-view.paper-compact tbody{display:table-row-group}

 body.paper-view.paper-compact th,body.paper-view.paper-compact td{display:table-cell;padding:8px 7px;border:0;border-bottom:1px solid var(--border);border-right:1px solid var(--border);font-size:11px;vertical-align:middle}
 body.paper-view.paper-compact td::before{display:none}
 body.paper-view.paper-compact th{font-size:10px;text-align:left;background:var(--surface2);border-bottom:2px solid var(--accent)}
 body.paper-view.paper-compact input,body.paper-view.paper-compact select{width:100%;min-width:0;padding:4px;font-size:11px}
}

.scanner-toggle.running { background:var(--green); color:#fff; border-color:var(--green); }
.scanner-toggle.paused { background:var(--amber-bg); color:var(--amber); border-color:rgba(245,158,11,.45); }

<script type="text/plain" id="bridge">
const http = require('http'), PORT = process.env.PORT || 8787, UA = { 'User-Agent': 'Mozilla/5.0' };
let cookie = '', crumb = '';
let moomoo = { key: process.env.MOOMOO_KEY || '', secret: process.env.MOOMOO_SECRET || '', host: '127.0.0.1', port: 33333 };
async function auth() {
  const r = await fetch('https://fc.yahoo.com', { headers: UA, redirect: 'manual' });
  cookie = (r.headers.getSetCookie?.() || []).map(c => c.split(';')[0]).join('; ');
  crumb = await (await fetch('https://query1.finance.yahoo.com/v1/test/getcrumb', { headers: { ...UA, cookie } })).text();
}
async function yf(path) {
  for (let i = 0; i < 2; i++) {
    if (!crumb) await auth();
    const r = await fetch('https://query2.finance.yahoo.com' + path + (path.includes('?') ? '&' : '?') + 'crumb=' + encodeURIComponent(crumb), { headers: { ...UA, cookie } });
    if (r.ok) return r.json();
    crumb = '';
  }
  throw new Error('Yahoo request failed');
}

let mm = null, mmReady = false, mmErr = '', subd = new Set(), mmTimer = null;
function pbInit(ab) {
  const u = new Uint8Array(ab), o = {}; let i = 0;
  const vi = () => { let r = 0n, s = 0n, b; do { b = u[i++]; r |= BigInt(b & 127) << s; s += 7n; } while (b & 128); return r; };
  while (i < u.length) {
    const t = Number(vi()), f = t >> 3, w = t & 7;
    if (w === 0) { const v = vi(); if (f === 1) o.retType = Number(BigInt.asIntN(32, v)); if (f === 3) o.errCode = Number(BigInt.asIntN(32, v)); }
    else if (w === 2) { const n = Number(vi()); if (f === 2) o.retMsg = Buffer.from(u.subarray(i, i + n)).toString('utf8'); i += n; }
    else if (w === 1) i += 8; else if (w === 5) i += 4; else break;
  }
  return o;
}
function mmClose() {
  clearTimeout(mmTimer);
  try { if (mm && typeof mm.stop === 'function') mm.stop(); } catch (e) {}
  mm = null; mmReady = false;
}
function mmConnect() {
  mmClose();
  let M;
  try { M = require('moomoo-api'); }
  catch (e) { mmErr = 'moomoo-api not installed. Run: npm i moomoo-api'; return; }
  try {
    const C = M.default || M, me = new C();
    let refusal = null;
    mm = me; subd.clear(); mmErr = 'connecting';
    me.onlogin = (ret, msg) => {
      if (mm !== me) return;
      clearTimeout(mmTimer);
      mmReady = !!ret;
      if (ret) mmErr = '';
      else if (refusal) mmErr = 'OpenD refused: ' + (refusal.retMsg || 'no message') + ' (code ' + refusal.retType + ')';
      else mmErr = 'OpenD login failed: ' + (msg || 'check WebSocket key and port');
    };
    me.start(moomoo.host, +moomoo.port, false, moomoo.key);
    const wb = me.websock;
    if (wb && typeof wb.sendBuff === 'function') {
      const orig = wb.sendBuff.bind(wb);
      wb.sendBuff = (cmd, buf, t) => {
        const p = orig(cmd, buf, t);
        return cmd !== 1 ? p : p.then(r => { try { if (r && r.buff) { const d = pbInit(r.buff); if (d.retType !== undefined && d.retType !== 0) refusal = d; } } catch (e) {} return r; });
      };
    }
    mmTimer = setTimeout(() => {
      if (mm === me && !mmReady && mmErr === 'connecting')
        mmErr = 'No login response from OpenD at ' + moomoo.host + ':' + moomoo.port + ' after 8s.';
    }, 8000);
  } catch (e) { mm = null; mmErr = e.message; }
}
process.on('uncaughtException', e => { console.error('[bridge]', e.message); if (mm && !mmReady) mmErr = 'OpenD connection error: ' + e.message; });
process.on('unhandledRejection', e => { console.error('[bridge]', e && e.message || e); if (mm && !mmReady) mmErr = 'OpenD connection error: ' + (e && e.message || e); });

function toMoomooOptionCodes(raw) {
  const s = String(raw || '').toUpperCase().trim().replace(/^US[.:]/, '').replace(/-US$/, '').replace(/\s+/g, '');
  const m = /^([A-Z]{1,6})(\d{6}[CP])(\d{1,8})$/.exec(s);
  if (!m) return null;
  const root = m[1], ymdcp = m[2], d = m[3];
  const strikeMill = d.length === 8 ? parseInt(d, 10) : (d.length >= 5 ? parseInt(d, 10) : parseInt(d, 10) * 1000);
  const compact = `${root}${ymdcp}${strikeMill}`;
  const occ = `${root}${ymdcp}${String(strikeMill).padStart(8, '0')}`;
  return { compact, occ, candidates: compact === occ ? [compact] : [compact, occ] };
}
async function moomooQuote(code) {
  const parsed = toMoomooOptionCodes(code);
  if (!parsed || !mm || !mmReady) return null;
  for (const c of parsed.candidates) {
    const sec = { market: 11, code: c };
    try {
      if (!subd.has(sec.code)) {
        await mm.Sub({ c2s: { securityList: [sec], subTypeList: [1, 2], isSubOrUnSub: true, isRegOrUnRegPush: false } });
        subd.add(sec.code);
      }
      const res = await mm.GetBasicQot({ c2s: { securityList: [sec] } });
      const q = res?.s2c?.basicQotList?.[0];
      if (q && (Number(q.curPrice) > 0 || Number(q.lastClosePrice) > 0 || Number(q.openPrice) > 0)) {
        let bid = 0, ask = 0;
        try {
          const ob = (await mm.GetOrderBook({ c2s: { security: sec, num: 1 } }))?.s2c;
          bid = Number(ob?.orderBookBidList?.[0]?.price || 0);
          ask = Number(ob?.orderBookAskList?.[0]?.price || 0);
        } catch (e) {}
        const last = Number(q.curPrice) > 0 ? Number(q.curPrice) : (bid > 0 && ask > 0 ? +((bid + ask) / 2).toFixed(2) : Number(q.lastClosePrice) || 0);
        if (last > 0) return {
          last, curPrice: Number(q.curPrice || 0), bid, ask, volume: Number(q.volume || 0),
          oi: Number(q.optionExData?.openInterest || 0), oiIncrement: Number(q.optionExData?.netOpenInterest || 0),
          iv: Number(q.optionExData?.impliedVolatility || 0) / 100,
          delta: Number(q.optionExData?.delta || 0), theta: Number(q.optionExData?.theta || 0),
          gamma: Number(q.optionExData?.gamma || 0), vega: Number(q.optionExData?.vega || 0),
          code: c, occ: parsed.occ
        };
      }
    } catch (e) { mmErr = e.message; }
  }
  return null;
}

async function moomooOrderFlow(code){const p=toMoomooOptionCodes(code);if(!p||!mm||!mmReady)return{code,ticks:[],error:mmErr||'Moomoo OpenD not connected'};for(const c of p.candidates){const sec={market:11,code:c};try{const sk='T:'+c;if(!subd.has(sk)){await mm.Sub({c2s:{securityList:[sec],subTypeList:[4],isSubOrUnSub:true,isRegOrUnRegPush:false}});subd.add(sk)}const r=await mm.GetTicker({c2s:{security:sec,maxRetNum:1000}}),a=r?.s2c?.tickerList||[];const ticks=a.map(x=>({seq:String(x.sequence||''),time:String(x.time||''),ts:+x.timestamp||0,price:+x.price||0,volume:+x.volume||0,direction:x.dir??x.tickerDirection??x.direction??0})).filter(x=>x.price>0&&x.volume>0);if(ticks.length)return{code:c,ticks,at:Date.now()}}catch(e){mmErr=e.message}}return{code,ticks:[],error:mmErr||'No tick data'}}
async function moomooOrderBook(code){const p=toMoomooOptionCodes(code);if(!p||!mm||!mmReady)return{code,bids:[],asks:[],error:mmErr||'Moomoo OpenD not connected'};for(const c of p.candidates){const sec={market:11,code:c};try{const sk='B:'+c;if(!subd.has(sk)){await mm.Sub({c2s:{securityList:[sec],subTypeList:[2],isSubOrUnSub:true,isRegOrUnRegPush:false}});subd.add(sk)}const r=await mm.GetOrderBook({c2s:{security:sec,num:10}}),x=r?.s2c||r||{},norm=a=>(a||[]).map(z=>({price:+(z.price??z[0])||0,volume:+(z.volume??z[1])||0,orders:+(z.orderCount??z.orderNum??z[2])||0})).filter(z=>z.price>0);const bids=norm(x.orderBookBidList||x.bidList||x.Bid),asks=norm(x.orderBookAskList||x.askList||x.Ask);if(bids.length||asks.length)return{code:c,bids,asks,at:Date.now()}}catch(e){mmErr=e.message}}return{code,bids:[],asks:[],error:mmErr||'No order book data'}}
if (moomoo.key) mmConnect();

const E = encodeURIComponent;
const routes = {
  '/api/chain': q => yf(`/v7/finance/options/${E(q.symbol)}` + (q.date ? `?date=${q.date}` : '')),
  '/api/quote': q => yf(`/v7/finance/quote?symbols=${E(q.symbols)}`),
  '/api/chart': q => yf(`/v8/finance/chart/${E(q.symbol)}?range=${q.range || '6mo'}&interval=${q.interval || '1d'}`),
  '/api/moomoo/quote': async q => ({ quote: await moomooQuote(q.code) }),
  '/api/moomoo/orderflow': q => moomooOrderFlow(q.code),
  '/api/moomoo/orderbook': q => moomooOrderBook(q.code),
  '/api/moomoo/status': async () => ({ configured: !!moomoo.key, connected: mmReady, error: mmErr, host: moomoo.host, port: moomoo.port })
};

http.createServer(async (req, res) => {
  res.setHeader('Access-Control-Allow-Origin', '*');
  res.setHeader('Access-Control-Allow-Headers', 'content-type');
  if (req.method === 'OPTIONS') return res.end();
  const u = new URL(req.url, 'http://x'), q = Object.fromEntries(u.searchParams);
  const send = (c, o) => { res.writeHead(c, { 'Content-Type': 'application/json' }); res.end(JSON.stringify(o)); };
  try {
    if (req.method === 'POST' && u.pathname === '/api/moomoo/config') {
      let b = ''; for await (const chunk of req) b += chunk; const c = JSON.parse(b || '{}');
      for (const k of ['key', 'secret', 'host', 'port']) if (c[k] !== undefined && c[k] !== '' && c[k] !== null) moomoo[k] = c[k];
      mmConnect();
      return send(200, { ok: true });
    }
    const h = routes[u.pathname];
    if (!h) return send(404, { error: 'not found' });
    send(200, await h(q));
  } catch (e) { send(500, { error: e.message }); }
}).listen(PORT, '127.0.0.1', () => console.log('Bridge on http://127.0.0.1:' + PORT));
</script>

<script>
const $ = s => document.querySelector(s);

function clampNum(v, min, max, def, o = {}) {
  let n = Number(v);
  if (!Number.isFinite(n) || (!n && !o.allowZero)) n = def;
  n = Math.min(max, Math.max(min, n));
  return o.round ? Math.round(n) : n;
}

// Single authoritative Sniper Policy (80%+ win-rate threshold)
const AUTO_PICK_POLICY = Object.freeze({
  premiumMin: 0.50,
  premiumMax: 5.00,
  strictMin: 85,
  balancedMin: 78,
  maxSpreadPct: 0.05,
  minVolume: 300,
  minOI: 500,
  maxBEvsExpMove: 0.70,   // single leg: break-even distance must be <= 0.70x the 1-sigma expected move to expiry
  maxStraddleBE: 1.00,    // straddle: cheaper leg-pair break-even must be <= 1.0x the expected move
  eventBlackoutBeforeMin: 45, eventBlackoutAfterMin: 15,  // no new auto entries around high/med impact events
  zeroDteCutoffMin: 870,   // 2:30pm ET: no new expiry-day entries
  maxBurnPctHr: 30,        // expiry day: extrinsic burn per remaining trading hour, % of premium
  maxBurnPctDayIntraday: 25, maxBurnPctDaySwing: 10,  // 1+ DTE: theta per day, % of premium
  minGammaTheta: 0.40,     // expected 1-day gamma gain (at realised vol) vs 1-day theta
  ivRichRatio: 1.2, ivCrushRatio: 1.6,  // IV / historical vol when an event sits inside the contract life
  parityTol: 0.02,        // mid may not sit more than $0.02 below intrinsic (stale / crossed quote)
  scanMs: 30000
});

let cfg = {
  bridge: 'http://localhost:8787',
  uni: 'SPY,QQQ,IWM,AAPL,MSFT,NVDA,TSLA,AMZN,META',
  fee: 0.69,
  strictRR: 1.5,
  balancedRR: 1.5,
  stopPct: 20,
  maxOpenPos: 3,
  cooldownMins: 30,
  onePerSymbol: true,
  breakevenTrail: true,
  eodSquareOff: true,
  rthOnly: true,
  accountSize: 500,
  riskPct: 5.0,
  maxDailyLossPct: 10.0,
  maxTradesDay: 5,
  maxLossesDay: 2,
  maxClusterPositions: 2,
  pos: [],
  closed: [],
  stratPos: [],
  stratClosed: [],
  stratAutoRoute: true,
  livePos: [],
  autoPickExecuted: {},
  stratAutoExecuted: {},
  superAgent: { enabled: true, history: [], blocked: 0 },
  scannerPaused: false,
  geminiFilter: {
    enabled: true,
    engineMode: 'local',
    apiKey: '',
    model: 'gemini-2.5-pro',
    atmOnly: true,

  },

  },

try {
  const stored = JSON.parse(localStorage.getItem('opt') || '{}');
  cfg = Object.assign(cfg, stored);
  if (!Array.isArray(cfg.pos)) cfg.pos = [];
  if (!Array.isArray(cfg.closed)) cfg.closed = [];
  if (!Array.isArray(cfg.stratPos)) cfg.stratPos = [];
  if (!Array.isArray(cfg.stratClosed)) cfg.stratClosed = [];
  if (!Array.isArray(cfg.livePos)) cfg.livePos = [];
  if (!['bidask', 'last'].includes(cfg.paperFill)) cfg.paperFill = 'bidask';
  cfg.algo = Object.assign({ on: false, risk: 100, maxQty: 5, dayLoss: 300, maxTrades: 6, minScore: 85, balanced: false, openWin: 10, closeWin: 45, cool: 30, timeStop: 45, flatten: true, strats: true, pullback: true, breakout: true, rsiGuard: true, halted: '', haltedDay: '', log: [] }, cfg.algo || {});
  if (!Array.isArray(cfg.events)) cfg.events = [
    { date: '2026-12-04', time: '08:30', impact: 'high', name: 'Jobs report (NFP)' },
    { date: '2026-12-09', time: '14:00', impact: 'high', name: 'FOMC rate decision' },
    { date: '2026-12-10', time: '08:30', impact: 'high', name: 'CPI' },
    { date: '2027-01-08', time: '08:30', impact: 'high', name: 'Jobs report (NFP)' },
    { date: '2027-01-13', time: '08:30', impact: 'high', name: 'CPI' },
    { date: '2027-01-27', time: '14:00', impact: 'high', name: 'FOMC rate decision' }
  ];
  if (!Array.isArray(cfg.signalJournal)) cfg.signalJournal = [];
  if (!cfg.autoPickExecuted || typeof cfg.autoPickExecuted !== 'object') cfg.autoPickExecuted = {};
  if (!cfg.stratAutoExecuted || typeof cfg.stratAutoExecuted !== 'object') cfg.stratAutoExecuted = {};
  if (typeof cfg.stratAutoRoute !== 'boolean') cfg.stratAutoRoute = true;
  cfg.quantGuard = Object.assign({
    maxQuoteAgeSec: 15, strictSpreadPct: 5, balancedSpreadPct: 7, minRvol: 1.5, minAdx: 25, blockSidewaysWithoutPattern: false
  }, cfg.quantGuard);
  cfg.geminiFilter = Object.assign({
    enabled: true, engineMode: 'local', apiKey: '', model: 'gemini-2.5-pro', atmOnly: true, atmMaxDistPct: 1.5, minOI: 500, maxIVPct: 90, minConfluencePct: 85
  }, cfg.geminiFilter);
} catch (e) {}

function normalizeCfg() {
  cfg.strictRR = clampNum(cfg.strictRR, 0.1, 10, 1.5);
  cfg.balancedRR = clampNum(cfg.balancedRR, 0.1, 10, 1.5);
  cfg.stopPct = clampNum(cfg.stopPct, 5, 60, 20);
  cfg.maxOpenPos = clampNum(cfg.maxOpenPos, 1, 20, 3, { round: true });
  cfg.cooldownMins = clampNum(cfg.cooldownMins, 0, 240, 30, { round: true, allowZero: true });
}
normalizeCfg();

function pruneState() {
  try {
    const today = new Date().toISOString().slice(2, 10).replace(/-/g, '');
    [cfg.autoPickExecuted, cfg.stratAutoExecuted].forEach(m => { for (const k in m) { const x = String(k).match(/(\d{6})[CP]\d/); if (x ? x[1] < today : m[k] < Date.now() - 7 * 864e5) delete m[k]; } });
    const ks = Object.keys(cfg.geminiDecisions || {}); if (ks.length > 300) ks.slice(0, ks.length - 300).forEach(k => delete cfg.geminiDecisions[k]);
  } catch (e) {}
}
const save = () => { pruneState(); try { localStorage.setItem('opt', JSON.stringify(cfg, (k, v) => k === 'ofx' && v ? { alerts: v.alerts, lastEvent: v.lastEvent } : v)); } catch (e) {} };

const api = async (p, opts = {}) => {
  const timeoutMs = opts.timeoutMs || 8000;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const fetchOpts = { method: opts.method || 'GET', signal: ctrl.signal };
    if (opts.body) {
      fetchOpts.headers = { 'Content-Type': 'application/json' };
      fetchOpts.body = typeof opts.body === 'string' ? opts.body : JSON.stringify(opts.body);
    }
    const r = await fetch(cfg.bridge + p, fetchOpts);
    clearTimeout(timer);
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch (e) {
    clearTimeout(timer);
    throw e;
  }
};

const tierForScore = s => s >= AUTO_PICK_POLICY.strictMin ? 'Strict' : s >= AUTO_PICK_POLICY.balancedMin ? 'Balanced' : null;
const tierRR = tier => tier === 'Strict' ? cfg.strictRR : cfg.balancedRR;
function riskPlan(mid, tier, intraday) {
  const slMult = 1 - cfg.stopPct / 100;
  const stop = +(mid * (intraday ? slMult : Math.min(slMult, 0.70))).toFixed(2);
  const rr = tierRR(tier);
  return { stop, rr, tgt: +(mid + (mid - stop) * rr).toFixed(2) };

// --- Contract Parsing & Formatting ---
const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

function contractFromParts(root, y, mo, d, call, strike) {
  if (!root || !(y >= 2000 && y <= 2100) || !(mo >= 1 && mo <= 12) || !(d >= 1 && d <= 31) || !Number.isFinite(strike) || !(strike > 0)) return null;
  const mid = new Date(Date.UTC(y, mo - 1, d));
  if (mid.getUTCMonth() !== mo - 1 || mid.getUTCDate() !== d) return null;
  const z = n => String(n).padStart(2, '0');
  const close = etWall(y, mo, d, 16, 0);
  return {
    root, y, m: mo, d, call, strike,
    occ: `${root}${z(y % 100)}${z(mo)}${z(d)}${call ? 'C' : 'P'}${String(Math.round(strike * 1000)).padStart(8, '0')}`,
    expMidTs: Math.floor(mid.getTime() / 1000),
    dte: Math.max(0, (close.getTime() - Date.now()) / 864e5),
    label: `${root} ${z(d)} ${MONTHS[mo - 1]} ${y} $${+strike.toFixed(3)} ${call ? 'CALL' : 'PUT'}`
  };
}

function parseExpiryText(txt, refTs) {
  const ref = Number(refTs) || Date.now();
  let y, mo, d, m;
  if ((m = /^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/.exec(txt))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  else if ((m = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4}|\d{2})$/.exec(txt))) { mo = +m[1]; d = +m[2]; y = +m[3]; if (y < 100) y += 2000; }
  else if ((m = /^(\d{1,2})[-\/.](\d{1,2})$/.exec(txt))) { mo = +m[1]; d = +m[2]; }
  else if ((m = /^(\d{4})(\d{2})(\d{2})$/.exec(txt))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  else if ((m = /^(\d{2})(\d{2})(\d{2})$/.exec(txt))) { y = 2000 + +m[1]; mo = +m[2]; d = +m[3]; }
  else if ((m = /^([A-Z]{3})[A-Z]*\.? (\d{1,2})(?:,? (\d{4}))?$/.exec(txt))) { mo = MONTHS.indexOf(m[1]) + 1; d = +m[2]; if (m[3]) y = +m[3]; }
  else if ((m = /^(\d{1,2}) ([A-Z]{3})[A-Z]*\.?(?:,? (\d{4}))?$/.exec(txt))) { d = +m[1]; mo = MONTHS.indexOf(m[2]) + 1; if (m[3]) y = +m[3]; }
  else return null;
  if (!(mo >= 1)) return null;
  if (y == null) {
    y = new Date(ref).getUTCFullYear();
    if (Date.UTC(y, mo - 1, d, 21) < ref - 3 * 864e5) y++;
  }
  return { y, mo, d };
}

function parseContractInput(raw, refTs) {
  const s = String(raw || '').toUpperCase().trim().replace(/^US[.:]/, '').replace(/-US$/, '').replace(/\s+/g, ' ');
  if (!s) return null;
  let m = /^([A-Z]{1,6})(\d{2})(\d{2})(\d{2})([CP])(\d{1,8})$/.exec(s.replace(/ /g, ''));
  if (m) {
    const digits = m[6];
    return contractFromParts(m[1], 2000 + +m[2], +m[3], +m[4], m[5] === 'C', digits.length >= 5 ? parseInt(digits, 10) / 1000 : parseInt(digits, 10));
  }
  let root, dateTxt, strikeTxt, typeTxt;
  if ((m = /^([A-Z]{1,6}) (.+?) ?(\d+(?:\.\d+)?) ?(CALL|PUT|C|P)$/.exec(s))) [, root, dateTxt, strikeTxt, typeTxt] = m;
  else if ((m = /^([A-Z]{1,6}) (.+?) (CALL|PUT|C|P) ?(\d+(?:\.\d+)?)$/.exec(s))) [, root, dateTxt, typeTxt, strikeTxt] = m;
  else return null;
  const dt = parseExpiryText(dateTxt.trim(), refTs);
  return dt ? contractFromParts(root, dt.y, dt.mo, dt.d, typeTxt[0] === 'C', parseFloat(strikeTxt)) : null;
}

function parseOccMeta(code) {

// --- Math & Greeks ---
const N = x => {
  const t = 1 / (1 + .2316419 * Math.abs(x)),
        p = .3989423 * Math.exp(-x*x/2) * t * (.3193815 + t*(-.3565638 + t*(1.781478 + t*(-1.821256 + t*1.330274))));
  return x > 0 ? 1 - p : p;
};

function greeks(S, K, T, iv, call) {
  const r = .045, sd = iv * Math.sqrt(T);
  if (sd <= 0 || T <= 0 || S <= 0 || K <= 0) return { d:0, ga:0, th:0, ve:0 };
  const d1 = (Math.log(S/K) + (r + iv*iv/2)*T) / sd,
        d2 = d1 - sd,
        pdf = .3989423 * Math.exp(-d1*d1/2);
  return {
    d: call ? N(d1) : N(d1) - 1,
    ga: pdf / (S * iv * Math.sqrt(T)),
    th: (-S * pdf * iv / (2 * Math.sqrt(T)) - (call ? 1 : -1) * r * K * Math.exp(-r*T) * N(call ? d2 : -d2)) / 365,
    ve: S * pdf * Math.sqrt(T) / 100
  };
}

const ema = (a, n) => { const k = 2 / (n + 1); return a.reduce((e, x, i) => i ? x*k + e*(1-k) : x, a[0]); };
const emaSeries = (arr, period) => {
  if (!arr || !arr.length) return [];
  const k = 2 / (period + 1), out = [arr[0]];
  for (let i = 1; i < arr.length; i++) out.push(arr[i] * k + out[i - 1] * (1 - k));
  return out;
};
const rsi = (c, n=14) => {
  if (c.length <= n) return 50;
  let g = 0, l = 0;
  for (let i = c.length - n; i < c.length; i++) { const d = c[i] - c[i-1]; d > 0 ? g += d : l -= d; }
  return l ? 100 - 100 / (1 + g/l) : 100;
};
const hv = c => {
  if (c.length < 2) return 0.2;
  const r = c.slice(-21).map((x, i, a) => i ? Math.log(x / a[i-1]) : 0).slice(1);
  const m = r.reduce((a, b) => a + b, 0) / r.length;
  return Math.sqrt(r.reduce((a, b) => a + (b - m)**2, 0) / Math.max(1, r.length - 1)) * Math.sqrt(252);
};
const cl = (x, a=0, z=1) => Math.max(a, Math.min(z, x));
const escapeHtml = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt = e => new Date(e * 1000).toISOString().slice(5, 10);

const fmtTs = ts => { if (!ts) return '--'; const d = new Date(ts); return isNaN(d) ? '--' : tsFmt.format(d); };

function macdCalc(closes) {
  if (!closes || closes.length < 26) return { macd: 0, signal: 0, hist: 0 };
  const e12 = emaSeries(closes, 12), e26 = emaSeries(closes, 26);
  const macdLine = closes.map((_, i) => e12[i] - e26[i]);
  const sigLine = emaSeries(macdLine, 9);
  const macd = macdLine.at(-1) || 0, signal = sigLine.at(-1) || 0;
  return { macd, signal, hist: macd - signal };
}

function vwapCalc(highs, lows, closes, vols) {
  if (!closes || !closes.length) return 0;
  let pv = 0, vTot = 0;
  for (let i = 0; i < closes.length; i++) {
    const c = closes[i], h = highs?.[i] ?? c, l = lows?.[i] ?? c, v = vols?.[i] ?? 0;
    if (c == null || !(v > 0)) continue;
    pv += ((h + l + c) / 3) * v;
    vTot += v;
  }
  return vTot > 0 ? pv / vTot : closes.at(-1);
}

function detectIntradayPattern(opens, highs, lows, closes) {
  const n = closes.length;
  if (n < 4) return 'Neutral Bar';
  const o = opens[n - 1], h = highs[n - 1], l = lows[n - 1], c = closes[n - 1];
  const po = opens[n - 2], ph = highs[n - 2], pl = lows[n - 2], pc = closes[n - 2];
  const body = Math.abs(c - o);
  const upperWick = h - Math.max(o, c), lowerWick = Math.min(o, c) - l;
  if (c > o && pc < po && c >= po && o <= pc) return 'Bullish Engulfing';
  if (c < o && pc > po && c <= po && o >= pc) return 'Bearish Engulfing';
  if (lowerWick > body * 2 && upperWick < body * 0.8) return 'Bullish Hammer / Pinbar';
  if (upperWick > body * 2 && lowerWick < body * 0.8) return 'Shooting Star (Rejection)';
  if (c > ph && pc > highs[n - 3]) return 'Momentum Breakout';
  if (c < pl && pc < lows[n - 3]) return 'Support Breakdown';
  return c >= o ? 'Bullish Continuation' : 'Bearish Pullback';
}

function computeIntradayTA(res) {

  const off = Number(res.meta?.gmtoffset), gmt = Number.isFinite(off) ? off : -14400;

  const baseVol = vs.slice(0, -3).reduce((a, b) => a + b, 0) / Math.max(1, vs.length - 3);

    barAt: last.t * 1000, sessionBars: session.length, bars: bars.slice(-60),
    rvol, atr

}

function quantRegime(ta) {
  if (!ta) return { name: 'Mixed', confidence: 50, adx: 20, bbw: 0.02, pattern: 'Neutral', rvol: 1.0, vwap: 0 };
  const bars = ta.bars || [], C = bars.map(x => x.c), n = Math.min(20, C.length), w = C.slice(-n);
  const mean = w.reduce((a, b) => a + b, 0) / Math.max(1, n);
  const sd = Math.sqrt(w.reduce((a, b) => a + (b - mean) ** 2, 0) / Math.max(1, n));
  const bbw = mean ? (4 * sd) / mean : 0;

  let tr = 0, plus = 0, minus = 0;
  for (let i = Math.max(1, bars.length - 14); i < bars.length; i++) {
    const x = bars[i], z = bars[i - 1];
    const t = Math.max(x.h - x.l, Math.abs(x.h - z.c), Math.abs(x.l - z.c));
    const up = x.h - z.h, dn = z.l - x.l;
    tr += t;
    if (up > dn && up > 0) plus += up;
    if (dn > up && dn > 0) minus += dn;
  }
  const pdi = tr ? 100 * plus / tr : 0, mdi = tr ? 100 * minus / tr : 0;
  const adx = pdi + mdi ? 100 * Math.abs(pdi - mdi) / (pdi + mdi) : 0;
  const S = Number(ta.lastUnderlying || 0);
  const minAdx = Number(cfg.quantGuard.minAdx || 25);

  let name = 'Sideways';
  if (adx >= minAdx && S > ta.vwap && ta.e5 > ta.e10 && ta.e10 > ta.e20) {
    name = 'Uptrend';
  } else if (adx >= minAdx && S < ta.vwap && ta.e5 < ta.e10 && ta.e10 < ta.e20) {
    name = 'Downtrend';
  } else if (adx >= 18) {
    name = 'Mixed';
  }

  const pattern = ta.pattern || 'Neutral';
  const confidence = Math.round(Math.min(100, adx * 1.5 + (Number(ta.rvol || 0) >= 1.5 ? 20 : 0) + (name === 'Uptrend' || name === 'Downtrend' ? 20 : 10)));
  return { name, confidence, adx, bbw, pattern, rvol: Number(ta.rvol || 0), vwap: ta.vwap };
}

  const evs = eventsInLife(o.dteD, now), ivH = o.H > 0 ? o.iv / o.H : 1;
  if (evs.length) {
    const e0 = evs[0]; adj -= evs.some(e => e.impact === 'high') ? 6 : 3; tags.push(`${e0.name} in ${((e0.t - now) / 36e5).toFixed(1)}h`);
    if (ivH > P.ivCrushRatio) return { ok: false, why: `IV-crush risk into ${e0.name} (IV ${ivH.toFixed(1)}x HV)` };
    if (ivH > P.ivRichRatio) { adj -= 5; tags.push('IV rich into event'); }
  }
  if (o.dteD < 1) {
    if (mins >= P.zeroDteCutoffMin && mins < close) return { ok: false, why: 'Expiry-day entry cutoff (after 2:30pm ET)' };
    burn = o.ext / Math.max(0.25, Math.min(6.5, (close - mins) / 60)) / o.mid * 100;
    if (burn > P.maxBurnPctHr) return { ok: false, why: `Expiry-day theta burn ${burn.toFixed(0)}%/hr` };
    tags.push(`0DTE burn ${burn.toFixed(0)}%/hr`);
  } else {
    burn = Math.abs(o.th) / o.mid * 100;
    if (burn > (o.m === 'intraday' ? P.maxBurnPctDayIntraday : P.maxBurnPctDaySwing)) return { ok: false, why: `Theta burn ${burn.toFixed(0)}%/day` };
    tags.push(`burn ${burn.toFixed(0)}%/day`);
  }
  if (o.ga > 0 && o.th && o.H > 0) {
    gtr = 0.5 * o.ga * Math.pow(o.S * o.H / Math.sqrt(252), 2) / Math.abs(o.th);
    if (gtr < P.minGammaTheta) return { ok: false, why: `Gamma/theta ${gtr.toFixed(2)}x too low` };
    tags.push(`Γ/Θ ${gtr.toFixed(2)}x`);
  }
  return { ok: true, adj, tags, burn, gtr };
}
// --- Intrinsic / Extrinsic value + break-even efficiency ---
function optionValue(S, K, call, mid, T, iv) {
  const intr = Math.max(0, call ? S - K : K - S), ext = Math.max(0, mid - intr);
  const beDist = Math.max(0, call ? K + mid - S : S - K + mid), em = S * iv * Math.sqrt(T);
  return { intr, ext, extPct: mid > 0 ? ext / mid * 100 : 0, beDist, beMovePct: S > 0 ? beDist / S * 100 : 0, beRatio: em > 0 ? beDist / em : 9 };
}
function straddleValue(S, cK, pK, cMid, pMid, T, iv) {
  const mid = cMid + pMid, intr = Math.max(0, S - cK) + Math.max(0, pK - S), em = S * iv * Math.sqrt(T);
  const up = Math.max(0, cK + mid - S), dn = Math.max(0, S - pK + mid), beDist = Math.min(up, dn);
  return { intr, ext: Math.max(0, mid - intr), extPct: mid > 0 ? Math.max(0, mid - intr) / mid * 100 : 0, beDist, beMovePct: S > 0 ? beDist / S * 100 : 0, beRatio: em > 0 ? beDist / em : 9 };
}

// --- Option Chain Strike Evaluator ---
function pick(o, S, T, call, m, b, fs, H, ed, ta5m, sym) {
  const iv = o.impliedVolatility || 0, bid = o.bid || 0, ask = o.ask || 0, mid = (bid + ask) / 2;
  const lastPx = Number(o.lastPrice) || 0;
  const live = lastPx > 0 ? lastPx : mid;
  if (!(bid > 0) || !(ask > 0) || !(iv > 0)) return null;
  if ((o.openInterest || 0) < AUTO_PICK_POLICY.minOI) return null;
  if ((o.volume || 0) < AUTO_PICK_POLICY.minVolume) return null;
  if (live < AUTO_PICK_POLICY.premiumMin || live > AUTO_PICK_POLICY.premiumMax) return null;

  const sp = (ask - bid) / mid;
  if (sp > AUTO_PICK_POLICY.maxSpreadPct) return null;

  const g = greeks(S, o.strike, T, iv, call);
  const absD = Math.abs(g.d);
  if (absD < 0.42 || absD > 0.68) return null;

  // Intrinsic / extrinsic guards: reject quotes below parity and contracts that need an outsized move to break even
  const vx = optionValue(S, o.strike, call, mid, T, iv);
  if (mid < vx.intr - AUTO_PICK_POLICY.parityTol) return null;
  if (vx.beRatio > AUTO_PICK_POLICY.maxBEvsExpMove) return null;
  const eg = timeEventGuard({ dteD: T * 365, m, ext: vx.ext, mid, th: g.th, ga: g.ga, S, iv, H });
  if (!eg.ok) return null;

  const id = m === 'intraday', tg = id ? 0.50 : 0.48;
  const qr = quantRegime(ta5m);
  const directionOk = (call && qr.name === 'Uptrend') || (!call && qr.name === 'Downtrend') || (qr.name === 'Sideways' || qr.name === 'Mixed');
  const patternOk = call ? /Bullish|Breakout|Hammer|Continuation/i.test(qr.pattern) : /Bearish|Breakdown|Shooting|Pullback/i.test(qr.pattern);

  let s = 25 * cl(Math.abs(b) / 70)
        + 15 * cl(1 - Math.abs(absD - tg) / 0.25)
        + 15 * cl(1 - sp / 0.08)
        + 10 * cl((AUTO_PICK_POLICY.maxBEvsExpMove - vx.beRatio) / 0.45)
        + 8 * cl((o.volume || 0) / 600)
        + 10 * cl(1.25 - iv / (H || 0.25))
        + 4 * fs
        + 8 * cl((eg.gtr ?? 0.9) / 1.2)
        + (directionOk ? 10 : 0)
        + (patternOk ? 6 : 0);

  const earnSoon = ed >= -0.25 && ed < (id ? 1 : 10); // ignore earnings dates already in the past
  s = s - (earnSoon ? 8 : 0) + eg.adj;
  const score = Math.round(Math.min(99, s));
  const tier = tierForScore(score);
  if (!tier) return null;

  const plan = riskPlan(live, tier, id);
  const distPct = S > 0 ? Math.abs(o.strike - S) / S * 100 : 0;

  return {
    id: o.contractSymbol, code: o.contractSymbol, k: o.strike, bid, ask, mid, live,
    src: lastPx > 0 ? 'Yahoo Live' : 'Yahoo Mid', iv, d: g.d, ga: g.ga, th: g.th, ve: g.ve,
    oi: o.openInterest || 0, v: o.volume || 0, distPct: +distPct.toFixed(2),
    intr: +vx.intr.toFixed(2), ext: +vx.ext.toFixed(2), extPct: +vx.extPct.toFixed(0), beMovePct: +vx.beMovePct.toFixed(2), beRatio: +vx.beRatio.toFixed(2),
    ev: eg.tags, burn: +eg.burn.toFixed(0), gtr: eg.gtr == null ? null : +eg.gtr.toFixed(2),
    isATM: distPct <= 1.5, quantRegime: qr, score, tier, earn: earnSoon,
    stop: plan.stop, tgt: plan.tgt,
    evidence: {
      underlying: S, dte: T * 365, bias: Math.round(b), fundamental: fs, hv: H,
      earningsDays: ed, spreadPct: sp * 100, delta: g.d, gamma: g.ga, theta: g.th, vega: g.ve,
      iv, oi: o.openInterest || 0, volume: o.volume || 0, bid, ask, mid, live, score, tier, mode: m,
      intrinsic: vx.intr, extrinsic: vx.ext, extrinsicPct: vx.extPct, beMovePct: vx.beMovePct, beRatio: vx.beRatio
    }
  };
}

// --- Setup triggers: pullback resume, volume breakout/breakdown, RSI over-extension guard ---
function setupSignals(ta, call, name) {
  const trend = /Momentum|Breakdown/.test(name || ''), out = { trend, pullback: false, breakout: false, guard: '', tags: [] };
  if (!ta || !ta.bars || !ta.bars.length) return out;
  const sess = ta.bars.filter(b => b.day === ta.bars.at(-1).day), done = sess.slice(0, -1), c = done.at(-1);
  if (ta.rsi >= 75 && call) out.guard = `Overbought: 5m RSI ${ta.rsi.toFixed(0)} (call blocked)`;
  if (ta.rsi <= 25 && !call) out.guard = `Oversold: 5m RSI ${ta.rsi.toFixed(0)} (put blocked)`;
  if (!c || done.length < 8) return out;
  const rec = done.slice(-7, -1), prior = done.slice(-13, -1), avgV = prior.reduce((n, b) => n + (b.v || 0), 0) / prior.length || 0;
  if (call) {
    if (rec.some(b => b.l <= ta.e10 * 1.0007) && c.c > c.o && c.c > ta.e5 && c.c > rec.at(-1).h && c.c > ta.vwap) { out.pullback = true; out.tags.push('Pullback to EMA10 resumed'); }
    if (c.c > Math.max(...prior.map(b => b.h)) && avgV && c.v >= 1.3 * avgV) { out.breakout = true; out.tags.push(`Breakout ${(c.v / avgV).toFixed(1)}x vol`); }
  } else {
    if (rec.some(b => b.h >= ta.e10 * 0.9993) && c.c < c.o && c.c < ta.e5 && c.c < rec.at(-1).l && c.c < ta.vwap) { out.pullback = true; out.tags.push('Rally to EMA10 rejected'); }
    if (c.c < Math.min(...prior.map(b => b.l)) && avgV && c.v >= 1.3 * avgV) { out.breakout = true; out.tags.push(`Breakdown ${(c.v / avgV).toFixed(1)}x vol`); }
  }
  return out;
}

// --- All-Regime Underlying Analyzer ---
async function analyze(sym) {
  const E = encodeURIComponent(sym);
  const [ch, qt, c0, ch5m] = await Promise.all([
    api('/api/chart?symbol=' + E),
    api('/api/quote?symbols=' + E),
    api('/api/chain?symbol=' + E),
    api('/api/chart?symbol=' + E + '&range=5d&interval=5m').catch(() => null)
  ]);

  const c = ch.chart.result[0].indicators.quote[0].close.filter(x => x != null);
  const q = qt.quoteResponse.result[0] || {};
  const S = c.at(-1);
  const ta5m = ch5m?.chart?.result?.[0] ? computeIntradayTA(ch5m.chart.result[0]) : null;
  if (ta5m) taCache5m[sym] = ta5m;
  const qr = quantRegime(ta5m);

  const e20 = ema(c, 20), e50 = ema(c, 50), R = rsi(c), H = hv(c), chg = q.regularMarketChangePercent || 0;
  let b = (S > e20 ? 20 : -20) + (e20 > e50 ? 25 : -25) + (S > e50 ? 10 : -10) + (R > 55 ? 15 : R < 45 ? -15 : 0) + (chg > 0.3 ? 15 : chg < -0.3 ? -15 : 0);

  let scanDirections = [];
  if (qr.name === 'Uptrend' || b >= 25) {
    scanDirections = [{ call: true, strategyName: 'Long Call (Momentum)', biasVal: Math.max(45, Math.abs(b)) }];
  } else if (qr.name === 'Downtrend' || b <= -25) {
    scanDirections = [{ call: false, strategyName: 'Long Put (Breakdown)', biasVal: Math.max(45, Math.abs(b)) }];
  } else {
    const r5m = ta5m?.rsi ?? R;
    if (r5m <= 48) scanDirections.push({ call: true, strategyName: 'Range Support Call', biasVal: 42 });
    if (r5m >= 52) scanDirections.push({ call: false, strategyName: 'Range Resistance Put', biasVal: 42 });
    if (!scanDirections.length) scanDirections.push({ call: true, strategyName: 'Breakout Call Leg', biasVal: 40 });
  }

  const ed = q.earningsTimestamp ? (q.earningsTimestamp * 1000 - Date.now()) / 864e5 : 99;
  const dte = e => (expiryMs(e) - Date.now()) / 864e5; // to the real 4:00pm ET (1:00pm early-close) expiry, not UTC midnight
  const ex = c0.optionChain.result[0].expirationDates;
  const out = [];

  for (const m of ['intraday', 'swing']) {
    const e = ex.find(e => m === 'intraday' ? dte(e) > 0 && dte(e) <= 3 : dte(e) >= 5 && dte(e) <= 14);
    if (!e) continue;
    const res = (await api(`/api/chain?symbol=${E}&date=${e}`)).optionChain.result[0];
    const op = res.options[0];
    const S2 = res.quote.regularMarketPrice || S;

    for (const dir of scanDirections) {
      const chainSide = dir.call ? op.calls : op.puts;
      const fs = 0.75;
      const qualified = chainSide
        .map(o => pick(o, S2, Math.max(dte(e), 0.05) / 365, dir.call, m, dir.biasVal, fs, H, ed, ta5m, sym))
        .filter(Boolean)
        .map(p => {
          const enriched = {
            ...p,
            sym, m, call: dir.call, exp: e, b: Math.round(dir.biasVal), R: Math.round(ta5m?.rsi ?? R),
            ta5m,
            setup: setupSignals(ta5m, dir.call, dir.strategyName),
            strategyName: dir.strategyName,
            evidence: {
              ...p.evidence,
              symbol: sym, expiry: e, rsi: ta5m?.rsi ?? R,
              ema5: ta5m?.e5 ?? S2, ema10: ta5m?.e10 ?? S2, ema20: ta5m?.e20 ?? e20,
              vwap: ta5m?.vwap ?? S2, macdHist: ta5m?.macdHist ?? 0,
              pattern5m: ta5m?.pattern ?? 'Neutral', optionType: dir.call ? 'CALL' : 'PUT'

        const cMid = (atmCall.bid + atmCall.ask) / 2;
        const pMid = (atmPut.bid + atmPut.ask) / 2;
        const comboLive = +(cMid + pMid).toFixed(2);
        const comboSp = ((atmCall.ask - atmCall.bid) + (atmPut.ask - atmPut.bid)) / comboLive;
        const sIV = ((atmCall.impliedVolatility || 0.25) + (atmPut.impliedVolatility || 0.25)) / 2, sv = straddleValue(S2, atmCall.strike, atmPut.strike, cMid, pMid, Math.max(dte(e), 0.05) / 365, sIV);
        const parityOk = cMid >= Math.max(0, S2 - atmCall.strike) - AUTO_PICK_POLICY.parityTol && pMid >= Math.max(0, atmPut.strike - S2) - AUTO_PICK_POLICY.parityTol;
        const Tq = Math.max(dte(e), 0.05) / 365, gC = greeks(S2, atmCall.strike, Tq, atmCall.impliedVolatility || sIV, true), gP = greeks(S2, atmPut.strike, Tq, atmPut.impliedVolatility || sIV, false);

            strategyName: 'Long Straddle (Volatility Breakout)',
            regime: qr.name,
            quantRegime: qr,
            bid: +(atmCall.bid + atmPut.bid).toFixed(2),
            ask: +(atmCall.ask + atmPut.ask).toFixed(2),
            mid: comboLive,
            live: comboLive,
            iv: +((((atmCall.impliedVolatility || 0.25) + (atmPut.impliedVolatility || 0.25)) / 2)).toFixed(4),
            d: +(gC.d + gP.d).toFixed(3),
            th: +(gC.th + gP.th).toFixed(3),
            oi: Math.min(atmCall.openInterest || 0, atmPut.openInterest || 0),
            v: Math.min(atmCall.volume || 0, atmPut.volume || 0),
            intr: +sv.intr.toFixed(2), ext: +sv.ext.toFixed(2), extPct: +sv.extPct.toFixed(0), beMovePct: +sv.beMovePct.toFixed(2), beRatio: +sv.beRatio.toFixed(2),
            ev: stg.tags, burn: +stg.burn.toFixed(0), gtr: stg.gtr == null ? null : +stg.gtr.toFixed(2),
            score: sScore,
            tier: sTier,
            stop: plan.stop,
            tgt: plan.tgt,
            src: 'Yahoo Live'

        }
      }
    }
  }
  return out;
}

function buildStrategyPicksFromQualified() {
  const singleLegStrategies = picks
    .filter(p => !p.gemini || p.gemini.approved)
    .map(p => ({
      ...p,
      isMultiLeg: false,
      strategyLabel: `${p.k}${p.call ? 'C' : 'P'} (${p.strategyName})`,
      regime: p.quantRegime?.name || 'Mixed'
    }));

  const combined = [...strategyPicks, ...singleLegStrategies];
  const seen = new Set();
  strategyPicks = combined.filter(item => {
    if (seen.has(item.code)) return false;
    seen.add(item.code);
    return true;
  }).sort((a, b) => b.score - a.score);
}

// Paper fills: buy at the ask, sell at the bid (set cfg.paperFill = 'last' to use last-trade prices)

  const last = Number(o.live) > 0 ? Number(o.live) : Number(o.mid), ask = Number(o.ask);
  return +(cfg.paperFill !== 'last' && ask > 0 && ask <= Math.max(last, Number(o.mid) || 0) * 1.25 ? ask : last).toFixed(2);

function fillSell(p) { const b = Number(p.bid); return cfg.paperFill !== 'last' && b > 0 && b >= Number(p.live) * 0.6 ? b : (Number(p.live) || p.entry); }
function createPaperOrder(p, source = 'Manual Auto-Picks', qty = 1) {

// --- Profit Shield & Auto-Close Engine ---
function updateProfitShield(p) {
  const risk = Math.max(0.01, p.entry - Number(p.initialStop || p.stop));
  const r = (p.live - p.entry) / risk;
  p.highWater = Math.max(Number(p.highWater || p.entry), p.live);
  let sl = Number(p.stop), stage = p.profitStage || 0;
  if (r >= 0.6 && stage < 1) { sl = Math.max(sl, p.entry + risk * 0.10); stage = 1; }
  if (r >= 1.0 && stage < 2) { sl = Math.max(sl, p.entry + risk * 0.40); stage = 2; }
  if (r >= 1.5) {
    const trail = p.highWater - Math.max(risk * 0.30, (p.highWater - p.entry) * 0.35);
    sl = Math.max(sl, trail, p.entry + risk * 0.80);
    stage = 3;
  }
  if (sl > p.stop) { p.stop = +sl.toFixed(2); p.profitStage = stage; }
}

function closePos(i, reason = 'Manual close') {
  const p = cfg.pos[i];
  if (!p) return;
  const exitPx = fillSell(p);
  const feeTotal = 2 * cfg.fee * p.qty;
  const realizedPL = (exitPx - p.entry) * 100 * p.qty - feeTotal;
  cfg.closed.unshift({
    ...p, exitPrice: exitPx, realizedPL, feeTotal, closedAt: Date.now(), closeReason: reason, autoClosed: reason !== 'Manual close'
  });
  cfg.pos.splice(i, 1);
  save();
  render();
}

function closeStratPos(i, reason = 'Manual close') {
  const p = cfg.stratPos[i];
  if (!p) return;
  const exitPx = fillSell(p);
  const mult = p.legMultiplier || (p.isMultiLeg ? 2 : 1);
  const feeTotal = 2 * cfg.fee * p.qty * mult;
  const realizedPL = (exitPx - p.entry) * 100 * p.qty - feeTotal;
  cfg.stratClosed.unshift({
    ...p, exitPrice: exitPx, realizedPL, feeTotal, closedAt: Date.now(), closeReason: reason, autoClosed: reason !== 'Manual close'
  });
  cfg.stratPos.splice(i, 1);
  save();
  render();
}

let quoteRefreshBusy = false;
async function refresh() {
  if (quoteRefreshBusy) return; // keep checking stops/targets even when the tab is in the background
  if (!cfg.pos.length && !cfg.stratPos.length && !cfg.livePos.length) return;
  quoteRefreshBusy = true;
  try {
    for (const p of cfg.pos) {
      try {
        const q = (await api('/api/moomoo/quote?code=' + encodeURIComponent(p.code))).quote;
        if (q && q.last > 0) { p.live = q.last; p.src = 'Moomoo'; p.bid = Number(q.bid) > 0 ? Number(q.bid) : 0; }
      } catch (e) {}
    }
    for (const p of cfg.stratPos) {
      try {
        if (p.isMultiLeg && p.callCode && p.putCode) {
          const [qc, qp] = await Promise.all([
            api('/api/moomoo/quote?code=' + encodeURIComponent(p.callCode)).catch(() => null),
            api('/api/moomoo/quote?code=' + encodeURIComponent(p.putCode)).catch(() => null)
          ]);
          if (qc?.quote?.last > 0 && qp?.quote?.last > 0) {
            p.live = +(qc.quote.last + qp.quote.last).toFixed(2);
            p.bid = qc.quote.bid > 0 && qp.quote.bid > 0 ? +(qc.quote.bid + qp.quote.bid).toFixed(2) : 0;
            p.src = 'Moomoo Combo';
          }
        } else {
          const q = (await api('/api/moomoo/quote?code=' + encodeURIComponent(p.code))).quote;
          if (q && q.last > 0) { p.live = q.last; p.src = 'Moomoo'; p.bid = Number(q.bid) > 0 ? Number(q.bid) : 0; }
        }
      } catch (e) {}
    }
    for (const p of (cfg.livePos || [])) {
      try {
        if (!p.exp || !p.sym) {
          const c = parseContractInput(p.code);
          if (c) { p.sym = p.sym || c.root; p.exp = p.exp || c.expMidTs; p.code = c.occ; }
        }
        const q = (await api('/api/moomoo/quote?code=' + encodeURIComponent(p.code))).quote;
        if (q && q.last > 0) {
          p.live = q.last;
          p.src = 'Moomoo';
          p.optionQuote = { bid:Number(q.bid||0), ask:Number(q.ask||0), oi:Number(q.oi||0), iv:Number(q.iv||0), delta:Number(q.delta||0), theta:Number(q.theta||0), volume:Number(q.volume||0), at:Date.now() };
          if (p.live > (p.highestSeen || p.entry)) p.highestSeen = p.live;
          evaluateLiveStrikeDecision(p);
        } else if (p.sym && p.exp) {
          const o = (await api(`/api/chain?symbol=${encodeURIComponent(p.sym)}&date=${p.exp}`)).optionChain.result[0]?.options?.[0];
          if (o) {
            const c = [...(o.calls || []), ...(o.puts || [])].find(x => x.contractSymbol === p.code);
            if (c) {
              const b = c.bid || 0, a = c.ask || 0, l = c.lastPrice || 0;
              p.live = l > 0 ? l : ((b > 0 && a > 0) ? +((b + a) / 2).toFixed(2) : p.live);
              p.src = l > 0 ? 'Yahoo Live' : 'Yahoo Mid';
              const occ = parseOccMeta(p.code);
              const T = Math.max(0.05, occ ? occ.dte : 3) / 365;
              const S = Number(p.ta?.lastUnderlying || occ?.strike || 100);
              const g = greeks(S, p.k || occ?.strike || S, T, Number(c.impliedVolatility || 0.35), p.call !== false);
              p.optionQuote = { bid:b, ask:a, oi:Number(c.openInterest||0), iv:Number(c.impliedVolatility||0), delta:g.d, theta:g.th, volume:Number(c.volume||0), at:Date.now() };
              if (p.live > (p.highestSeen || p.entry)) p.highestSeen = p.live;
              evaluateLiveStrikeDecision(p);
            }
          }
        }
      } catch (e) {}
    }

    const isRthOpen = marketPhase().code === 'open';
    const etNow = etParts();
    const closeMins = marketCalendar(etNow.y).early.has(ymd(etNow)) ? 780 : 960;
    const nowMins = etNow.h * 60 + etNow.min;
    const isEodWindow = isRthOpen && nowMins >= (closeMins - 5) && nowMins < closeMins;

    const stale = p => cfg.eodSquareOff !== false && (p.m || 'intraday') === 'intraday' && p.openedAt && ymd(etParts(new Date(p.openedAt))) !== ymd(etNow);
    const expired = p => p.exp && Date.now() > expiryMs(p.exp);
    const exits = [];
    cfg.pos.forEach((p, i) => {
      if (p.autoClose === false || !(p.live > 0)) return;
      if (expired(p)) { exits.push({ i, reason: 'Auto-close: Contract expired' }); return; }
      if (cfg.rthOnly !== false && !isRthOpen) return;
      updateProfitShield(p);
      if (p.tgt > 0 && p.live >= p.tgt) exits.push({ i, reason: 'Auto-close: Target hit' });
      else if (p.stop > 0 && p.live <= p.stop) exits.push({ i, reason: p.profitStage ? 'Auto-close: Profit Shield hit' : 'Auto-close: Stop loss hit' });
      else if (cfg.eodSquareOff !== false && (p.m || 'intraday') === 'intraday' && (isEodWindow || stale(p))) exits.push({ i, reason: stale(p) && !isEodWindow ? 'Auto-close: EOD square-off (carried over)' : 'Auto-close: EOD square-off' });
    });
    exits.sort((a, b) => b.i - a.i).forEach(x => closePos(x.i, x.reason));

    const stratExits = [];
    cfg.stratPos.forEach((p, i) => {
      if (p.autoClose === false || !(p.live > 0)) return;
      if (expired(p)) { stratExits.push({ i, reason: 'Auto-close: Contract expired' }); return; }
      if (cfg.rthOnly !== false && !isRthOpen) return;
      updateProfitShield(p);
      if (p.tgt > 0 && p.live >= p.tgt) stratExits.push({ i, reason: 'Auto-close: Strategy Target hit' });
      else if (p.stop > 0 && p.live <= p.stop) stratExits.push({ i, reason: p.profitStage ? 'Auto-close: Profit Shield hit' : 'Auto-close: Stop loss hit' });
      else if (cfg.eodSquareOff !== false && (p.m || 'intraday') === 'intraday' && (isEodWindow || stale(p))) stratExits.push({ i, reason: stale(p) && !isEodWindow ? 'Auto-close: EOD square-off (carried over)' : 'Auto-close: EOD square-off' });
    });
    stratExits.sort((a, b) => b.i - a.i).forEach(x => closeStratPos(x.i, x.reason));

    algoTick();
    save();
    wsRender();
    if (tab === 'live') renderLiveMonitor();
  } finally { quoteRefreshBusy = false; }
}

window.exportCsv = function(isStrategy) {
  const openList = isStrategy ? cfg.stratPos : cfg.pos;
  const closedList = isStrategy ? cfg.stratClosed : cfg.closed;
  const rows = [['Status','Symbol','Strategy','Contract','Qty','Entry','Live/Exit','Stop','Target','Net P&L','Fees','Close Reason']];
  openList.forEach(p => {
    const mult = p.legMultiplier || (p.isMultiLeg ? 2 : 1);
    const fee = 2 * cfg.fee * p.qty * mult;
    const pl = (p.live - p.entry) * 100 * p.qty - fee;
    rows.push(['Open', p.sym, p.strategyName || 'Single Leg', p.code, p.qty, p.entry, p.live, p.stop, p.tgt, pl.toFixed(2), fee.toFixed(2), '']);
  });
  closedList.forEach(p => {
    const mult = p.legMultiplier || (p.isMultiLeg ? 2 : 1);
    const fee = p.feeTotal ?? (2 * cfg.fee * p.qty * mult);
    rows.push(['Closed', p.sym, p.strategyName || 'Single Leg', p.code, p.qty, p.entry, p.exitPrice, p.stop, p.tgt, Number(p.realizedPL).toFixed(2), fee.toFixed(2), p.closeReason || '']);
  });
  if (rows.length === 1) { alert('No trades to export.'); return; }
  const csv = '\uFEFF' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `AlphaPulse_${isStrategy ? 'Strategy' : 'SingleLeg'}_Trades_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
};

// Sizes quantity respecting Available Cash, 40% single-trade cap ($200 on $500), and Max Dollar Risk ($25)
function lsFitQty(entry, availableCash, maxRisk, stopPct) {
  const maxSingleTradeCap = (lsDraft.budget || 500) * 0.40;
  const effectiveCap = Math.min(availableCash, maxSingleTradeCap);
  const costPerContract = entry * 100 + cfg.fee;
  const riskPerContract = entry * 100 * (stopPct / 100) + (2 * cfg.fee);
  return Math.max(1, Math.min(Math.floor(effectiveCap / costPerContract), Math.floor(maxRisk / riskPerContract)));
}

window.autoFitLsQty = function() {
  const entry = Math.max(0.01, +($('#lsEntry')?.value || lsDraft.entry || 1));
  const budget = Math.max(50, +($('#lsBudget')?.value || lsDraft.budget || 500));
  const maxRisk = Math.max(5, +($('#lsMaxRisk')?.value || lsDraft.maxRisk || 25));
  const stopPct = Math.max(1, +($('#lsStopPct')?.value || lsDraft.stopPct || 18));
  const avail = lsAvailableCash(budget);
  const qty = lsFitQty(entry, avail, maxRisk, stopPct);
  lsDraft.qty = qty;
  const qEl = $('#lsQty');
  if (qEl) qEl.value = qty;
  updateLsCalculatorPreview();
};

  const roundtripFee = 2 * cfg.fee * qty;

window.buildLiveStrikeShortlist = async function() {
  updateLsCalculatorPreview();
  const c = parseContractInput(lsDraft.code);
  if (!c) { alert('Enter a contract including symbol, expiry and C/P first, e.g. SPY 11-13 595C.'); return; }
  lsShortlist = { loading: true, error: '', rows: [], at: Date.now() };
  renderLsShortlist();
  try {
    const res = (await api(`/api/chain?symbol=${encodeURIComponent(c.root)}&date=${c.expMidTs}`)).optionChain.result[0];
    const q = res.quote || {}, spot = Number(q.regularMarketPrice || q.postMarketPrice || 0), side = c.call ? 'calls' : 'puts', opts = res.options?.[0]?.[side] || [];
    const now = Date.now() / 1000, dte = Math.max(0, (c.expMidTs - now) / 86400), T = Math.max(1 / 365, dte / 365);
    const availCash = lsAvailableCash();
    const maxSingleCap = (lsDraft.budget || 500) * 0.40; // $200 cap on $500 account

    const rows = opts.map(o => {
      const bid = Number(o.bid || 0), ask = Number(o.ask || 0), mid = bid > 0 && ask > 0 ? (bid + ask) / 2 : Number(o.lastPrice || 0), iv = Number(o.impliedVolatility || 0);
      if (!(mid > 0) || !(spot > 0)) return null;
      const cost = mid * 100;
      if (cost > availCash || mid < 0.50 || mid > 3.50) return null; // Filter out unaffordable/toxic contracts for $500

      const delta = Math.abs(greeks(spot, Number(o.strike), T, iv || 0.35, c.call).d);
      const spread = bid > 0 && ask > 0 ? (ask - bid) / mid * 100 : 99;
      const oi = Number(o.openInterest || 0), vol = Number(o.volume || 0), cap = contextualSpreadCap(mid, dte);
      const feeDragPct = ((2 * cfg.fee) / cost) * 100;
      const inSweetSpot = mid >= 0.80 && mid <= 2.20;

      let score = 0;
      // Sweet spot premium ($0.80 - $2.20) gets highest priority
      score += inSweetSpot ? 28 : (mid >= 0.65 && mid <= 2.50 ? 15 : 4);
      // Ideal single-leg Delta (0.45 - 0.60)
      score += delta >= 0.45 && delta <= 0.60 ? 28 : delta >= 0.38 && delta <= 0.68 ? 18 : 6;
      // Tight spread
      score += spread <= 4 ? 18 : spread <= cap ? 12 : 4;
      // Liquidity
      score += oi >= 1000 ? 12 : oi >= 300 ? 8 : 3;
      score += vol >= 250 ? 8 : vol >= 75 ? 5 : 2;
      // Sweet spot DTE (2 - 7 DTE avoids extreme 0DTE Theta crush)
      score += dte >= 2 && dte <= 7 ? 10 : dte >= 1 ? 6 : 2;
      // Single-trade cap check ($200 max on $500)
      if (cost > maxSingleCap) score -= 12;

      score = Math.max(0, Math.min(100, Math.round(score)));
      const grade = score >= 82 ? 'A' : score >= 70 ? 'B' : score >= 58 ? 'C' : 'D';
      const note = inSweetSpot
        ? `Sweet Spot ($${cost.toFixed(0)} <= $${maxSingleCap.toFixed(0)} cap, Fee drag ${feeDragPct.toFixed(1)}%)`
        : (mid < 0.80 ? `High fee drag (${feeDragPct.toFixed(1)}%)` : `Above $200 single-trade cap ($${cost.toFixed(0)})`);

      return { code: o.contractSymbol, strike: o.strike, delta, spread, oi, vol, mid, dte, score, grade, note, feeDragPct };
    }).filter(Boolean).filter(r => r.spread <= 15).sort((a, b) => b.score - a.score || a.spread - b.spread).slice(0, 5);

    if (!rows.length) throw new Error(`No contracts found within your $${availCash.toFixed(0)} available cash & $0.50–$3.50 range.`);
    lsShortlist = { loading: false, error: '', rows, at: Date.now() };
  } catch (e) {
    lsShortlist = { loading: false, error: e.message || String(e), rows: [], at: Date.now() };
  }
  renderLsShortlist();
};

function lsMetrics(d) {
  const { entry, qty, budget, stopPct, tgtPct, trailPct, limitBufPct } = d;
  const maxRisk = d.maxRisk || 25;
  const capital = entry * 100 * qty;
  const roundtripFee = 2 * cfg.fee * qty;
  const totalOutlay = capital + (cfg.fee * qty);
  const deployed = lsDeployedCapital();
  const availableCash = Math.max(0, budget - deployed);
  const maxSingleAllocation = budget * 0.40; // 40% cap ($200 on $500)
  const feeDragPct = capital > 0 ? (roundtripFee / capital) * 100 : 0;

  // Standard % Stop & Target
  const slTrigger = +(entry * (1 - stopPct / 100)).toFixed(2);
  const slLimit = +(slTrigger * (1 - limitBufPct / 100)).toFixed(2);
  const t1Trigger = +(entry * 1.15).toFixed(2); // Mandatory +15% T1 Breakeven Lock trigger
  const beLockStop = +(entry + (roundtripFee / (100 * qty)) + 0.01).toFixed(2);
  const tpLimit = +(entry * (1 + tgtPct / 100)).toFixed(2);

  // Dollar-Capped Stop Loss (guarantees max net loss <= maxRisk, e.g. $25)
  const allowableOptionDrop = Math.max(0.01, (maxRisk - roundtripFee) / (100 * qty));
  const dollarCappedStop = +Math.max(0.01, entry - allowableOptionDrop).toFixed(2);
  const dollarCappedStopPct = entry > 0 ? ((entry - dollarCappedStop) / entry) * 100 : 0;

  const trailDrop = +(entry * (trailPct / 100)).toFixed(2);
  const trailFloorInit = +(entry - trailDrop).toFixed(2);
  const breakevenPx = +(entry + (roundtripFee / (100 * qty))).toFixed(2);
  const netProfitAtTp = (tpLimit - entry) * 100 * qty - roundtripFee;
  const netProfitPct = capital > 0 ? (netProfitAtTp / capital) * 100 : 0;
  const netLossAtSl = (slTrigger - entry) * 100 * qty - roundtripFee;
  const netLossPct = capital > 0 ? (netLossAtSl / capital) * 100 : 0;
  const worstLoss = (slLimit - entry) * 100 * qty - roundtripFee;
  const rr = Math.abs(netLossAtSl) > 0 ? Math.abs(netProfitAtTp / netLossAtSl) : 0;
  const prof = LS_PROFILES[d.profile] || {};
  const minRR = prof.minNetRR || 0;
  const riskPctOfBudget = budget > 0 ? Math.abs(netLossAtSl) / budget * 100 : 0;
  const occ = parseOccMeta(d.code);

  // Check 5m ATR noise vs Dollar-Capped Stop if cached TA exists
  const symTa = occ ? taCache5m[occ.root] : null;
  const est5mOptionNoise = symTa && symTa.atr ? +(symTa.atr * 0.50).toFixed(2) : null;
  const stopDistance = +(entry - slTrigger).toFixed(2);

  const warnings = [];
  if (totalOutlay > availableCash) {
    warnings.push(`Outlay $${totalOutlay.toFixed(2)} exceeds Available Cash $${availableCash.toFixed(2)} ($${deployed.toFixed(0)} already deployed).`);
  }
  if (capital > maxSingleAllocation) {
    warnings.push(`Single-trade allocation $${capital.toFixed(0)} exceeds 40% cap ($${maxSingleAllocation.toFixed(0)} max on $${budget} budget).`);
  }
  if (entry < 0.80) {
    warnings.push(`Premium $${entry.toFixed(2)} is below $0.80 sweet spot — Moomoo's $${roundtripFee.toFixed(2)} fee causes ${feeDragPct.toFixed(1)}% immediate fee drag.`);
  } else if (entry > 2.20) {
    warnings.push(`Premium $${entry.toFixed(2)} is above $2.20 sweet spot — ${stopPct}% stop risks $${Math.abs(netLossAtSl).toFixed(2)} (over $${maxRisk} cap).`);
  }
  if (maxRisk > 0 && Math.abs(netLossAtSl) > maxRisk + 0.50) {
    warnings.push(`Stop loss risks $${Math.abs(netLossAtSl).toFixed(2)} (above $${maxRisk} cap). Click "Apply $${maxRisk}-Cap Stop" ($${dollarCappedStop.toFixed(2)}).`);
  }
  if (est5mOptionNoise && stopDistance < est5mOptionNoise * 0.85) {
    warnings.push(`5m ATR noise (~$${est5mOptionNoise.toFixed(2)}/bar) is wider than your $${stopDistance.toFixed(2)} stop — high risk of noise stop-out; pick a cheaper strike (~$1.00–$1.25).`);
  }
  if (minRR && rr < minRR - 0.05) {
    warnings.push(`Net R:R 1:${rr.toFixed(2)} is below minimum 1:${minRR.toFixed(1)}.`);
  }
  if (occ && occ.dte < 1.5) {
    warnings.push(`Only ${occ.dte.toFixed(1)} DTE — high Theta decay risk; prefer 2–7 DTE.`);
  }

  return {
    capital, roundtripFee, totalOutlay, deployed, availableCash, maxSingleAllocation, feeDragPct,
    slTrigger, slLimit, t1Trigger, beLockStop, tpLimit, dollarCappedStop, dollarCappedStopPct,
    trailDrop, trailFloorInit, breakevenPx, netProfitAtTp, netProfitPct, netLossAtSl, netLossPct,
    worstLoss, rr, minRR, riskPctOfBudget, maxRisk, est5mOptionNoise, warnings
  };
}

const TA_STALE_MS = 30 * 60 * 1000;
const taIsStale = t => !!(t && t.barAt) && (Date.now() - t.barAt) > TA_STALE_MS;

function lsMinutesToClose() {
  try {
    const x = etParts(), cal = marketCalendar(x.y), close = cal.early.has(ymd(x)) ? 780 : 960;
    return Math.max(0, close - (x.h * 60 + x.min));
  } catch (e) { return 390; }
}

function adaptiveLivePlan(p) {
  const t = p.ta || {}, occ = parseOccMeta(p.code), dte = occ ? occ.dte : 7;
  const mins = lsMinutesToClose(), stale = taIsStale(t), rvol = Number(t.rvol || 0);
  const isCall = p.call !== false, S = Number(t.lastUnderlying || 0);
  const trend = isCall
    ? (S > t.vwap && t.e5 > t.e10 && t.e10 >= t.e20 && Number(t.macdHist) >= 0)
    : (S < t.vwap && t.e5 < t.e10 && t.e10 <= t.e20 && Number(t.macdHist) <= 0);
  const against = isCall
    ? (S < t.vwap && t.e5 < t.e20 && Number(t.macdHist) < 0)
    : (S > t.vwap && t.e5 > t.e20 && Number(t.macdHist) > 0);
  let finalPct = Number(p.tgtPct || 30);
  if (dte < 0.8) finalPct = Math.min(finalPct, 25);
  else if (dte < 2) finalPct = Math.min(finalPct, 30);
  if (mins < 90) finalPct = Math.min(finalPct, 22);
  if (mins < 35) finalPct = Math.min(finalPct, 15);
  if (!trend || rvol < 1.0) finalPct = Math.min(finalPct, 20);
  if (trend && rvol >= 1.25 && mins >= 90 && !stale) finalPct = Math.min(Number(p.tgtPct || 30), finalPct + 5);
  if (against) finalPct = Math.min(finalPct, 10);
  finalPct = Math.max(8, Math.round(finalPct));

  const t1Pct = 15; // Mandatory +15% T1 Breakeven Lock threshold
  const t1Price = +(p.entry * 1.15).toFixed(2);
  const roundtripFee = 2 * cfg.fee * Math.max(1, p.qty || 1);
  const beLockStop = +(p.entry + (roundtripFee / (100 * Math.max(1, p.qty || 1))) + 0.01).toFixed(2);
  const finalPrice = +(p.entry * (1 + finalPct / 100)).toFixed(2);
  const progress = finalPrice > p.entry ? cl((p.live - p.entry) / (finalPrice - p.entry), 0, 1) * 100 : 0;

  // Daily Theta Burn Ratio (|Theta| / Live Price * 100)
  const q = p.optionQuote || {};
  const estTheta = q.theta ? Math.abs(Number(q.theta)) : Math.abs(greeks(S || p.k || 100, p.k || 100, Math.max(0.05, dte) / 365, Number(q.iv || 0.35), isCall).th);
  const thetaBurnPct = p.live > 0 ? (estTheta / p.live) * 100 : 0;

  return { dte, mins, trend, against, stale, rvol, t1Pct, t1Price, beLockStop, finalPct, finalPrice, progress, estTheta, thetaBurnPct };
}

function liveStrikeSelection(p) {
  const q = p.optionQuote || {}, t = p.ta || {}, occ = parseOccMeta(p.code), dte = occ ? occ.dte : 0;
  const spot = Number(t.lastUnderlying || 0), strike = Number(p.k || occ?.strike || 0), absDelta = Math.abs(Number(q.delta || 0));
  const bid = Number(q.bid || 0), ask = Number(q.ask || 0), mid = bid > 0 && ask > 0 ? (bid + ask) / 2 : 0;
  const spreadPct = mid > 0 ? (ask - bid) / mid * 100 : 99, oi = Number(q.oi || 0), vol = Number(q.volume || 0);
  const cost = Number(p.entry || 0) * 100;
  const inSweetSpot = p.entry >= 0.80 && p.entry <= 2.20;

  let score = 0, risks = [];
  if (inSweetSpot) score += 25; else risks.push(`$${p.entry.toFixed(2)} outside $0.80–$2.20 sweet spot`);
  if (cost <= 200) score += 15; else risks.push(`$${cost.toFixed(0)} exceeds $200 (40%) single-trade cap`);
  if (absDelta >= 0.45 && absDelta <= 0.62) score += 25;
  else if (absDelta >= 0.38 && absDelta <= 0.70) score += 16;
  else { score += 5; risks.push(`delta ${absDelta ? absDelta.toFixed(2) : '--'} outside 0.45–0.62`); }
  if (spreadPct <= 5) score += 15; else if (spreadPct <= 8) score += 10; else risks.push('wide spread');
  if (oi >= 500) score += 10; else if (oi >= 200) score += 6;
  if (dte >= 2 && dte <= 7) score += 10; else if (dte >= 1) score += 6; else risks.push(`${dte.toFixed(1)} DTE high Theta burn`);

  score = Math.max(0, Math.min(100, Math.round(score)));
  const grade = score >= 82 ? 'A' : score >= 70 ? 'B' : score >= 58 ? 'C' : 'D';
  const verdict = grade === 'A' ? 'OPTIMAL $500 STRIKE' : grade === 'B' ? 'ACCEPTABLE WITH TIGHT STOP' : grade === 'C' ? 'SUBOPTIMAL FOR $500 BUDGET' : 'AVOID · HIGH FEE/THETA DRAG';
  const alternative = 'Target $0.80–$2.20 ATM contracts (2–7 DTE, |delta| 0.45–0.60, spread ≤5%) to keep risk ≤$25.';
  return { score, grade, verdict, absDelta, spreadPct, oi, vol, dte, risks, alternative };
}

function evaluateLiveStrikeDecision(p) {
  const t = p.ta || {};
  const peak = Math.max(p.entry, p.highestSeen || p.entry, p.live || p.entry);
  p.highestSeen = peak;
  const trailStopPx = +(peak * (1 - (p.trailPct || 12) / 100)).toFixed(2);
  const isCall = p.call !== false;
  const ap = adaptiveLivePlan(p);
  const closedNow = marketPhase().code !== 'open';
  const closedNote = closedNow ? ' (US market closed; using last quote).' : '';
  const sellNow = closedNow ? 'SELL AT OPEN' : 'SELL NOW';

  // Trigger Mandatory +15% T1 Breakeven Lock
  if (p.live >= ap.t1Price && !p.t1Locked) {
    p.t1Locked = true;
    if (p.slPrice < ap.beLockStop) {
      p.slPrice = ap.beLockStop;
      p.slLimit = +(ap.beLockStop * 0.98).toFixed(2);
    }
  }

  if (p.live <= p.slPrice) {
    t.action = p.t1Locked ? `${sellNow} · BREAKEVEN LOCK HIT ($${p.slPrice.toFixed(2)})` : `${sellNow} · STOP LOSS HIT`;
    t.tone = p.t1Locked ? 'warn' : 'sell';
    t.reason = p.t1Locked
      ? `Protected principal + Moomoo fees at $${p.slPrice.toFixed(2)} after reaching +15% T1.`
      : `Live premium ($${p.live.toFixed(2)}) breached -${p.stopPct}% Stop Loss ($${p.slPrice.toFixed(2)}).${closedNote}`;
    p.ta = t; return;
  }
  if (p.live >= ap.finalPrice) {
    t.action = closedNow ? 'SELL AT OPEN · TARGET HIT' : 'SELL / LOCK PROFIT · TARGET HIT';
    t.tone = 'sell';
    t.reason = `Live premium ($${p.live.toFixed(2)}) reached +${ap.finalPct}% target ($${ap.finalPrice.toFixed(2)}).${closedNote}`;
    p.ta = t; return;
  }
  if (p.t1Locked && p.live < ap.finalPrice) {
    t.action = `MOVE STOP TO BREAKEVEN ($${ap.beLockStop.toFixed(2)}) · T1 +15% HIT`;
    t.tone = 'keep';
    t.reason = `T1 (+15% / $${ap.t1Price.toFixed(2)}) hit! Stop raised to $${ap.beLockStop.toFixed(2)} (covers $1.38 Moomoo roundtrip fee). Trail remaining move toward $${ap.finalPrice.toFixed(2)}.`;
    p.ta = t; return;
  }
  if (peak > p.entry * 1.08 && p.live <= trailStopPx) {
    t.action = closedNow ? 'SELL AT OPEN · TRAILING STOP HIT' : 'SELL · TRAILING STOP TRIGGERED';
    t.tone = 'sell';
    t.reason = `Pulled back ${p.trailPct}% from peak ($${peak.toFixed(2)}) to trailing stop ($${trailStopPx.toFixed(2)}).${closedNote}`;
    p.ta = t; return;
  }

  if (!t.e20 || !t.vwap) {
    t.tone = 'warn';
    t.action = t.status === 'error' ? 'NO CHART DATA · SEE REASON' : 'HOLD · LOADING 5M CHART…';

  const againstPts = isCall ? bearPts : bullPts;

  } else if (againstPts >= 5) {

    t.reason = `Trend flipped against ${isCall ? 'CALL' : 'PUT'}: EMA 5/10 crossed against VWAP ($${t.vwap.toFixed(2)}), RSI ${t.rsi.toFixed(0)}. Protect your $500 bankroll.`;
  } else {

    t.tone = 'warn';
    t.reason = `Mixed signals (${favorPts} pro vs ${againstPts} against). T1 Breakeven Lock at $${ap.t1Price.toFixed(2)} (+15%).${burnNote}`;
  }
  p.ta = t;
}

  let totNetPL = 0, totCap = 0, totFees = 0, keepCount = 0, sellCount = 0, holdCount = 0;

  const rows = (cfg.livePos || []).map((p, i) => {
    evaluateLiveStrikeDecision(p);
    const fee = 2 * cfg.fee * p.qty;
    const cap = p.entry * 100 * p.qty;
    const grossPL = (p.live - p.entry) * 100 * p.qty;
    const netPL = grossPL - fee;
    const netPLPct = cap > 0 ? (netPL / cap) * 100 : 0;
    const peak = Math.max(p.entry, p.highestSeen || p.entry, p.live || p.entry);
    const trailStopPx = +(peak * (1 - (p.trailPct || 12) / 100)).toFixed(2);
    const slNetPL = (p.slPrice - p.entry) * 100 * p.qty - fee;

    totNetPL += netPL;
    totCap += cap;
    totFees += fee;
    const tone = p.ta?.tone;
    if (tone === 'sell') sellCount++; else if (tone === 'keep') keepCount++; else holdCount++;

    const t = p.ta || {};
    const ap = adaptiveLivePlan(p);
    const ss = liveStrikeSelection(p);
    const highBurn = ap.thetaBurnPct > 10;

    return `<tr>

          <span class="mu">@</span>
          <input type="number" min="0.01" step="0.01" value="${p.entry}" title="Entry Premium ($)" onchange="updateLiveStrikeField(${i},'entry',this.value)" style="width:72px">
        </div>
      </td>
      <td>

  cfg.bridge = $('#b').value.trim();
  cfg.uni = $('#u').value;
  cfg.fee = Math.max(0, +$('#f').value || 0);
  cfg.stopPct = +$('#slp').value || 20;

  cfg.quantGuard.minAdx = +$('#qadx').value || 25;
  cfg.quantGuard.minRvol = +$('#qrvol').value || 1.5;
  cfg.quantGuard.strictSpreadPct = +$('#qss').value || 5;
  cfg.rthOnly = !!$('#rth')?.checked;
  normalizeCfg();
