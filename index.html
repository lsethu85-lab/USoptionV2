<html lang="en">

<title>AlphaPulse | Pro Options Terminal - Auto-ranked Strike Shortlist</title>
<style>
:root {
  --bg: #0b0f17;
  --surface: #111723;
  --surface-raised: #182234;
  --border: #223048;
  --border-focus: #3b82f6;
  --tx-main: #f1f5f9;
  --tx-muted: #8494ab;
  --tx-faint: #4c5d77;
  --green: #10b981;
  --green-bg: rgba(16, 185, 129, 0.12);
  --red: #ef4444;
  --red-bg: rgba(239, 68, 68, 0.12);
  --blue: #3b82f6;
  --blue-bg: rgba(59, 130, 246, 0.14);
  --amber: #f59e0b;
  --amber-bg: rgba(245, 158, 11, 0.14);
  --mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f6fa;
    --surface: #ffffff;
    --surface-raised: #f8fafc;
    --border: #dbe2ea;
    --border-focus: #2563eb;
    --tx-main: #0f172a;
    --tx-muted: #64748b;
    --tx-faint: #94a3b8;
    --green: #059669;
    --green-bg: #ecfdf5;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --blue: #2563eb;
    --blue-bg: #eff6ff;
    --amber: #d97706;
    --amber-bg: #fffbeb;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--tx-main);
  font: 13px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  gap: 16px;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.5px;
}
.brand-badge {
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  color: #fff;
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 4px;
  font-weight: 800;
  letter-spacing: 1px;
}
nav { display: flex; gap: 6px; }
.btn {
  background: var(--surface-raised);
  color: var(--tx-main);
  border: 1px solid var(--border);
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 500;
  font-size: 12px;
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:hover { background: var(--border); }
.btn.on, .btn.pri {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.btn.sm { padding: 3px 8px; font-size: 11px; }
.btn.danger { color: var(--red); border-color: rgba(239,68,68,0.3); }
.btn.danger:hover { background: var(--red-bg); }
.status-pill {
  font-size: 11px;
  color: var(--tx-muted);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 8px var(--red);
}
.dot.online {
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
}
main {
  padding: 18px 20px;
  max-width: 1400px;
  margin: auto;
}
.kpi-deck {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
}
.kpi-label { font-size: 11px; color: var(--tx-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.kpi-val { font-size: 20px; font-weight: 700; font-family: var(--mono); margin-top: 4px; }
.wrap {
  overflow-x: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
}
table {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}
th, td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  text-align: right;
  white-space: nowrap;
}
th {
  background: var(--surface-raised);
  color: var(--tx-muted);
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
th:first-child, td:first-child { text-align: left; }
.tag {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  font-family: var(--mono);
}
.tag.Strict { background: var(--green-bg); color: var(--green); border: 1px solid rgba(16,185,129,0.25); }
.tag.Balanced { background: var(--blue-bg); color: var(--blue); border: 1px solid rgba(59,130,246,0.25); }
.tag.Aggressive { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(245,158,11,0.25); }
.tag.Buy { background: var(--green-bg); color: var(--green); border: 1px solid rgba(16,185,129,0.25); }
.tag.Sell { background: var(--red-bg); color: var(--red); border: 1px solid rgba(239,68,68,0.25); }
.sym-name { font-weight: 700; color: var(--tx-main); }
.sym-sub { font-size: 11px; color: var(--tx-muted); }
.g { color: var(--green); }
.r { color: var(--red); }
.mu { color: var(--tx-muted); }
.mono { font-family: var(--mono); }
input {
  background: var(--surface-raised);
  color: var(--tx-main);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 4px 8px;
  font-family: var(--mono);
  font-size: 12px;
  width: 82px;
  text-align: right;
}
input:focus { border-color: var(--border-focus); outline: none; }
.set { background: var(--surface); padding: 20px; border-radius: 8px; border: 1px solid var(--border); }
.set label { display: block; margin: 14px 0 4px; color: var(--tx-muted); font-size: 12px; font-weight: 600; }
.set input { width: 100%; max-width: 500px; text-align: left; padding: 7px 10px; }
.row { display: flex; gap: 8px; margin: 0 0 12px; flex-wrap: wrap; align-items: center; }
.actions-cell { display: flex; gap: 4px; justify-content: flex-end; }

.header-right { display:flex; align-items:center; justify-content:flex-end; gap:14px; margin-left:auto; }
.market-clock { display:flex; align-items:center; gap:9px; padding:6px 10px; border:1px solid var(--border); border-radius:7px; background:var(--surface-raised); min-width:290px; }
.market-led { width:8px; height:8px; border-radius:50%; background:var(--tx-faint); box-shadow:0 0 7px var(--tx-faint); flex:0 0 auto; }
.market-led.open { background:var(--green); box-shadow:0 0 8px var(--green); }
.market-led.extended { background:var(--amber); box-shadow:0 0 8px var(--amber); }
.market-led.closed { background:var(--red); box-shadow:0 0 8px var(--red); }
.market-main { min-width:0; }
.market-state { font:700 11px/1.25 var(--mono); letter-spacing:.35px; }
.market-meta { color:var(--tx-muted); font:10px/1.35 var(--mono); white-space:nowrap; }
@media (max-width:760px) { .header-right { width:100%; justify-content:space-between; } .market-clock { min-width:0; flex:1; } }


/* Paper Trading: traditional, no-horizontal-scroll responsive layout */
.paper-view main#v { max-width:1200px; }
.paper-view .paper-intro { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:16px; }

.paper-view tr { display:grid; grid-template-columns:minmax(230px,1.6fr) repeat(2,minmax(110px,.7fr)) minmax(90px,.5fr) minmax(140px,.8fr); gap:0; margin-bottom:12px; background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.08); }

.paper-view .actions-cell { justify-content:flex-start; flex-wrap:wrap; }

@media (max-width:900px) {

@media (max-width:560px) {

  .paper-view td::before { flex:0 0 108px; margin:0; }

  .paper-view .kpi-deck { grid-template-columns:1fr 1fr; }
  .paper-view .kpi-card { padding:11px; }
  .paper-view .kpi-val { font-size:16px; }
}

/* Non-disruptive live updates and Super Agent learning panel */
.agent-panel{margin:16px 0;padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.agent-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}.agent-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}.agent-metric{padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface2)}.agent-metric b{display:block;font-size:18px;margin-top:4px}.agent-list{margin:10px 0 0;padding-left:18px;font-size:12px;line-height:1.6}.safe-note{font-size:11px;color:var(--tx-muted);margin-top:10px}.refresh-status{font-size:11px;color:var(--tx-muted)}
html{scroll-behavior:auto} body{min-height:100vh;overflow-y:scroll}

.scanner-toggle.paused{background:var(--amber-bg);color:var(--amber);border-color:rgba(245,158,11,.45)}

.agent-insight strong{color:var(--tx-main)}.agent-badge{display:inline-block;margin:2px 4px 2px 0;padding:2px 6px;border-radius:4px;font:10px var(--mono);background:var(--blue-bg);color:var(--blue)}

/* Evidence-based trade analyst */
.agent-drawer{position:fixed;right:18px;bottom:18px;width:min(430px,calc(100vw - 24px));max-height:min(720px,calc(100vh - 36px));z-index:50;display:none;flex-direction:column;border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:0 18px 60px rgba(0,0,0,.35);overflow:hidden}.agent-drawer.open{display:flex}.agent-chat-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:13px;border-bottom:1px solid var(--border);background:var(--surface2)}.agent-chat-body{padding:12px;overflow:auto}.agent-context{padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);font-size:11px}.agent-messages{display:grid;gap:9px;margin:12px 0}.agent-msg{max-width:92%;padding:9px 10px;border-radius:9px;font-size:12px;line-height:1.5;white-space:pre-wrap}.agent-msg.user{justify-self:end;background:var(--blue);color:#fff}.agent-msg.bot{justify-self:start;background:var(--surface2);border:1px solid var(--border)}.agent-quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.agent-chat-form{display:flex;gap:7px;padding:11px;border-top:1px solid var(--border)}.agent-chat-form input{flex:1;min-width:0}.agent-chat-status{padding:7px 11px;font-size:11px;color:var(--tx-muted);border-top:1px solid var(--border)}.agent-chat-status.error{color:var(--red)}.evidence-row{display:grid;grid-template-columns:120px 1fr;gap:7px;padding:4px 0;border-bottom:1px dashed var(--border);font-size:11px}.confidence{font-weight:800}.confidence.low{color:var(--amber)}.confidence.medium{color:var(--blue)}.confidence.high{color:var(--green)}.proposal{margin-top:10px;padding:9px;border:1px solid var(--border);border-radius:8px}.shadow-tag{padding:2px 6px;border-radius:4px;background:var(--blue-bg);color:var(--blue);font-size:10px}.agent-fab{position:fixed;right:18px;bottom:18px;z-index:40;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25)}

<script type="text/plain" id="bridge">
const http = require('http'), PORT = process.env.PORT || 8787, UA = { 'User-Agent': 'Mozilla/5.0' };
let cookie = '', crumb = '';
let moomoo = { key: process.env.MOOMOO_KEY || '', secret: process.env.MOOMOO_SECRET || '', host: '127.0.0.1', port: 33333 };
let gemini = { key: process.env.GEMINI_API_KEY || '', model: process.env.GEMINI_MODEL || 'gemini-2.5-pro' };
async function auth() {
  const r = await fetch('https://fc.yahoo.com', { headers: UA, redirect: 'manual' });
  cookie = (r.headers.getSetCookie?.() || []).map(c => c.split(';')[0]).join('; ');
  crumb = await (await fetch('https://query1.finance.yahoo.com/v1/test/getcrumb', { headers: { ...UA, cookie } })).text();
}
async function yf(path) {
  for (let i = 0; i < 2; i++) {
    if (!crumb) await auth();
    const r = await fetch('https://query2.finance.yahoo.com' + path + (path.includes('?') ? '&' : '?') + 'crumb=' + encodeURIComponent(crumb), { headers: { ...UA, cookie } });
    if (r.ok) return r.json();
    crumb = '';
  }
  throw new Error('Yahoo request failed');
}

let mm = null, mmReady = false, mmErr = '', subd = new Set(), mmTimer = null;
// Minimal protobuf reader for InitWebSocket.Response (retType=1, retMsg=2, errCode=3).
function pbInit(ab) {
  const u = new Uint8Array(ab), o = {}; let i = 0;
  const vi = () => { let r = 0n, s = 0n, b; do { b = u[i++]; r |= BigInt(b & 127) << s; s += 7n; } while (b & 128); return r; };
  while (i < u.length) {
    const t = Number(vi()), f = t >> 3, w = t & 7;
    if (w === 0) { const v = vi(); if (f === 1) o.retType = Number(BigInt.asIntN(32, v)); if (f === 3) o.errCode = Number(BigInt.asIntN(32, v)); }
    else if (w === 2) { const n = Number(vi()); if (f === 2) o.retMsg = Buffer.from(u.subarray(i, i + n)).toString('utf8'); i += n; }
    else if (w === 1) i += 8; else if (w === 5) i += 4; else break;
  }
  return o;
}
function mmClose() {
  clearTimeout(mmTimer);
  try { if (mm && typeof mm.stop === 'function') mm.stop(); } catch (e) {}
  mm = null; mmReady = false;
}
function mmConnect() {
  mmClose();
  let M;
  try { M = require('moomoo-api'); }
  catch (e) { mmErr = 'moomoo-api not installed. Run: npm i moomoo-api (in the same folder as server.js)'; return; }
  try {
    const C = M.default || M, me = new C();
    let refusal = null;
    mm = me; subd.clear(); mmErr = 'connecting';
    me.onlogin = (ret, msg) => {
      if (mm !== me) return;
      clearTimeout(mmTimer);
      mmReady = !!ret;
      if (ret) mmErr = '';
      else if (refusal) mmErr = 'OpenD refused the connection: ' + (refusal.retMsg || 'no message') + ' (code ' + refusal.retType + (refusal.errCode ? '/' + refusal.errCode : '') + '). Check the WebSocket key matches OpenD.';
      else mmErr = 'OpenD login failed: ' + (msg || 'check WebSocket key (plain text, not the MD5) and port');
      console.log('[moomoo] login', ret ? 'OK' : 'FAILED', refusal ? JSON.stringify(refusal) : (msg && msg.message || msg || ''));
    };
    me.start(moomoo.host, +moomoo.port, false, moomoo.key);
    // The SDK throws away OpenD's error reply to the init request; read it ourselves so the real reason is shown.
    const wb = me.websock;
    if (wb && typeof wb.sendBuff === 'function') {
      const orig = wb.sendBuff.bind(wb);
      wb.sendBuff = (cmd, buf, t) => {
        const p = orig(cmd, buf, t);
        return cmd !== 1 ? p : p.then(r => { try { if (r && r.buff) { const d = pbInit(r.buff); if (d.retType !== undefined && d.retType !== 0) refusal = d; } } catch (e) {} return r; });
      };
    }
    mmTimer = setTimeout(() => {
      if (mm === me && !mmReady && mmErr === 'connecting')
        mmErr = 'No login response from OpenD at ' + moomoo.host + ':' + moomoo.port + ' after 8s. Check OpenD is running, its WebSocket port is enabled, and the key matches.';
    }, 8000);
  } catch (e) { mm = null; mmErr = e.message; }
}
// A refused/dropped OpenD socket can throw asynchronously inside the SDK; keep the bridge alive and report it.
process.on('uncaughtException', e => { console.error('[bridge]', e.message); if (mm && !mmReady) mmErr = 'OpenD connection error: ' + e.message; });
process.on('unhandledRejection', e => { console.error('[bridge]', e && e.message || e); if (mm && !mmReady) mmErr = 'OpenD connection error: ' + (e && e.message || e); });
function toMoomooOptionCodes(raw) {
  const s = String(raw || '').toUpperCase().trim().replace(/^US[.:]/, '').replace(/-US$/, '').replace(/\s+/g, '');
  const m = /^([A-Z]{1,6})(\d{6}[CP])(\d{1,8})$/.exec(s);
  if (!m) return null;
  const root = m[1], ymdcp = m[2], d = m[3];
  const strikeMill = d.length === 8 ? parseInt(d, 10) : (d.length >= 5 ? parseInt(d, 10) : parseInt(d, 10) * 1000);
  const compact = `${root}${ymdcp}${strikeMill}`;
  const occ = `${root}${ymdcp}${String(strikeMill).padStart(8, '0')}`;
  return { compact, occ, candidates: compact === occ ? [compact] : [compact, occ] };
}
async function moomooQuote(code) {
  const parsed = toMoomooOptionCodes(code);
  if (!parsed || !mm || !mmReady) return null;
  for (const c of parsed.candidates) {
    const sec = { market: 11, code: c };
    try {
      if (!subd.has(sec.code)) {
        await mm.Sub({ c2s: { securityList: [sec], subTypeList: [1, 2], isSubOrUnSub: true, isRegOrUnRegPush: false } });
        subd.add(sec.code);
      }
      const res = await mm.GetBasicQot({ c2s: { securityList: [sec] } });
      const q = res?.s2c?.basicQotList?.[0];
      if (q && (Number(q.curPrice) > 0 || Number(q.lastClosePrice) > 0 || Number(q.openPrice) > 0)) {
        let bid = 0, ask = 0;
        try {
          const ob = (await mm.GetOrderBook({ c2s: { security: sec, num: 1 } }))?.s2c;
          bid = Number(ob?.orderBookBidList?.[0]?.price || 0);
          ask = Number(ob?.orderBookAskList?.[0]?.price || 0);
        } catch (e) {}
        const last = Number(q.curPrice) > 0 ? Number(q.curPrice) : (bid > 0 && ask > 0 ? +((bid + ask) / 2).toFixed(2) : Number(q.lastClosePrice) || 0);
        if (last > 0) return {
          last,
          curPrice: Number(q.curPrice || 0),
          bid,
          ask,
          volume: Number(q.volume || 0),
          oi: Number(q.optionExData?.openInterest || 0),
          oiIncrement: Number(q.optionExData?.netOpenInterest || 0),
          iv: Number(q.optionExData?.impliedVolatility || 0) / 100,
          delta: Number(q.optionExData?.delta || 0),
          theta:Number(q.optionExData?.theta||0),
          gamma:Number(q.optionExData?.gamma||0),
          vega:Number(q.optionExData?.vega||0),
          code: c,
          occ: parsed.occ
        };
      }
    } catch (e) { mmErr = e.message; }
  }
  return null;
}
async function moomooQuotesBatch(codesCsv) {
  const rawList = String(codesCsv || '').split(',').map(s => s.trim()).filter(Boolean);
  const out = {};
  for (const raw of rawList) {
    const q = await moomooQuote(raw);
    if (q && q.last > 0) out[raw] = q;
  }
  return out;
}
if (moomoo.key) mmConnect();

const E = encodeURIComponent;
const routes = {
  '/api/chain': q => yf(`/v7/finance/options/${E(q.symbol)}` + (q.date ? `?date=${q.date}` : '')),
  '/api/quote': q => yf(`/v7/finance/quote?symbols=${E(q.symbols)}`),
  '/api/chart': q => yf(`/v8/finance/chart/${E(q.symbol)}?range=${q.range || '6mo'}&interval=${q.interval || '1d'}`),
  '/api/moomoo/quote': async q => ({ quote: await moomooQuote(q.code) }),
  '/api/moomoo/quotes': async q => ({ quotes: await moomooQuotesBatch(q.codes) }),
  '/api/moomoo/status': async () => ({ configured: !!moomoo.key, connected: mmReady, error: mmErr, host: moomoo.host, port: moomoo.port, geminiConfigured: !!gemini.key, geminiModel: gemini.model }),
  '/api/gemini/filter': async q => {
    const payload = typeof q.payload === 'string' ? JSON.parse(decodeURIComponent(q.payload)) : (q.payload || {});
    const apiKey = q.apiKey || gemini.key || process.env.GEMINI_API_KEY;
    const model = q.model || gemini.model || 'gemini-2.5-pro';
    const mode = q.mode || 'local';
    if (!apiKey || mode === 'local') {
      return { approved: true, delegateLocal: true, reasoning: 'Handled by Local Profitable Quant+TA Engine' };
    }
    const prompt = `You are an intraday options trading filter. Evaluate the provided JSON payload for an At-The-Money (ATM) contract:
${JSON.stringify(payload, null, 2)}

1. Verify that the 5m TA indicators support momentum in the option's direction (for CALL: Spot > VWAP, EMA5 > EMA20, RSI 45-70, MACD Hist >= 0; for PUT: Spot < VWAP, EMA5 < EMA20, RSI 30-55, MACD Hist <= 0).
2. Analyze the Moomoo Options Data. Confirm that Implied Volatility (IV) is not severely inflated relative to Historical Volatility (HV), Open Interest (OI) and OI increment demonstrate sufficient liquidity/inflow, and bid-ask spread is tight.
3. Evaluate if the setup justifies the strict intraday Risk/Reward configuration (e.g., ${payload?.risk_reward_config?.stopLossPct || 25}% Stop Loss vs. ${payload?.risk_reward_config?.targetPct || 60}% Target, R:R 1:${payload?.risk_reward_config?.riskRewardRatio || 1.5}).
4. Output your response strictly as a JSON object containing a boolean "approved": true/false and a brief "reasoning" string.`;

    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { responseMimeType: 'application/json', temperature: 0.1 }
      })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data?.error?.message || ('Gemini HTTP ' + r.status));
    const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
    const jsonMatch = text.match(/\{[\s\S]*\}/);
    if (!jsonMatch) return { approved: false, reasoning: 'Failed to parse Gemini JSON output.' };
    const parsed = JSON.parse(jsonMatch[0]);
    return { approved: !!parsed.approved, source: 'Gemini Pro', reasoning: String(parsed.reasoning || 'Evaluated by Gemini Pro.') };
  },
};

http.createServer(async (req, res) => {
  res.setHeader('Access-Control-Allow-Origin', '*');
  res.setHeader('Access-Control-Allow-Headers', 'content-type');
  if (req.method === 'OPTIONS') return res.end();
  const u = new URL(req.url, 'http://x'), q = Object.fromEntries(u.searchParams);
  const send = (c, o) => { res.writeHead(c, { 'Content-Type': 'application/json' }); res.end(JSON.stringify(o)); };
  try {
    if (req.method === 'POST' && u.pathname === '/api/moomoo/config') {
      let b = ''; for await (const chunk of req) b += chunk; const c = JSON.parse(b || '{}');
      for (const k of ['key', 'secret', 'host', 'port']) if (c[k] !== undefined && c[k] !== '' && c[k] !== null) moomoo[k] = c[k];
      if (c.geminiKey) gemini.key = c.geminiKey;
      if (c.geminiModel) gemini.model = c.geminiModel;
      mmConnect();
      return send(200, { ok: true });
    }
    if (req.method === 'POST' && u.pathname === '/api/gemini/config') {
      let b = ''; for await (const chunk of req) b += chunk; const c = JSON.parse(b || '{}');
      if (c.key !== undefined && c.key !== '') gemini.key = c.key;
      if (c.model) gemini.model = c.model;
      return send(200, { ok: true, geminiConfigured: !!gemini.key, geminiModel: gemini.model });
    }
    if (req.method === 'POST' && u.pathname === '/api/gemini/filter') {
      let b = ''; for await (const chunk of req) b += chunk; const c = JSON.parse(b || '{}');
      return send(200, await routes['/api/gemini/filter'](c));
    }
    const h = routes[u.pathname];
    if (!h) return send(404, { error: 'not found' });
    send(200, await h(q));
  } catch (e) { send(500, { error: e.message }); }
}).listen(PORT, '127.0.0.1', () => console.log('Bridge on http://127.0.0.1:' + PORT));
</script>

    root, y, m: mo, d, call, strike,

  else if ((m = /^(\d{4})(\d{2})(\d{2})$/.exec(txt))) { y = +m[1]; mo = +m[2]; d = +m[3]; }                         // 20261106
  else if ((m = /^(\d{2})(\d{2})(\d{2})$/.exec(txt))) { y = 2000 + +m[1]; mo = +m[2]; d = +m[3]; }                  // 261106
  else if ((m = /^([A-Z]{3})[A-Z]*\.? (\d{1,2})(?:,? (\d{4}))?$/.exec(txt))) { mo = MONTHS.indexOf(m[1]) + 1; d = +m[2]; if (m[3]) y = +m[3]; } // NOV 6 [2026]

function parseContractInput(raw, refTs) {
  const s = String(raw || '').toUpperCase().trim().replace(/^US[.:]/, '').replace(/-US$/, '').replace(/\s+/g, ' ');

      delta: +(p.d || 0).toFixed(3),
      theta: +(p.th || 0).toFixed(4),
      quoteSource: p.src || 'Yahoo'
    },
    intraday_ta_5m: {
      ema5: +(e.ema5 || 0).toFixed(2),
      ema10: +(e.ema10 || 0).toFixed(2),
      ema20: +(e.ema20 || 0).toFixed(2),
      vwap: +(e.vwap || 0).toFixed(2),
      rsi: +(e.rsi || p.R || 50).toFixed(1),
      macd: +(e.macd || 0).toFixed(4),
      macdSignal: +(e.macdSig || 0).toFixed(4),
      macdHist: +(e.macdHist || 0).toFixed(4),
      pattern: e.pattern5m || 'Neutral'
    },
    risk_reward_config: {
      entryPrice: livePx,
      stopLossPrice: stopPx,
      targetPrice: tgtPx,
      stopLossPct: cfg.stopPct,
      targetPct,
      riskRewardRatio: tierRR(p.tier)
    }
  };
}

function evaluateLocalProfitableFilter(geminiPayload) {
  const c = geminiPayload?.contract || {};
  const m = geminiPayload?.moomoo_options_data || {};
  const ta = geminiPayload?.intraday_ta_5m || {};
  const rr = geminiPayload?.risk_reward_config || {};
  const gf = cfg.geminiFilter || {};

  const isCall = c.type === 'CALL';
  const spot = Number(c.underlyingPrice || ta.ema5 || 0);
  const absDelta = Math.abs(Number(m.delta || 0));
  const distPct = Number(c.moneynessDistPct ?? 0);
  const maxDist = Number(gf.atmMaxDistPct || 2.5);
  const isNearATM = !!c.isATM || distPct <= maxDist || (absDelta >= 0.35 && absDelta <= 0.65);

  if (gf.atmOnly !== false && !isNearATM) {
    return {
      approved: false,
      source: 'Local Quant+TA',
      score: 0,
      at: Date.now(),
      reasoning: `Rejected (Non-ATM): Strike $${c.strike} is ${distPct.toFixed(2)}% from spot ($${spot.toFixed(2)}, Δ ${Number(m.delta || 0).toFixed(2)}), outside ATM limit (${maxDist}%).`
    };
  }

  const oi = Number(m.openInterest || 0);
  const oiInc = Number(m.oiIncrement || 0);
  const vol = Number(m.volume || 0);
  const minOI = Number(gf.minOI || 200);
  const ivPct = Number(m.impliedVolatility || 0) * 100;
  const hvPct = Number(m.historicalVolatility || 0.20) * 100;
  const maxIV = Number(gf.maxIVPct || 120);
  const ivRatio = (m.impliedVolatility || 0) / Math.max(0.12, m.historicalVolatility || 0.20);
  const spreadPct = Number(m.spreadPct || 0);

  if (oi < minOI) {
    return {
      approved: false,
      source: 'Local Quant+TA',
      score: 20,
      at: Date.now(),
      reasoning: `Rejected (Low OI): Open Interest ${oi} is below minimum threshold (${minOI}).`
    };
  }
  if (ivPct > maxIV || ivRatio > 1.55) {
    return {
      approved: false,
      source: 'Local Quant+TA',
      score: 25,
      at: Date.now(),
      reasoning: `Rejected (IV Crush Risk): IV ${ivPct.toFixed(0)}% vs HV ${hvPct.toFixed(0)}% (ratio ${ivRatio.toFixed(2)}x, max ${maxIV}%).`
    };
  }
  if (spreadPct > 10.5) {
    return {
      approved: false,
      source: 'Local Quant+TA',
      score: 30,
      at: Date.now(),
      reasoning: `Rejected (Wide Spread): Bid-Ask spread ${spreadPct.toFixed(1)}% exceeds 10% intraday slippage limit.`
    };
  }
  if (oiInc < 0 && Math.abs(oiInc) > oi * 0.20) {
    return {
      approved: false,
      source: 'Local Quant+TA',
      score: 35,
      at: Date.now(),
      reasoning: `Rejected (OI Outflow): Heavy Open Interest drop (${oiInc}) indicates position unwinding.`
    };
  }

  // 5-Minute Intraday TA Confluence Scoring (60 pts max) + Moomoo Options & R:R Quality (40 pts max) = 100 pts
  let taPts = 0;
  const reasons = [];
  const vwap = Number(ta.vwap || spot);
  const e5 = Number(ta.ema5 || spot);
  const e10 = Number(ta.ema10 || spot);
  const e20 = Number(ta.ema20 || spot);
  const rsiVal = Number(ta.rsi || 50);
  const macdHist = Number(ta.macdHist || 0);
  const pat = String(ta.pattern || 'Neutral');

  // 1. Price vs 5m VWAP (20 pts)
  if (isCall) {
    if (spot >= vwap) { taPts += 20; reasons.push(`Spot > VWAP ($${vwap.toFixed(2)})`); }
    else if (spot >= vwap * 0.9985) { taPts += 10; reasons.push(`Spot near VWAP`); }
    else { reasons.push(`Spot < VWAP`); }
  } else {
    if (spot <= vwap) { taPts += 20; reasons.push(`Spot < VWAP ($${vwap.toFixed(2)})`); }
    else if (spot <= vwap * 1.0015) { taPts += 10; reasons.push(`Spot near VWAP`); }
    else { reasons.push(`Spot > VWAP`); }
  }

  // 2. 5m EMA 5 / 10 / 20 Alignment (20 pts)
  if (isCall) {
    if (e5 > e10 && e10 >= e20) { taPts += 20; reasons.push(`EMA5>10>20`); }
    else if (e5 >= e20) { taPts += 14; reasons.push(`EMA5>=EMA20`); }
    else if (e5 > e10) { taPts += 8; reasons.push(`EMA5>EMA10 bounce`); }
    else { reasons.push(`EMA5<EMA20`); }
  } else {
    if (e5 < e10 && e10 <= e20) { taPts += 20; reasons.push(`EMA5<10<20`); }
    else if (e5 <= e20) { taPts += 14; reasons.push(`EMA5<=EMA20`); }
    else if (e5 < e10) { taPts += 8; reasons.push(`EMA5<EMA10 pullback`); }
    else { reasons.push(`EMA5>EMA20`); }
  }

  // 3. 5m RSI Momentum Sweet Spot (10 pts)
  if (isCall) {
    if (rsiVal > 78) {
      return { approved: false, source: 'Local Quant+TA', score: 40, at: Date.now(), reasoning: `Rejected (Overbought 5m RSI ${rsiVal.toFixed(0)} > 78): High intraday pullback risk for CALL.` };
    }
    if (rsiVal >= 48 && rsiVal <= 73) { taPts += 10; reasons.push(`RSI ${rsiVal.toFixed(0)} bullish`); }
    else if (rsiVal >= 44) { taPts += 5; reasons.push(`RSI ${rsiVal.toFixed(0)}`); }
  } else {
    if (rsiVal < 22) {
      return { approved: false, source: 'Local Quant+TA', score: 40, at: Date.now(), reasoning: `Rejected (Oversold 5m RSI ${rsiVal.toFixed(0)} < 22): High intraday bounce risk for PUT.` };
    }
    if (rsiVal >= 27 && rsiVal <= 52) { taPts += 10; reasons.push(`RSI ${rsiVal.toFixed(0)} bearish`); }
    else if (rsiVal <= 56) { taPts += 5; reasons.push(`RSI ${rsiVal.toFixed(0)}`); }
  }

  // 4. 5m MACD Histogram & Candlestick Pattern (10 pts)
  if (isCall) {
    if (macdHist >= 0) taPts += 5;
    if (/Bullish|Breakout|Hammer/i.test(pat)) taPts += 5;
    else if (/Bearish Engulfing|Shooting Star|Breakdown/i.test(pat)) taPts -= 8;
  } else {
    if (macdHist <= 0) taPts += 5;
    if (/Bearish|Breakdown|Shooting/i.test(pat)) taPts += 5;
    else if (/Bullish Engulfing|Hammer|Breakout/i.test(pat)) taPts -= 8;
  }

  // 5. Moomoo Options Liquidity, OI Inflow, IV/HV & Net Fee-Adjusted R:R (40 pts)
  let optPts = 0;
  if (spreadPct <= 4.5) optPts += 10;
  else if (spreadPct <= 8.0) optPts += 7;
  else optPts += 4;

  if (ivRatio <= 1.15) optPts += 10;
  else if (ivRatio <= 1.35) optPts += 7;
  else optPts += 4;

  if (oiInc > 0) { optPts += 10; reasons.push(`OI ${oi} (+${oiInc})`); }
  else if (oi >= 500 && vol >= 150) { optPts += 8; reasons.push(`OI ${oi} / Vol ${vol}`); }
  else { optPts += 5; reasons.push(`OI ${oi}`); }

  const livePx = Math.max(0.05, Number(m.livePrice || rr.entryPrice || 0.5));
  const roundtripFeePct = (2 * (cfg.fee || 0.69)) / (livePx * 100) * 100;
  const netRR = Number(rr.riskRewardRatio || 1.5);
  const thetaBurden = Math.abs(Number(m.theta || 0)) / livePx;
  if (netRR >= 1.5 && thetaBurden <= 0.30 && roundtripFeePct <= 6.0) optPts += 10;
  else if (netRR >= 1.25 && thetaBurden <= 0.42) optPts += 6;

  const totalScore = Math.max(0, Math.min(100, Math.round(taPts + optPts)));
  const minReq = Number(gf.minConfluencePct || 68);
  const approved = taPts >= 34 && totalScore >= minReq;

  return {
    approved,
    source: 'Local Quant+TA',
    score: totalScore,
    at: Date.now(),
    reasoning: `${approved ? 'Confluence Gate Passed' : 'Setup Below Confluence Threshold'} (${totalScore}% vs ${minReq}% min): ${c.type} Δ${absDelta.toFixed(2)} | ${reasons.join(', ')} | IV ${ivPct.toFixed(0)}%, Spread ${spreadPct.toFixed(1)}%, R:R 1:${netRR}`
  };
}

async function callGeminiFilterAPI(geminiPayload) {
  const gf = cfg.geminiFilter || {};
  const mode = gf.engineMode || 'local';
  const model = gf.model || 'gemini-2.5-pro';
  const browserKey = (gf.apiKey || '').trim();

  // Default & recommended: 100% Local Profitable Quant + 5m TA Engine (Zero API Key required, 0ms latency)
  if (mode === 'local') {
    return evaluateLocalProfitableFilter(geminiPayload);
  }

  // Optional Gemini Pro Cloud Mode (automatically falls back to Local Quant+TA if no key or offline)
  try {
    const res = await api('/api/gemini/filter', {
      method: 'POST',
      timeoutMs: 15000,
      body: { payload: geminiPayload, model, mode, apiKey: browserKey || undefined }
    });
    if (res && res.delegateLocal) return evaluateLocalProfitableFilter(geminiPayload);
    return res;
  } catch (bridgeErr) {
    if (!browserKey) return evaluateLocalProfitableFilter(geminiPayload);
    const prompt = `You are an intraday options trading filter. Evaluate the provided JSON payload for an At-The-Money (ATM) contract:
${JSON.stringify(geminiPayload, null, 2)}

1. Verify that the 5m TA indicators support momentum in the option's direction (for CALL: Spot > VWAP, EMA5 > EMA20, RSI 45-70, MACD Hist >= 0; for PUT: Spot < VWAP, EMA5 < EMA20, RSI 30-55, MACD Hist <= 0).
2. Analyze the Moomoo Options Data. Confirm that Implied Volatility (IV) is not severely inflated relative to Historical Volatility (HV), Open Interest (OI) and OI increment demonstrate sufficient liquidity/inflow, and bid-ask spread is tight.
3. Evaluate if the setup justifies the strict intraday Risk/Reward configuration (e.g., ${geminiPayload?.risk_reward_config?.stopLossPct || 25}% Stop Loss vs. ${geminiPayload?.risk_reward_config?.targetPct || 60}% Target, R:R 1:${geminiPayload?.risk_reward_config?.riskRewardRatio || 1.5}).
4. Output your response strictly as a JSON object containing a boolean "approved": true/false and a brief "reasoning" string.`;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);
    try {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(browserKey)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        signal: ctrl.signal,
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { responseMimeType: 'application/json', temperature: 0.1 }
        })
      });
      clearTimeout(timer);
      const data = await r.json();
      if (!r.ok) throw new Error(data?.error?.message || ('Gemini HTTP ' + r.status));
      const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
      const jsonMatch = text.match(/\{[\s\S]*\}/);
      return jsonMatch ? { ...JSON.parse(jsonMatch[0]), source: 'Gemini Pro' } : evaluateLocalProfitableFilter(geminiPayload);
    } catch (e) {
      clearTimeout(timer);
      return evaluateLocalProfitableFilter(geminiPayload);
    }
  }
}

async function executeEligibleAutoPicks() {
  const eligible = picks.filter(isAutoPickEligible);
  const liveCodes = new Set(eligible.map(p => p.code));
  // Rearm only after a contract leaves the eligible result set.
  Object.keys(cfg.autoPickExecuted).forEach(code => { if (!liveCodes.has(code)) delete cfg.autoPickExecuted[code]; });
  let added = 0, handled = 0, waiting = 0, waitReason = '';
  for (const p of eligible) {
    if (cfg.autoPickExecuted[p.code]) { handled++; continue; }
    // Pre-check temporary gates (RTH, max open positions, symbol lock, cooldown)
    if (cfg.rthOnly !== false && typeof marketPhase === 'function' && marketPhase().code !== 'open') {
      waiting++;waitReason='US regular market closed (RTH filter active)';logSignalDecision({stage:REJECT_STAGE.EXECUTION,reasonCode:'OUTSIDE_RTH',reason:waitReason,symbol:p.sym,contract:p.code,retryable:true});continue;
    }
    const maxPos = Number(cfg.maxOpenPos) || 3;
    if (cfg.pos.length >= maxPos) {
      waiting++;waitReason=`Max open positions (${maxPos}) reached`;logSignalDecision({stage:REJECT_STAGE.RISK,reasonCode:'MAX_OPEN_POSITIONS',reason:waitReason,symbol:p.sym,contract:p.code,retryable:true});continue;
    }
    if (cfg.onePerSymbol !== false && cfg.pos.some(x => x.sym === p.sym)) {
      waiting++;waitReason=`Active position already open for ${p.sym}`;logSignalDecision({stage:REJECT_STAGE.RISK,reasonCode:'SYMBOL_ALREADY_OPEN',reason:waitReason,symbol:p.sym,contract:p.code,retryable:true});continue;
    }
    if (isSymbolInCooldown(p.sym)) {
      waiting++;waitReason=`${p.sym} is in ${cfg.cooldownMins}m post-exit cooldown`;logSignalDecision({stage:REJECT_STAGE.RISK,reasonCode:'SYMBOL_COOLDOWN',reason:waitReason,symbol:p.sym,contract:p.code,retryable:true});continue;
    }

    // Secondary Profitable Filter: ATM + Moomoo OI/IV + 5m TA (runs 100% locally with zero API key required)
    if (cfg.geminiFilter?.enabled !== false && (p.m || 'intraday') === 'intraday') {
      const geminiPayload = buildGeminiPayload(p);
      const aiResponse = await callGeminiFilterAPI(geminiPayload);
      p.gemini = { approved: !!aiResponse.approved, source: aiResponse.source || 'Local Quant+TA', score: aiResponse.score, reasoning: String(aiResponse.reasoning || ''), at: Date.now() };
      cfg.geminiDecisions[p.code] = p.gemini;
      if (!aiResponse.approved) {
        waiting++;
        waitReason = `${p.sym}: ${aiResponse.reasoning}`;
        logSignalDecision({stage:REJECT_STAGE.SECONDARY,reasonCode:'SECONDARY_FILTER_REJECTED',reason:String(aiResponse.reasoning||'Secondary filter rejected'),symbol:p.sym,contract:p.code,mode:p.m,tier:p.tier,score:p.score,metrics:{regime:p.quantRegime?.name,pattern:p.quantRegime?.pattern}});
        cfg.autoPickExecuted[p.code]=Date.now();continue;
      }
    }

    const result = createPaperOrder(p, 'Auto-Picks hard trigger');
    if (result.ok) {
      added++;
      if (p.gemini?.reasoning && cfg.pos.length) {
        cfg.pos[cfg.pos.length - 1].timeline.push({ at: Date.now(), type: 'QUANT_APPROVAL', reason: p.gemini.reasoning });
      }
    } else if (result.retry) {
      waiting++;waitReason=result.reason;logSignalDecision({stage:REJECT_STAGE.EXECUTION,reasonCode:'ORDER_GATE_REJECTED',reason:String(result.reason||'Order gate rejected'),symbol:p.sym,contract:p.code,retryable:true,tier:p.tier,score:p.score});continue;
    } else {
      handled++;
    }
    cfg.autoPickExecuted[p.code] = Date.now();
  }
  save();
  autoTradeMsg = (added ? `${added} profitable contract${added === 1 ? '' : 's'} auto-added to Paper Trading` :
                 `No new entry (${eligible.length} eligible, ${handled} already handled/open)`) +
                 (waiting ? ` · ${waiting} filtered/waiting: ${waitReason}` : '');
  return added;
}

async function syncPicksLivePrices() {
  if (!picks || !picks.length) return false;
  let updated = false;
  for (const p of picks) {
    try {
      const q = (await api('/api/moomoo/quote?code=' + encodeURIComponent(p.code))).quote;
      if (q && q.last > 0) {
        p.live = q.last;
        if (q.bid > 0) p.bid = q.bid;
        if (q.ask > 0) p.ask = q.ask;
        if (q.bid > 0 && q.ask > 0) p.mid = +((q.bid + q.ask) / 2).toFixed(2);
        if (q.oi > 0) {
          const prev = cfg.prevOI?.[p.code] ?? p.oi ?? q.oi;
          p.oiIncrement = q.oiIncrement ? q.oiIncrement : (q.oi - prev);
          p.oi = q.oi;
          cfg.prevOI[p.code] = q.oi;
        }
        if (q.iv > 0) p.iv = q.iv;
        if (q.delta) p.d = q.delta;
        if(q.theta)p.th=q.theta;if(q.gamma)p.ga=q.gamma;if(q.vega)p.ve=q.vega;p.quoteAgeSec=0;
        p.src = 'Moomoo';
        const plan = riskPlan(p.live, p.tier, (p.m || 'intraday') === 'intraday');
        p.stop = plan.stop;
        p.tgt = plan.tgt;
        if (p.evidence) {
          p.evidence.live = p.live;
          p.evidence.oi = p.oi;
          p.evidence.oiIncrement = p.oiIncrement || 0;
          p.evidence.iv = p.iv;
          if (q.bid > 0 && q.ask > 0 && p.mid > 0) {
            p.evidence.bid = q.bid;
            p.evidence.ask = q.ask;
            p.evidence.mid = p.mid;
            p.evidence.spreadPct = ((q.ask - q.bid) / p.mid) * 100;
          }
          p.evidence.quoteSource = 'Moomoo Live';
        }
        if ((p.m || 'intraday') === 'intraday' && typeof evaluateLocalProfitableFilter === 'function') {
          p.gemini = evaluateLocalProfitableFilter(buildGeminiPayload(p));
          cfg.geminiDecisions[p.code] = p.gemini;
        }
        updated = true;
      } else if (p.oi > 0) {
        cfg.prevOI[p.code] = p.oi;
      }
    } catch (e) {}
  }
  return updated;
}

async function scan(manual=false) {
  if (busy) return;
  if (cfg.scannerPaused && !manual) { msg='Scanner paused'; if(tab==='picks')render(); return; }
  busy=true;window.__scanId=`SCAN-${Date.now()}`;
  picks=[];
  msg = 'Connecting to bridge...';
  if(tab === 'picks') render();
  for (const s of [...new Set(cfg.uni.split(',').map(s => s.trim().toUpperCase()).filter(Boolean))]) {
    msg = 'Scanning ' + s + '…';
    if(tab === 'picks') render();
    try {
      picks.push(...await analyze(s));
    } catch(e) {
      console.warn('Bridge check for '+s+':',e.message);logSignalDecision({status:'rejected',stage:REJECT_STAGE.DATA,reasonCode:'SYMBOL_SCAN_ERROR',reason:String(e.message||e),symbol:s,retryable:true});
    }
  }
  // Sorted once, best first: this is also the entry priority when the max-open-positions limit binds.
  picks.sort((a, b) => b.score - a.score);
  updateMarketRegimeFromPicks(picks);
  picks.forEach(p=>logSignalDecision({status:'qualified',stage:'QUALIFIED',reasonCode:'PASSED_ALL_SCAN_GATES',reason:'Contract qualified for execution review',symbol:p.sym,contract:p.code,mode:p.m,side:p.call?'CALL':'PUT',expiry:p.exp,strike:p.k,tier:p.tier,score:p.score,metrics:{bid:p.bid,ask:p.ask,mid:p.mid,spreadPct:p.evidence?.spreadPct,oi:p.oi,volume:p.v,ivPct:p.iv*100,delta:p.d,gamma:p.ga,theta:p.th,vega:p.ve,quoteAgeSec:p.quoteAgeSec,regime:p.quantRegime?.name,adx:p.quantRegime?.adx,rvol:p.quantRegime?.rvol,pattern:p.quantRegime?.pattern}}));save();
  if (picks.length) {
    msg = 'Syncing live Moomoo strike prices…';
    if (tab === 'picks') render();
    await syncPicksLivePrices();
  }
  busy = false;
  const added = await executeEligibleAutoPicks();
  msg = picks.length ? (`Synced: ${new Date().toLocaleTimeString()} · ${picks.length} qualified · ${added} new paper order${added === 1 ? '' : 's'}`) : 'Bridge offline or zero eligible strikes returned';
  if(tab === 'picks' || (added && tab === 'paper')) render();
}

function sendPickToLive(code) {
  const p = picks.find(x => x.code === code);
  if (!p) return;
  const livePx = Number(p.live) > 0 ? Number(p.live) : Number(p.mid);
  lsDraft.code = p.code;
  lsDraft.entry = +livePx.toFixed(2);
  lsDraft.qty = lsFitQty(lsDraft.entry, lsDraft.budget || 500, lsDraft.maxRisk || 25, lsDraft.stopPct || 25);
  setTab('live');
}

function add(code) {
  const p = picks.find(x => x.code === code);
  if (!p) return;
  const result = createPaperOrder(p, 'Manual Auto-Picks');
  if (!result.ok) { alert(result.reason === 'Already open' ? 'This contract is already open in Paper Trading.' : 'Contract no longer meets the hard Auto-Picks policy.'); return; }
  cfg.autoPickExecuted[code] = Date.now();
  save();
  setTab('paper');
}

function setRR(i, ratio) {

  if (ratio === 'custom') return;
  p.rr = +ratio;
  const risk = Math.max(0, p.entry - (p.stop || 0));
  p.tgt = +(p.entry + risk * p.rr).toFixed(2);

  render();

function updateProfitShield(p){
  const risk=Math.max(.01,p.entry-Number(p.initialStop||p.stop)),r=(p.live-p.entry)/risk;
  p.highWater=Math.max(Number(p.highWater||p.entry),p.live);p.lowWater=Math.min(Number(p.lowWater||p.entry),p.live);p.mfe=(p.highWater-p.entry)*100*p.qty;p.mae=(p.lowWater-p.entry)*100*p.qty;
  let sl=Number(p.stop),stage=p.profitStage||0,why='';
  if(r>=.6&&stage<1){sl=Math.max(sl,p.entry+risk*.10);stage=1;why='Profit Shield 1: +0.10R locked';}
  if(r>=1&&stage<2){sl=Math.max(sl,p.entry+risk*.40);stage=2;why='Profit Shield 2: +0.40R locked';}
  if(r>=1.5){const trail=p.highWater-Math.max(risk*.30,(p.highWater-p.entry)*.35);sl=Math.max(sl,trail,p.entry+risk*.80);if(stage<3){stage=3;why='High-water trail activated';}}
  if(sl>p.stop){p.stop=+sl.toFixed(2);p.profitStage=stage;(p.timeline??=[]).push({at:Date.now(),type:'PROFIT_SHIELD',price:p.live,newStop:p.stop,reason:why});}
}

function classifyFailure(p){
  const e=p.entrySnapshot||{},loss=Number(p.realizedPL)<0,move=e.entry?((Number(p.exitPrice||p.live)-e.entry)/e.entry*100):0,reasons=[];
  if(!loss)return {primary:'Profitable outcome',factors:['Target/exit produced positive net P&L'],confidence:'medium'};
  if(String(p.closeReason||'').includes('Stop loss'))reasons.push('Stop loss reached');
  if(e.spreadPct!=null && Number(e.spreadPct)>10)reasons.push('Wide entry spread');
  if(e.theta!=null && e.mid!=null && Math.abs(Number(e.theta))/(Number(e.mid)||1)>.15)reasons.push('High theta burden');
  if(e.volume==null || e.oi==null) {
    reasons.push('Telemetry missing at entry (legacy/unverified liquidity)');
  } else {

    if(Number(e.oi)<300)reasons.push('Limited open interest');
  }
  if(e.earningsDays!=null&&Number(e.earningsDays)<2)reasons.push('Event proximity');
  if(move<-20)reasons.push('Large premium reversal');
  const primary=reasons[0]||'Price moved against the setup after entry';
  const completeness=['underlying','spreadPct','theta','volume','oi'].filter(k=>e[k]!=null).length;
  return {primary,factors:reasons.slice(1).length?reasons.slice(1):['No single technical cause is proven by stored evidence'],confidence:completeness>=4?'medium':'low'};
}

  const append = (p, closed) => {

    `PRICES: Entry ${money(p.entry)} | ${closed?'Exit '+money(p.exitPrice):'Live '+money(p.live)} | Stop ${money(p.stop)}${p.initialStop && p.initialStop !== p.stop ? ' (Initial ' + money(p.initialStop) + ')' : ''} | Target ${money(p.tgt)}`,
    `POSITION: ${p.qty||0} contract(s) | R:R 1:${n(p.rr||0,2)} | Fees ${money(fees)}`,
    `RESULT: ${pl>=0?'+':''}${money(pl)} (${pct>=0?'+':''}${n(pct,2)}%) | Close reason ${p.closeReason||'Not closed'}`
  ];
  const asksDate=/date|time|when|opened|closed|entry.*exit|exit.*entry/.test(text);
  const asksAll=/all detail|all information|full detail|everything|complete|show all/.test(text);
  const asksPrice=/price|entry price|exit price|stop|target|risk|reward|r:r/.test(text);
  const asksGreek=/delta|theta|iv|implied|greek/.test(text);
  const asksLiquidity=/liquid|spread|volume|open interest|\boi\b/.test(text);
  const asksWhy=/why|loss|happen|mistake|failed|stop loss hit/.test(text);
  const asksEntry=/entry|early|timing/.test(text);
  const asksStrike=/strike|appropriate|selection/.test(text);
  const asksCompare=/similar|compare|history|comparable/.test(text);
  const asksLogic=/improve|logic|change|quarantine|shadow/.test(text);
  const lines=[];
  if(asksDate){
    lines.push(`ENTRY AND EXIT DATES FOR ${lbl(p)}`);
    lines.push(`Entry date/time: ${when(p.openedAt||p.id)}`);
    lines.push(`Exit date/time: ${closed?when(p.closedAt):'Position is still open; no exit date exists.'}`);
    lines.push(`Option expiry: ${expiry}`);
    lines.push(`Holding period: ${closed&&p.closedAt&&(p.openedAt||p.id)?formatDuration(Number(p.closedAt)-Number(p.openedAt||p.id)):'Not available until the position closes.'}`);
    lines.push(`Entry source: ${p.entrySource||'Not captured'} | Exit reason: ${p.closeReason||'Not closed'}`);
    return lines.join('\n');
  }
  if(asksAll){
    lines.push(...overview());
    lines.push(`ENTRY EVIDENCE: underlying ${money(e.underlying)} | bid/ask ${money(e.bid)} / ${money(e.ask)} | midpoint ${money(e.mid)} | spread ${e.spreadPct!=null?n(e.spreadPct,1)+'%':'Not captured'}`);
    lines.push(`GREEKS AND VOLATILITY: delta ${n(e.delta,3)} | theta ${n(e.theta,4)} | IV ${e.iv!=null?n(e.iv*100,1)+'%':'Not captured'} | historical volatility ${e.hv!=null?n(e.hv*100,1)+'%':'Not captured'}`);
    lines.push(`LIQUIDITY: volume ${e.volume??'Not captured'} | open interest ${e.oi??'Not captured'} | DTE ${n(e.dte,2)}`);
    lines.push(`SIGNAL: score ${e.score??p.score??'Not captured'} | tier ${e.tier??p.tier??'Not captured'} | directional bias ${e.bias??'Not captured'} | RSI ${e.rsi!=null?n(e.rsi,1):'Not captured'} | EMA20 ${e.ema20!=null?n(e.ema20,2):'Not captured'} | EMA50 ${e.ema50!=null?n(e.ema50,2):'Not captured'} | market change ${e.marketChangePct!=null?n(e.marketChangePct,2)+'%':'Not captured'} | fundamental input ${e.fundamental??'Not captured'}`);
    lines.push(`FAILURE REVIEW: ${x.failure.primary}. Factors: ${x.failure.factors.join('; ')}. Confidence ${x.failure.confidence.toUpperCase()}.`);
    lines.push(`COMPARABLE TRADES: ${x.c.length}, wins ${x.wins.length}, observed win rate ${n(x.rate,1)}%.`);
    return lines.join('\n');
  }
  if(/event|market move|news|earnings/.test(text))return `${humanTradeIntro(p)}

The saved entry snapshot shows earnings proximity of ${e.earningsDays!=null?n(e.earningsDays,1)+' days':'not recorded'}, an underlying market change of ${e.marketChangePct!=null?n(e.marketChangePct,2)+'%':'not recorded'}, directional bias of ${e.bias??'not recorded'}, and RSI of ${e.rsi!=null?n(e.rsi,1):'not recorded'}.

${e.earningsDays==null&&e.marketChangePct==null?'There is not enough saved event or market context to say that an outside event caused this loss.':'These values provide context, but they do not prove that a specific event caused the loss.'}`;
  if(/stop.*tight|tight.*stop/.test(text)){const distance=Number(p.entry)-Number(p.stop),distPct=p.entry?distance/p.entry*100:0;return `${humanTradeIntro(p)}

The stop was $${Number(p.stop).toFixed(2)}, which was $${distance.toFixed(2)} or ${distPct.toFixed(1)}% below the $${Number(p.entry).toFixed(2)} entry. The planned risk was ${money(risk)} and the planned reward was ${money(reward)}.

I cannot call the stop too tight from one trade alone. The better test is to compare maximum adverse movement across at least 8 similar trades. If several valid setups recover after touching this same stop distance, test a wider stop in shadow mode. Do not change the paper-trading stop from this single outcome.`;}
  if(asksPrice){lines.push(...overview().slice(3));lines.push(`Planned risk ${money(risk)} | planned reward ${money(reward)}.`);return lines.join('\n');}
  if(asksGreek){lines.push(`GREEKS FOR ${lbl(p)} AT ENTRY`);lines.push(`Delta: ${n(e.delta,3)} | Theta/day: ${n(e.theta,4)} | Implied volatility: ${e.iv!=null?n(e.iv*100,1)+'%':'Not captured'} | Historical volatility: ${e.hv!=null?n(e.hv*100,1)+'%':'Not captured'}.`);lines.push(e.capturedAt?`Snapshot captured ${when(e.capturedAt)}.`:'These fields were not captured for older trades.');return lines.join('\n');}
  if(asksLiquidity){lines.push(`LIQUIDITY REVIEW FOR ${lbl(p)}`);lines.push(`Bid/ask: ${money(e.bid)} / ${money(e.ask)} | Spread: ${e.spreadPct!=null?n(e.spreadPct,1)+'%':'Not captured'} | Volume: ${e.volume??'Not captured'} | Open interest: ${e.oi??'Not captured'}.`);lines.push(Number(e.spreadPct)>12?'The stored spread was wide and may have increased execution loss.':'The stored evidence does not prove that spread alone caused the outcome.');return lines.join('\n');}
  lines.push(...overview().slice(0,2));
  if(asksWhy)return `${humanTradeIntro(p)}

The strongest recorded explanation is ${String(x.failure.primary).toLowerCase()}. ${x.failure.factors?.length?`Other relevant evidence includes ${x.failure.factors.join(', ').toLowerCase()}.`:''}

This is a ${x.failure.confidence}-confidence interpretation of the saved evidence, not proof that one factor alone caused the loss.`;
  if(asksEntry)lines.push(e.capturedAt?`ENTRY SNAPSHOT: ${when(e.capturedAt)} | score ${e.score??'--'} | spread ${n(e.spreadPct,1)}% | delta ${n(e.delta,2)} | theta ${n(e.theta,3)} | volume ${e.volume??'--'} | OI ${e.oi??'--'}.`:'The original entry snapshot is incomplete for this older trade. The recorded entry time is still shown above.');
  if(asksStrike)lines.push(`STRIKE REVIEW: ${p.k} ${p.call?'CALL':'PUT'} | entry ${money(p.entry)} | delta ${n(e.delta,2)} | spread ${e.spreadPct!=null?n(e.spreadPct,1)+'%':'Not captured'} | DTE ${n(e.dte,2)}.`);
  if(/what evidence|evidence.*missing|missing evidence|not captured/.test(text)){const z=evidenceCompleteness(p),missing=z.missing.map(friendlyFieldName);return `${humanTradeIntro(p)}

For this trade, ${z.present} of ${z.total} core entry fields are available (${z.pct}%). ${missing.length?`The missing fields are ${missing.join(', ')}.`:'The core entry snapshot is complete.'}

Those fields matter for different reasons: underlying price and directional indicators help determine whether the market signal failed; bid, ask and spread show execution quality; delta, theta and IV separate direction, time decay and volatility effects; volume and open interest show liquidity; and DTE measures expiry pressure.

New trades opened with this dashboard capture these fields automatically. Older trades cannot be reconstructed reliably after the fact.`;}
  if(asksCompare){const sample=x.c.length,rate=n(x.rate,1);return `${humanTradeIntro(p)}

I found ${sample} completed trade${sample===1?'':'s'} with the same pattern: ${p.sym}, ${p.m||'intraday'}, ${p.tier||'unclassified'}, ${p.call?'CALL':'PUT'}. ${x.wins.length} ${x.wins.length===1?'was':'were'} profitable, so the observed win rate is ${rate}%.

${sample<8?'This is a warning signal, but the sample is still too small to justify changing Auto-Picks. I would keep collecting evidence and test any proposed restriction in shadow mode.':x.rate<40?'The repeated weakness is sufficient for a shadow-mode test, but not an automatic production change.':'The comparable evidence does not currently support restricting this setup.'}`;}
  if(asksLogic){const sample=x.c.length,rate=n(x.rate,1);return `${humanTradeIntro(p)}

My recommendation is to leave the Auto-Picks logic unchanged for now. I found ${sample} comparable completed trade${sample===1?'':'s'}, with ${x.wins.length} win${x.wins.length===1?'':'s'} and an observed win rate of ${rate}%.

${sample<8?'That sample is too small to tell whether the rule is genuinely weak or whether this is simply a short losing streak. I would collect at least 8 comparable trades before proposing even a shadow filter.':'There is enough history to review the pattern in shadow mode, but not to rewrite Auto-Picks automatically.'}

This recommendation does not change Auto-Picks, the paper-trading stop, or the target.`;}
  if(lines.length===2){lines.push('Please ask a trade-related question. Supported topics: dates, prices, stop/target, Greeks, liquidity, loss evidence, comparable trades, missing evidence, and Auto-Picks logic.');}
  return lines.join('\n');
}
function formatDuration(ms){if(!Number.isFinite(ms)||ms<0)return 'Not captured';const m=Math.floor(ms/60000),d=Math.floor(m/1440),h=Math.floor((m%1440)/60),min=m%60;return [d?d+'d':'',h?h+'h':'',min+'m'].filter(Boolean).join(' ');}

function renderAnalystChat(){
  const p=findAnalystTrade(analystTradeId),body=document.getElementById('agentChatBody');if(!p||!body)return;
  const x=analystEvidence(p),msgs=(cfg.analyst.messages||[]).filter(m=>String(m.tradeId)===String(p.id)).slice(-12),lastAnswer=[...msgs].reverse().find(m=>m.role==='bot');
  body.innerHTML=`<div class="agent-context"><b>${lbl(p)}</b><div class="evidence-row"><span>Status</span><span>${p.closedAt?'Closed '+fmtTs(p.closedAt):'Open'}</span></div><div class="evidence-row"><span>Entry → ${p.closedAt?'Exit':'Live'}</span><span>$${Number(p.entry).toFixed(2)} → $${Number(p.closedAt?p.exitPrice:p.live).toFixed(2)}</span></div><div class="evidence-row"><span>Failure class</span><span>${x.failure.primary}</span></div><div class="evidence-row"><span>Comparable trades</span><span>${x.c.length} · ${x.rate.toFixed(1)}% wins</span></div><div class="evidence-row"><span>Confidence</span><span class="confidence ${x.failure.confidence}">${x.failure.confidence.toUpperCase()}</span></div><div class="evidence-row"><span>Entry evidence</span><span>${(()=>{const z=evidenceCompleteness(p);return `${z.present}/${z.total} fields (${z.pct}%)`})()}</span></div></div><div class="agent-messages">${msgs.map(m=>`<div class="agent-msg ${m.role}">${escapeHtml(m.localText||m.text||'')}</div>`).join('')}</div>${lastAnswer?`<div class="agent-answer-actions"><div class="label">Copy the local explanation or continue in an outside chatbot:</div><button type="button" class="btn sm" onclick="copyLatestExplanation()">⧉ Copy Answer</button><button type="button" class="btn sm ai-launch" onclick="openOutsideAgent('chatgpt')"><span class="ai-logo chatgpt">C</span>ChatGPT</button><button type="button" class="btn sm ai-launch" onclick="openOutsideAgent('claude')"><span class="ai-logo claude">A</span>Claude</button><button type="button" class="btn sm ai-launch" onclick="openOutsideAgent('gemini')"><span class="ai-logo gemini">G</span>Gemini</button></div>`:''}${renderShadowProposal(p,x)}`;

function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function resolveTradeFromQuestion(q){
  const text=String(q||'').toUpperCase(),all=[...(cfg.pos||[]),...(cfg.closed||[])];
  const symbol=(text.match(/\b[A-Z]{1,6}\b/)||[])[0];
  const strikeMatch=text.match(/\b(\d+(?:\.\d+)?)\s*([PC])\b/),strike=strikeMatch?Number(strikeMatch[1]):null,type=strikeMatch?strikeMatch[2]:null;
  const dates=[...text.matchAll(/\b(\d{1,2})[-\/](\d{1,2})\b/g)].map(m=>({m:+m[1],d:+m[2]}));
  const candidates=all.filter(p=>(!symbol||String(p.sym).toUpperCase()===symbol)&&(!strike||Number(p.k)===strike)&&(!type||(p.call?'C':'P')===type)&&(!dates.length||dates.some(x=>{const d=new Date(Number(p.exp)*1000);return d.getUTCMonth()+1===x.m&&d.getUTCDate()===x.d;})));
  return candidates.sort((a,b)=>Number(b.closedAt||b.openedAt||b.id)-Number(a.closedAt||a.openedAt||a.id))[0]||null;
}

function analystPrompt(p,question){const x=analystEvidence(p),e=x.e||{},snapshot={contract:p.code,symbol:p.sym,strike:p.k,type:p.call?'CALL':'PUT',status:p.closedAt?'closed':'open',entry:p.entry,currentOrExit:p.closedAt?p.exitPrice:p.live,netPnl:p.closedAt?p.realizedPL:((p.live-p.entry)*100*p.qty-2*cfg.fee*p.qty),closeReason:p.closeReason||'',localFailure:x.failure,entrySnapshot:e,comparableTrades:x.c.length,comparableWins:x.wins.length,comparableWinRate:x.rate,timeline:(p.timeline||[]).slice(-20)};return `USER QUESTION:
${question}

LOCAL DASHBOARD EVIDENCE (JSON):
${JSON.stringify(snapshot)}

Rules: do not invent missing fields; distinguish local facts from inference; use external context only to explain general market/option mechanics or current event context; do not give a buy/sell instruction; do not propose changing Auto-Picks unless repeated comparable evidence and shadow tests support it.`;}
function askAnalyst(q){let p=findAnalystTrade(analystTradeId);const question=String(q||'').trim();if(!question){setAnalystStatus('Enter or choose a question first.',true);return;}if(!p){p=resolveTradeFromQuestion(question);if(p)analystTradeId=p.id;}if(!p){setAnalystStatus('No matching paper trade found. Select Ask Agent on its row, or include symbol, expiry and strike.',true);return;}const answer=analystAnswer(p,question);cfg.analyst.messages.push({at:Date.now(),tradeId:p.id,role:'user',text:question});cfg.analyst.messages.push({at:Date.now(),tradeId:p.id,role:'bot',text:answer,localText:answer,localAt:new Date().toISOString()});cfg.analyst.messages=cfg.analyst.messages.slice(-200);save();renderAnalystChat();setAnalystStatus('Answered from stored paper-trade evidence.');}
function chooseDiagnostic(q){const i=document.getElementById('agentQuestion');if(!i){setAnalystStatus('Ask box is unavailable. Close and reopen the Agent.',true);return;}const value=String(q||'').trim();i.value=value;i.defaultValue=value;i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}));i.focus();if(typeof i.setSelectionRange==='function')i.setSelectionRange(value.length,value.length);setAnalystStatus('Question loaded in the Ask box. Click Ask to see the evidence-based answer.',false);}
async function copyLatestExplanation(){const p=findAnalystTrade(analystTradeId);if(!p){setAnalystStatus('Select a trade first.',true);return;}const m=[...(cfg.analyst.messages||[])].reverse().find(x=>String(x.tradeId)===String(p.id)&&x.role==='bot'),text=String(m?.localText||m?.text||'').trim();if(!text){setAnalystStatus('Click Ask first to create an explanation.',true);return;}let copied=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);copied=true;}}catch(e){}if(!copied){const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.select();try{copied=document.execCommand('copy');}catch(e){}ta.remove();}if(copied)setAnalystStatus('Explanation copied. Paste it into ChatGPT, Claude, or Gemini.');else{window.prompt('Copy the explanation below:',text);setAnalystStatus('Use Ctrl+C in the copy window, then paste into the chatbot.');}}

async function openOutsideAgent(kind){let p=findAnalystTrade(analystTradeId);const i=document.getElementById('agentQuestion'),q=String(i?.value||'').trim();if(!p&&q){p=resolveTradeFromQuestion(q);if(p)analystTradeId=p.id;}if(!p){setAnalystStatus('Select Ask Agent on a trade row first.',true);return;}const lastUser=[...(cfg.analyst.messages||[])].reverse().find(x=>String(x.tradeId)===String(p.id)&&x.role==='user');const question=q||lastUser?.text||'Why did this trade lose?';const prompt=externalPrompt(p,question);try{await navigator.clipboard.writeText(prompt);setAnalystStatus('Evidence prompt copied. Paste it into '+kind+'.');}catch(e){window.prompt('Copy this evidence prompt, then paste it into '+kind+':',prompt);setAnalystStatus('Copy the displayed prompt and paste it into '+kind+'.');}const urls={chatgpt:'https://chatgpt.com/',claude:'https://claude.com/',gemini:'https://gemini.google.com/'};window.open(urls[kind],'_blank','noopener,noreferrer');}

function renderShadowProposal(p,x){if(x.c.length<8||x.rate>=40)return `<div class="safe-note">No logic change proposed. A minimum of 8 comparable outcomes with weak results is required even for shadow mode.</div>`;let pr=cfg.analyst.proposals.find(z=>z.pattern===agentKey(p));if(!pr){pr={id:Date.now(),pattern:agentKey(p),createdAt:Date.now(),status:'candidate',basis:x.c.length,winRate:x.rate,observations:0,avoidedLosses:0,missedWins:0};cfg.analyst.proposals.push(pr);save();}return `<div class="proposal"><b>Shadow-mode candidate</b><p class="mu">Pattern ${pr.pattern} · basis ${pr.basis} trades · ${pr.winRate.toFixed(1)}% wins.</p><p>Shadow testing records what would happen if future matching entries were skipped. It does not change Auto-Picks.</p>${pr.status==='candidate'?`<button class="btn sm" onclick="startShadow(${pr.id})">Start Shadow Test</button>`:`<span class="shadow-tag">SHADOW ACTIVE</span> ${pr.observations||0} observations · ${pr.avoidedLosses||0} losses avoided · ${pr.missedWins||0} wins missed`}${pr.status==='shadow'&&pr.observations>=10&&pr.avoidedLosses>pr.missedWins*2?`<button class="btn sm danger" onclick="approveRule(${pr.id})">Approve Guard Rule</button>`:''}</div>`;}

function localDayKey(ts=Date.now()){const d=new Date(ts),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;}
function todaysClosedLosses(){const k=localDayKey();return (cfg.closed||[]).filter(p=>localDayKey(p.closedAt||0)===k&&Number(p.realizedPL)<0);}
function dailyLocalReview(losses){
  if(!losses.length)return 'No closed losing paper trades were recorded today.';
  const counts={},patterns={};let pnl=0;losses.forEach(p=>{const f=p.failure||classifyFailure(p),r=f.primary||'Unclassified';counts[r]=(counts[r]||0)+1;const k=agentKey(p);patterns[k]=(patterns[k]||0)+1;pnl+=Number(p.realizedPL)||0;});
  const top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0],repeat=Object.entries(patterns).sort((a,b)=>b[1]-a[1])[0];
  return `TODAY'S LOCAL LOSS REVIEW
Closed losses: ${losses.length}
Combined realized P&L: $${pnl.toFixed(2)}
Most frequent classification: ${top?top[0]+' ('+top[1]+')':'--'}
Most repeated pattern: ${repeat?repeat[0]+' ('+repeat[1]+')':'--'}

Trade details:
${losses.map(p=>{const f=p.failure||classifyFailure(p),e=p.entrySnapshot||{};return `• ${lbl(p)} | P&L $${Number(p.realizedPL).toFixed(2)} | ${f.primary} | spread ${e.spreadPct!=null?Number(e.spreadPct).toFixed(1)+'%':'missing'} | delta ${e.delta!=null?Number(e.delta).toFixed(2):'missing'} | theta ${e.theta!=null?Number(e.theta).toFixed(3):'missing'} | vol/OI ${e.volume??'missing'}/${e.oi??'missing'}`}).join('\n')}

Decision: Keep Auto-Picks unchanged today unless repeated comparable evidence and shadow results support a proposal.`;
}

${JSON.stringify(losses.map(p=>({symbol:p.sym,contract:p.code,strike:p.k,type:p.call?'CALL':'PUT',entry:p.entry,exit:p.exitPrice,pnl:p.realizedPL,reason:p.closeReason,failure:p.failure,entrySnapshot:p.entrySnapshot,timeline:(p.timeline||[]).slice(-15)})))}`;}

function updatePaperLiveDOM() {
  if (tab !== 'paper') return;
  let activeTot = 0, closedTot = 0, totalFees = 0, activeCapital = 0, closedCapital = 0, openWinners = 0;
  cfg.pos.forEach((p, i) => {
    const fee = 2 * cfg.fee * p.qty;
    const pl = (p.live - p.entry) * 100 * p.qty - fee;
    const capital = p.entry * 100 * p.qty;
    const plPct = capital > 0 ? pl / capital * 100 : 0;
    activeTot += pl;
    activeCapital += capital;
    totalFees += fee;
    if (pl >= 0) openWinners++;

    const row = document.querySelector(`.paper-open-row[data-code="${p.code}"]`) || document.querySelectorAll('.paper-open-row')[i];
    if (row) {
      row.dataset.live = p.live;
      row.dataset.profit = pl;
      row.dataset.pnl = pl >= 0 ? 'profit' : 'loss';
      const liveVal = row.querySelector('.paper-live-val');
      if (liveVal) liveVal.textContent = p.live.toFixed(2);
      const liveSrc = row.querySelector('.paper-live-src');
      if (liveSrc) liveSrc.textContent = p.src ? `[${p.src}]` : '';
      const pnlCell = row.querySelector('.paper-pnl-cell');
      if (pnlCell) {
        pnlCell.className = `mono ${pl >= 0 ? 'g' : 'r'} font-weight-bold paper-pnl-cell`;
        pnlCell.innerHTML = `${pl >= 0 ? '+' : ''}${pl.toFixed(2)} <span style="font-size:11px;">(${plPct >= 0 ? '+' : ''}${plPct.toFixed(2)}%)</span>`;
      }
      const stopInp = row.querySelector('input[title="Stop Loss"]');
      if (stopInp && document.activeElement !== stopInp && p.stop) {
        stopInp.value = Number(p.stop).toFixed(2);
      }
    }
  });
  (cfg.closed || []).forEach(p => {
    const fee = p.feeTotal != null ? p.feeTotal : (2 * cfg.fee * p.qty);
    closedTot += Number(p.realizedPL || 0);
    closedCapital += p.entry * 100 * p.qty;
    totalFees += fee;
  });
  const grandTot = activeTot + closedTot;
  const totalCapital = activeCapital + closedCapital;
  const grandPct = totalCapital > 0 ? grandTot / totalCapital * 100 : 0;
  const activePct = activeCapital > 0 ? activeTot / activeCapital * 100 : 0;
  const kComb = document.getElementById('kpiCombined');
  if (kComb) {
    kComb.className = `kpi-val ${grandTot >= 0 ? 'g' : 'r'}`;
    kComb.innerHTML = `${grandTot >= 0 ? '+' : ''}$${grandTot.toFixed(2)} <span style="font-size:14px;">(${grandPct >= 0 ? '+' : ''}${grandPct.toFixed(2)}%)</span>`;
  }
  const kAct = document.getElementById('kpiActive');
  if (kAct) {
    kAct.className = `kpi-val ${activeTot >= 0 ? 'g' : 'r'}`;
    kAct.innerHTML = `${activeTot >= 0 ? '+' : ''}$${activeTot.toFixed(2)} <span style="font-size:14px;">(${activePct >= 0 ? '+' : ''}${activePct.toFixed(2)}%)</span>`;
  }
  const kWin = document.getElementById('kpiOpenWin');
  if (kWin) kWin.innerHTML = `${openWinners} <span class="mu" style="font-size:12px">of ${cfg.pos.length}</span>`;
}

function updatePicksLiveDOM() {
  if (tab !== 'picks') return;
  picks.forEach(p => {
    const row = document.querySelector(`.pick-row[data-code="${p.code}"]`);
    if (!row) return;
    const livePx = Number(p.live) > 0 ? Number(p.live) : Number(p.mid);
    const valEl = row.querySelector('.pick-live-val');
    if (valEl) valEl.textContent = livePx.toFixed(2);
    const srcEl = row.querySelector('.pick-src');
    if (srcEl) srcEl.textContent = p.src || 'Yahoo';
    const baEl = row.querySelector('.pick-ba-cell');
    if (baEl) baEl.textContent = `${p.bid.toFixed(2)} / ${p.ask.toFixed(2)}`;
    const planEl = row.querySelector('.pick-plan-cell');
    if (planEl) planEl.innerHTML = `<span class="r">${p.stop.toFixed(2)}</span> → <span class="g">${p.tgt.toFixed(2)}</span>`;
  });
}

let quoteRefreshBusy=false;
async function refresh() {
  const hasPicks = tab === 'picks' && picks.length > 0;
  if (quoteRefreshBusy || (!cfg.pos.length && !(cfg.livePos && cfg.livePos.length) && !hasPicks) || document.hidden) return;
  quoteRefreshBusy=true;
  try {
  if (hasPicks) {
    const changed = await syncPicksLivePrices();
    if (changed && tab === 'picks') updatePicksLiveDOM();
  }
  const g = {};
  cfg.pos.forEach(p => {
    if (!p.exp || !p.sym) {
      const c = parseContractInput(p.code);
      if (c) { p.sym = p.sym || c.root; p.exp = p.exp || c.expMidTs; p.code = c.occ; }
    }

function lsFitQty(entry, budget, maxRisk, stopPct) {
  const costPerContract = entry * 100 + cfg.fee;
  const riskPerContract = entry * 100 * (stopPct / 100) + (2 * cfg.fee);
  return Math.max(1, Math.min(Math.floor(budget / costPerContract), Math.floor(maxRisk / riskPerContract)));
}

function lsMetrics(d) {
  const { entry, qty, budget, stopPct, tgtPct, trailPct, limitBufPct } = d;
  const maxRisk = d.maxRisk || 0;
  const capital = entry * 100 * qty;
  const roundtripFee = 2 * cfg.fee * qty;
  const totalOutlay = capital + (cfg.fee * qty);
  const slTrigger = +(entry * (1 - stopPct / 100)).toFixed(2);
  const slLimit = +(slTrigger * (1 - limitBufPct / 100)).toFixed(2);
  const tpLimit = +(entry * (1 + tgtPct / 100)).toFixed(2);
  const trailDrop = +(entry * (trailPct / 100)).toFixed(2);
  const trailFloorInit = +(entry - trailDrop).toFixed(2);
  const breakevenPx = +(entry + (roundtripFee / (100 * qty))).toFixed(2);
  const netProfitAtTp = (tpLimit - entry) * 100 * qty - roundtripFee;
  const netProfitPct = capital > 0 ? (netProfitAtTp / capital) * 100 : 0;
  const netLossAtSl = (slTrigger - entry) * 100 * qty - roundtripFee;
  const netLossPct = capital > 0 ? (netLossAtSl / capital) * 100 : 0;
  const worstLoss = (slLimit - entry) * 100 * qty - roundtripFee; // if the stop-limit fills at its limit price
  const rr = Math.abs(netLossAtSl) > 0 ? Math.abs(netProfitAtTp / netLossAtSl) : 0;
  const prof = LS_PROFILES[d.profile] || {};
  const minRR = prof.minNetRR || 0;
  const riskPctOfBudget = budget > 0 ? Math.abs(netLossAtSl) / budget * 100 : 0;
  const occ = parseOccMeta(d.code);
  const warnings = [];
  if (totalOutlay > budget) warnings.push(`Position cost $${totalOutlay.toFixed(2)} exceeds your $${budget.toFixed(0)} budget.`);
  if (maxRisk > 0 && Math.abs(netLossAtSl) > maxRisk) warnings.push(`Loss at stop is $${Math.abs(netLossAtSl).toFixed(2)}, above your $${maxRisk.toFixed(0)} max risk per trade. Use a cheaper premium, tighter stop, or fewer contracts.`);
  if (minRR && rr < minRR - 0.05) warnings.push(`Net R:R 1:${rr.toFixed(2)} is below the ${d.profile} minimum of 1:${minRR.toFixed(1)}. Raise the target or lower the stop %.`);
  if (budget > 0 && capital / budget > 0.4 && d.profile !== 'advanced') warnings.push(`This one position uses ${(capital / budget * 100).toFixed(0)}% of your budget. Keep a single trade at or below ~40%.`);
  if (occ && d.profile !== 'advanced' && occ.dte < 2) warnings.push(`Only ${occ.dte.toFixed(1)} day(s) to expiry. Theta can eat 40-60% of the premium per day, so prefer 7-30 DTE.`);
  return { capital, roundtripFee, totalOutlay, slTrigger, slLimit, tpLimit, trailDrop, trailFloorInit, breakevenPx,
    netProfitAtTp, netProfitPct, netLossAtSl, netLossPct, worstLoss, rr, minRR, riskPctOfBudget, maxRisk, warnings };
}

  return out;

  const e12 = emaSeries(closes, 12);

function dl() {
