<script type="text/plain" id="bridge">
const http = require('http'), PORT = process.env.PORT || 8787, UA = { 'User-Agent': 'Mozilla/5.0' };
let cookie = '', crumb = '';
let moomoo = { key: process.env.MOOMOO_KEY || '', secret: process.env.MOOMOO_SECRET || '', host: '127.0.0.1', port: 33333 };
async function auth() {
  const r = await fetch('https://fc.yahoo.com', { headers: UA, redirect: 'manual' });
  cookie = (r.headers.getSetCookie?.() || []).map(c => c.split(';')[0]).join('; ');
  crumb = await (await fetch('https://query1.finance.yahoo.com/v1/test/getcrumb', { headers: { ...UA, cookie } })).text();
}
async function yf(path) {
  for (let i = 0; i < 2; i++) {
    if (!crumb) await auth();
    const r = await fetch('https://query2.finance.yahoo.com' + path + (path.includes('?') ? '&' : '?') + 'crumb=' + encodeURIComponent(crumb), { headers: { ...UA, cookie } });
    if (r.ok) return r.json();
    crumb = '';
  }

  if (!closes || closes.length < 26) return { macd: 0, signal: 0, hist: 0 };
  const e12 = emaSeries(closes, 12), e26 = emaSeries(closes, 26);
  const macdLine = closes.map((_, i) => e12[i] - e26[i]);
  const sigLine = emaSeries(macdLine, 9);
  const macd = macdLine.at(-1) || 0, signal = sigLine.at(-1) || 0;
  return { macd, signal, hist: macd - signal };
}

function vwapCalc(highs, lows, closes, vols) {
  if (!closes || !closes.length) return 0;
  let pv = 0, vTot = 0;
  for (let i = 0; i < closes.length; i++) {
    const c = closes[i], h = highs?.[i] ?? c, l = lows?.[i] ?? c, v = vols?.[i] ?? 0;
    if (c == null || !(v > 0)) continue;
    pv += ((h + l + c) / 3) * v;
    vTot += v;
  }
  return vTot > 0 ? pv / vTot : closes.at(-1);
}

function detectIntradayPattern(opens, highs, lows, closes) {
  const n = closes.length;
  if (n < 4) return 'Neutral Bar';
  const o = opens[n - 1], h = highs[n - 1], l = lows[n - 1], c = closes[n - 1];
  const po = opens[n - 2], ph = highs[n - 2], pl = lows[n - 2], pc = closes[n - 2];
  const body = Math.abs(c - o);
  const upperWick = h - Math.max(o, c), lowerWick = Math.min(o, c) - l;
  if (c > o && pc < po && c >= po && o <= pc) return 'Bullish Engulfing';
  if (c < o && pc > po && c <= po && o >= pc) return 'Bearish Engulfing';
  if (lowerWick > body * 2 && upperWick < body * 0.8) return 'Bullish Hammer / Pinbar';
  if (upperWick > body * 2 && lowerWick < body * 0.8) return 'Shooting Star (Rejection)';
  if (c > ph && pc > highs[n - 3]) return 'Momentum Breakout';
  if (c < pl && pc < lows[n - 3]) return 'Support Breakdown';
  return c >= o ? 'Bullish Continuation' : 'Bearish Pullback';
}

function computeIntradayTA(res) {
  const ts = res.timestamp || [], q = res.indicators?.quote?.[0] || {};
  const off = Number(res.meta?.gmtoffset), gmt = Number.isFinite(off) ? off : -14400;
  const bars = [];
  ts.forEach((t, i) => {
    const c = q.close?.[i];
    if (c == null || !Number.isFinite(c)) return;
    bars.push({ t, day: Math.floor((t + gmt) / 86400), o: q.open?.[i] ?? c, h: q.high?.[i] ?? c, l: q.low?.[i] ?? c, c, v: q.volume?.[i] ?? 0 });
  });
  if (bars.length < 6) return null;
  const last = bars.at(-1), session = bars.filter(b => b.day === last.day);
  const closes = bars.map(b => b.c), mc = macdCalc(closes);
  const vs = session.map(b => b.v || 0);
  const recentVol = vs.slice(-3).reduce((a, b) => a + b, 0) / Math.max(1, Math.min(3, vs.length));
  const baseVol = vs.slice(0, -3).reduce((a, b) => a + b, 0) / Math.max(1, vs.length - 3);
  const rvol = baseVol ? recentVol / baseVol : 1.0;

  // 14-bar 5m ATR for underlying noise estimation
  const z = bars.slice(-15);
  const atr = z.slice(1).reduce((a, b, i) => a + Math.max(b.h - b.l, Math.abs(b.h - z[i].c), Math.abs(b.l - z[i].c)), 0) / Math.max(1, z.length - 1);

  return {
    lastUnderlying: last.c,
    e5: ema(closes, 5), e9: ema(closes, 9), e10: ema(closes, 10), e20: ema(closes, 20), e21: ema(closes, 21), e50: ema(closes, 50),
    vwap: vwapCalc(session.map(b => b.h), session.map(b => b.l), session.map(b => b.c), session.map(b => b.v)),
    rsi: rsi(closes, 14),
    macd: mc.macd, macdSig: mc.signal, macdHist: mc.hist,
    pattern: detectIntradayPattern(bars.map(b => b.o), bars.map(b => b.h), bars.map(b => b.l), closes),
    barAt: last.t * 1000, sessionBars: session.length, bars: bars.slice(-60),
    rvol, atr
  };
}

// --- All-Regime Sniper Quant Regime Engine ---
function quantRegime(ta) {
  if (!ta) return { name: 'Mixed', confidence: 50, adx: 20, bbw: 0.02, pattern: 'Neutral', rvol: 1.0, vwap: 0 };
  const bars = ta.bars || [], C = bars.map(x => x.c), n = Math.min(20, C.length), w = C.slice(-n);
  const mean = w.reduce((a, b) => a + b, 0) / Math.max(1, n);
  const sd = Math.sqrt(w.reduce((a, b) => a + (b - mean) ** 2, 0) / Math.max(1, n));
  const bbw = mean ? (4 * sd) / mean : 0;

  let tr = 0, plus = 0, minus = 0;
  for (let i = Math.max(1, bars.length - 14); i < bars.length; i++) {
    const x = bars[i], z = bars[i - 1];
    const t = Math.max(x.h - x.l, Math.abs(x.h - z.c), Math.abs(x.l - z.c));
    const up = x.h - z.h, dn = z.l - x.l;
    tr += t;
    if (up > dn && up > 0) plus += up;
    if (dn > up && dn > 0) minus += dn;
  }
  const pdi = tr ? 100 * plus / tr : 0, mdi = tr ? 100 * minus / tr : 0;
  const adx = pdi + mdi ? 100 * Math.abs(pdi - mdi) / (pdi + mdi) : 0;
  const S = Number(ta.lastUnderlying || 0);
  const minAdx = Number(cfg.quantGuard.minAdx || 25);

  let name = 'Sideways';
  if (adx >= minAdx && S > ta.vwap && ta.e5 > ta.e10 && ta.e10 > ta.e20) {
    name = 'Uptrend';
  } else if (adx >= minAdx && S < ta.vwap && ta.e5 < ta.e10 && ta.e10 < ta.e20) {
    name = 'Downtrend';
  } else if (adx >= 18) {
    name = 'Mixed';
  }

  const pattern = ta.pattern || 'Neutral';
  const confidence = Math.round(Math.min(100, adx * 1.5 + (Number(ta.rvol || 0) >= 1.5 ? 20 : 0) + (name === 'Uptrend' || name === 'Downtrend' ? 20 : 10)));
  return { name, confidence, adx, bbw, pattern, rvol: Number(ta.rvol || 0), vwap: ta.vwap };
}

let marketRegimeNow = { name: 'All-Regime Ready', confidence: 0, basis: 'SPY/QQQ/IWM', updatedAt: 0, counts: {} };
function updateMarketRegimeFromPicks(rows) {
  const latest = {};
  (rows || []).forEach(p => { if (p.quantRegime) latest[p.sym] = p.quantRegime; });
  const bench = ['SPY','QQQ','IWM'].map(x => latest[x]).filter(Boolean);

  marketRegimeNow = {

    confidence: src.length ? Math.round(top[1] / src.length * 100) : 0,
    basis: bench.length ? 'SPY/QQQ/IWM' : 'Universe',
    updatedAt: Date.now(),
    counts
  };
}
function regimeClass(n) {
  return n === 'Uptrend' ? 'regime-up' : n === 'Downtrend' ? 'regime-down' : n === 'Sideways' ? 'regime-sideways' : 'regime-mixed';
}

// --- Sniper 80%+ Local Profitable Filter ---
function evaluateLocalProfitableFilter(geminiPayload) {
  const c = geminiPayload?.contract || {}, m = geminiPayload?.moomoo_options_data || {};
  const ta = geminiPayload?.intraday_ta_5m || {}, gf = cfg.geminiFilter || {};

  const isCall = c.type === 'CALL';
  const spot = Number(c.underlyingPrice || ta.ema5 || 0);
  const absDelta = Math.abs(Number(m.delta || 0));
  const spreadPct = Number(m.spreadPct || 0);
  const oi = Number(m.openInterest || 0);
  const ivPct = Number(m.impliedVolatility || 0) * 100;
  const rvol = Number(ta.rvol || 1.5);
  const macdHist = Number(ta.macdHist || 0);
  const regime = c.regime || 'Mixed';

  if (spreadPct > (cfg.quantGuard.strictSpreadPct || 5.0)) {
    return { approved: false, source: 'Sniper Quant', score: 0, reasoning: `Rejected: Spread ${spreadPct.toFixed(1)}% exceeds ${cfg.quantGuard.strictSpreadPct || 5.0}% limit.` };
  }
  if (absDelta < 0.42 || absDelta > 0.68) {
    return { approved: false, source: 'Sniper Quant', score: 0, reasoning: `Rejected: Delta ${absDelta.toFixed(2)} outside 0.42-0.68 sweet spot.` };
  }
  if (oi < (gf.minOI || 500)) {
    return { approved: false, source: 'Sniper Quant', score: 0, reasoning: `Rejected: OI ${oi} below ${gf.minOI || 500}.` };
  }
  if (ivPct > (gf.maxIVPct || 90)) {
    return { approved: false, source: 'Sniper Quant', score: 0, reasoning: `Rejected: IV ${ivPct.toFixed(0)}% exceeds ${gf.maxIVPct || 90}% cap.` };
  }

  let score = 50;
  const reasons = [];
  const vwap = Number(ta.vwap || spot);

  if (regime === 'Sideways' || regime === 'Mixed') {
    if (isCall && ta.rsi <= 46 && macdHist >= -0.02) {
      score += 25; reasons.push(`Range Support Reversal Call (RSI ${ta.rsi.toFixed(0)})`);
    } else if (!isCall && ta.rsi >= 54 && macdHist <= 0.02) {
      score += 25; reasons.push(`Range Resistance Rejection Put (RSI ${ta.rsi.toFixed(0)})`);
    } else if (isCall && spot > vwap && macdHist > 0) {
      score += 20; reasons.push('Mixed Breakout Above VWAP');
    } else if (!isCall && spot < vwap && macdHist < 0) {
      score += 20; reasons.push('Mixed Breakdown Below VWAP');
    } else {
      return { approved: false, source: 'Sniper Quant', score: 45, reasoning: `Rejected: No clean range edge or breakout in ${regime} regime.` };
    }
  } else if (isCall) {
    if (spot > vwap && ta.ema5 > ta.ema10) { score += 20; reasons.push('VWAP + EMA5>10 Bullish'); }
    else return { approved: false, source: 'Sniper Quant', score: 35, reasoning: 'Rejected: Call setup below VWAP or EMA5.' };
    if (macdHist >= 0) { score += 10; reasons.push('MACD Bullish'); }
    else return { approved: false, source: 'Sniper Quant', score: 40, reasoning: 'Rejected: Negative MACD Hist on Call.' };
    if (ta.rsi > 72) return { approved: false, source: 'Sniper Quant', score: 45, reasoning: 'Rejected: RSI Overbought (>72).' };
    score += 10;
  } else {
    if (spot < vwap && ta.ema5 < ta.ema10) { score += 20; reasons.push('VWAP + EMA5<10 Bearish'); }
    else return { approved: false, source: 'Sniper Quant', score: 35, reasoning: 'Rejected: Put setup above VWAP or EMA5.' };
    if (macdHist <= 0) { score += 10; reasons.push('MACD Bearish'); }
    else return { approved: false, source: 'Sniper Quant', score: 40, reasoning: 'Rejected: Positive MACD Hist on Put.' };
    if (ta.rsi < 28) return { approved: false, source: 'Sniper Quant', score: 45, reasoning: 'Rejected: RSI Oversold (<28).' };
    score += 10;
  }

  if (rvol >= (cfg.quantGuard.minRvol || 1.5)) {
    score += 10; reasons.push(`RVOL ${rvol.toFixed(1)}x`);
  } else if (rvol >= 1.15) {
    score += 5; reasons.push(`RVOL ${rvol.toFixed(1)}x`);
  } else {
    return { approved: false, source: 'Sniper Quant', score: 60, reasoning: `Rejected: RVOL ${rvol.toFixed(2)}x too low.` };
  }

  const minReq = Number(gf.minConfluencePct || 85);
  const approved = score >= minReq;
  return {
    approved,
    source: 'Sniper Quant',
    score,
    at: Date.now(),
    reasoning: `${approved ? 'A+ Sniper Approved' : 'Below Sniper Bar'} (${score}%): Δ${absDelta.toFixed(2)} | ${reasons.join(', ')}`
  };
}

// --- Option Chain Strike Evaluator ---
function pick(o, S, T, call, m, b, fs, H, ed, ta5m, sym) {
  const iv = o.impliedVolatility || 0, bid = o.bid || 0, ask = o.ask || 0, mid = (bid + ask) / 2;
  const lastPx = Number(o.lastPrice) || 0;
  const live = lastPx > 0 ? lastPx : mid;
  if (!(bid > 0) || !(ask > 0) || !(iv > 0)) return null;
  if ((o.openInterest || 0) < AUTO_PICK_POLICY.minOI) return null;
  if ((o.volume || 0) < AUTO_PICK_POLICY.minVolume) return null;
  if (live < AUTO_PICK_POLICY.premiumMin || live > AUTO_PICK_POLICY.premiumMax) return null;

  const sp = (ask - bid) / mid;
  if (sp > AUTO_PICK_POLICY.maxSpreadPct) return null;

  const g = greeks(S, o.strike, T, iv, call);
  const absD = Math.abs(g.d);
  if (absD < 0.42 || absD > 0.68) return null;

  const id = m === 'intraday', tg = id ? 0.50 : 0.48;
  const qr = quantRegime(ta5m);
  const directionOk = (call && qr.name === 'Uptrend') || (!call && qr.name === 'Downtrend') || (qr.name === 'Sideways' || qr.name === 'Mixed');
  const patternOk = call ? /Bullish|Breakout|Hammer|Continuation/i.test(qr.pattern) : /Bearish|Breakdown|Shooting|Pullback/i.test(qr.pattern);

  let s = 25 * cl(Math.abs(b) / 70)
        + 20 * cl(1 - Math.abs(absD - tg) / 0.25)
        + 20 * cl(1 - sp / 0.08)
        + 12 * cl((o.volume || 0) / 600)
        + 10 * cl(1.25 - iv / (H || 0.25))
        + 8 * fs
        + (directionOk ? 10 : 0)
        + (patternOk ? 6 : 0);

  s = s - (ed < (id ? 1 : 10) ? 8 : 0);
  const score = Math.round(Math.min(99, s));
  const tier = tierForScore(score);
  if (!tier) return null;

  const plan = riskPlan(live, tier, id);
  const distPct = S > 0 ? Math.abs(o.strike - S) / S * 100 : 0;

  return {
    id: o.contractSymbol, code: o.contractSymbol, k: o.strike, bid, ask, mid, live,
    src: lastPx > 0 ? 'Yahoo Live' : 'Yahoo Mid', iv, d: g.d, ga: g.ga, th: g.th, ve: g.ve,
    oi: o.openInterest || 0, v: o.volume || 0, distPct: +distPct.toFixed(2),
    isATM: distPct <= 1.5, quantRegime: qr, score, tier, earn: ed < (id ? 1 : 10),
    stop: plan.stop, tgt: plan.tgt,
    evidence: {
      underlying: S, dte: T * 365, bias: Math.round(b), fundamental: fs, hv: H,
      earningsDays: ed, spreadPct: sp * 100, delta: g.d, gamma: g.ga, theta: g.th, vega: g.ve,
      iv, oi: o.openInterest || 0, volume: o.volume || 0, bid, ask, mid, live, score, tier, mode: m
    }
  };
}

// --- All-Regime Underlying Analyzer ---
async function analyze(sym) {
  const E = encodeURIComponent(sym);
  const [ch, qt, c0, ch5m] = await Promise.all([
    api('/api/chart?symbol=' + E),
    api('/api/quote?symbols=' + E),
    api('/api/chain?symbol=' + E),
    api('/api/chart?symbol=' + E + '&range=5d&interval=5m').catch(() => null)
  ]);

  const c = ch.chart.result[0].indicators.quote[0].close.filter(x => x != null);
  const q = qt.quoteResponse.result[0] || {};
  const S = c.at(-1);
  const ta5m = ch5m?.chart?.result?.[0] ? computeIntradayTA(ch5m.chart.result[0]) : null;
  if (ta5m) taCache5m[sym] = ta5m;
  const qr = quantRegime(ta5m);

  const e20 = ema(c, 20), e50 = ema(c, 50), R = rsi(c), H = hv(c), chg = q.regularMarketChangePercent || 0;
  let b = (S > e20 ? 20 : -20) + (e20 > e50 ? 25 : -25) + (S > e50 ? 10 : -10) + (R > 55 ? 15 : R < 45 ? -15 : 0) + (chg > 0.3 ? 15 : chg < -0.3 ? -15 : 0);

  let scanDirections = [];
  if (qr.name === 'Uptrend' || b >= 25) {
    scanDirections = [{ call: true, strategyName: 'Long Call (Momentum)', biasVal: Math.max(45, Math.abs(b)) }];
  } else if (qr.name === 'Downtrend' || b <= -25) {
    scanDirections = [{ call: false, strategyName: 'Long Put (Breakdown)', biasVal: Math.max(45, Math.abs(b)) }];
  } else {
    const r5m = ta5m?.rsi ?? R;
    if (r5m <= 48) scanDirections.push({ call: true, strategyName: 'Range Support Call', biasVal: 42 });
    if (r5m >= 52) scanDirections.push({ call: false, strategyName: 'Range Resistance Put', biasVal: 42 });
    if (!scanDirections.length) scanDirections.push({ call: true, strategyName: 'Breakout Call Leg', biasVal: 40 });
  }

  const ed = q.earningsTimestamp ? (q.earningsTimestamp * 1000 - Date.now()) / 864e5 : 99;
  const dte = e => (e * 1000 + 864e5 - Date.now()) / 864e5;
  const ex = c0.optionChain.result[0].expirationDates;
  const out = [];

  for (const m of ['intraday', 'swing']) {
    const e = ex.find(e => m === 'intraday' ? dte(e) > 0 && dte(e) <= 3 : dte(e) >= 5 && dte(e) <= 14);
    if (!e) continue;
    const res = (await api(`/api/chain?symbol=${E}&date=${e}`)).optionChain.result[0];
    const op = res.options[0];
    const S2 = res.quote.regularMarketPrice || S;

    for (const dir of scanDirections) {
      const chainSide = dir.call ? op.calls : op.puts;
      const fs = 0.75;
      const qualified = chainSide
        .map(o => pick(o, S2, Math.max(dte(e), 0.05) / 365, dir.call, m, dir.biasVal, fs, H, ed, ta5m, sym))
        .filter(Boolean)
        .map(p => {
          const enriched = {
            ...p,
            sym, m, call: dir.call, exp: e, b: Math.round(dir.biasVal), R: Math.round(ta5m?.rsi ?? R),
            ta5m,
            strategyName: dir.strategyName,
            evidence: {
              ...p.evidence,
              symbol: sym, expiry: e, rsi: ta5m?.rsi ?? R,
              ema5: ta5m?.e5 ?? S2, ema10: ta5m?.e10 ?? S2, ema20: ta5m?.e20 ?? e20,
              vwap: ta5m?.vwap ?? S2, macdHist: ta5m?.macdHist ?? 0,
              pattern5m: ta5m?.pattern ?? 'Neutral', optionType: dir.call ? 'CALL' : 'PUT'
            }
          };
          enriched.gemini = evaluateLocalProfitableFilter(buildGeminiPayload(enriched));
          cfg.geminiDecisions[p.code] = enriched.gemini;
          return enriched;
        });
      out.push(...qualified);
    }

    // Long Straddle candidate when regime is Mixed/Sideways
    if ((qr.name === 'Sideways' || qr.name === 'Mixed') && m === 'intraday') {
      const atmCall = [...(op.calls || [])].sort((a, b) => Math.abs(a.strike - S2) - Math.abs(b.strike - S2))[0];
      const atmPut = [...(op.puts || [])].sort((a, b) => Math.abs(a.strike - S2) - Math.abs(b.strike - S2))[0];
      if (atmCall && atmPut && atmCall.bid > 0 && atmCall.ask > 0 && atmPut.bid > 0 && atmPut.ask > 0) {
        const cMid = (atmCall.bid + atmCall.ask) / 2;
        const pMid = (atmPut.bid + atmPut.ask) / 2;
        const comboLive = +(cMid + pMid).toFixed(2);
        const comboSp = ((atmCall.ask - atmCall.bid) + (atmPut.ask - atmPut.bid)) / comboLive;
        if (comboLive >= 0.80 && comboLive <= 8.00 && comboSp <= 0.08 && (atmCall.openInterest || 0) >= 300 && (atmPut.openInterest || 0) >= 300) {
          const plan = riskPlan(comboLive, 'Strict', true);
          strategyPicks.push({
            id: `STRAD-${atmCall.contractSymbol}-${atmPut.contractSymbol}`,
            code: `${atmCall.contractSymbol}+${atmPut.contractSymbol}`,
            callCode: atmCall.contractSymbol,
            putCode: atmPut.contractSymbol,
            sym, m: 'intraday', exp: e, k: atmCall.strike,
            isMultiLeg: true,
            strategyLabel: `${atmCall.strike}C + ${atmPut.strike}P Straddle`,
            strategyName: 'Long Straddle (Volatility Breakout)',
            regime: qr.name,
            quantRegime: qr,
            bid: +(atmCall.bid + atmPut.bid).toFixed(2),
            ask: +(atmCall.ask + atmPut.ask).toFixed(2),
            mid: comboLive,
            live: comboLive,
            iv: +((((atmCall.impliedVolatility || 0.25) + (atmPut.impliedVolatility || 0.25)) / 2)).toFixed(4),
            d: 0.02,
            th: -0.08,
            oi: Math.min(atmCall.openInterest || 0, atmPut.openInterest || 0),
            v: Math.min(atmCall.volume || 0, atmPut.volume || 0),
            score: 86,
            tier: 'Strict',
            stop: plan.stop,
            tgt: plan.tgt,
            src: 'Yahoo Live'
          });
        }
      }
    }
  }
  return out;
}

function buildStrategyPicksFromQualified() {
  const singleLegStrategies = picks
    .filter(p => !p.gemini || p.gemini.approved)
    .map(p => ({
      ...p,
      isMultiLeg: false,
      strategyLabel: `${p.k}${p.call ? 'C' : 'P'} (${p.strategyName})`,
      regime: p.quantRegime?.name || 'Mixed'
    }));

  const combined = [...strategyPicks, ...singleLegStrategies];
  const seen = new Set();
  strategyPicks = combined.filter(item => {
    if (seen.has(item.code)) return false;
    seen.add(item.code);
    return true;
  }).sort((a, b) => b.score - a.score);
}

// --- Paper Order Execution ---
function isAutoPickEligible(p) { return !!(p && p.tier && p.tier === tierForScore(p.score)); }

function createPaperOrder(p, source = 'Manual Auto-Picks') {
  if (!isAutoPickEligible(p)) return { ok: false, reason: 'Below Sniper threshold' };
  if (cfg.pos.some(x => x.code === p.code)) return { ok: false, reason: 'Already open' };

  const isAuto = source === 'Auto-Picks Sniper';
  if (isAuto) {
    if (cfg.rthOnly !== false && marketPhase().code !== 'open') return { ok: false, retry: true, reason: 'RTH market closed' };
    if (cfg.pos.length >= (Number(cfg.maxOpenPos) || 3)) return { ok: false, retry: true, reason: 'Max open positions reached' };
    if (cfg.onePerSymbol !== false && cfg.pos.some(x => x.sym === p.sym)) return { ok: false, retry: true, reason: `Position open for ${p.sym}` };
  }

  const entry = +(Number(p.live) > 0 ? p.live : p.mid).toFixed(2);
  const plan = riskPlan(entry, p.tier, (p.m || 'intraday') === 'intraday');
  cfg.pos.push({
    id: Date.now() + cfg.pos.length,
    sym: p.sym, code: p.code, k: p.k, call: p.call, side: 'BUY', exp: p.exp,
    qty: 1, entry, live: entry, src: p.src || 'Auto-Picks',
    stop: plan.stop, initialStop: plan.stop, tgt: plan.tgt,
    autoClose: true, m: p.m, rr: tierRR(p.tier), tier: p.tier, score: p.score,
    autoEntered: isAuto, entrySource: source, openedAt: Date.now(),
    highWater: entry, profitStage: 0
  });
  return { ok: true };
}

function createStrategyPaperOrder(sp, source = 'Auto-picks Strategy') {
  if (!sp) return { ok: false, reason: 'Invalid strategy' };
  if (cfg.stratPos.some(x => x.code === sp.code)) return { ok: false, reason: 'Strategy already open' };

  const isAuto = source === 'Auto-picks Strategy';
  if (isAuto) {
    if (cfg.rthOnly !== false && marketPhase().code !== 'open') return { ok: false, retry: true, reason: 'RTH market closed' };
    if (cfg.stratPos.length >= (Number(cfg.maxOpenPos) || 3)) return { ok: false, retry: true, reason: 'Max strategy positions reached' };
  }

  const entry = +(Number(sp.live) > 0 ? sp.live : sp.mid).toFixed(2);
  const plan = riskPlan(entry, sp.tier || 'Strict', (sp.m || 'intraday') === 'intraday');
  const legMultiplier = sp.isMultiLeg ? 2 : 1;

  cfg.stratPos.push({
    id: Date.now() + cfg.stratPos.length + 1000,
    sym: sp.sym, code: sp.code, callCode: sp.callCode || null, putCode: sp.putCode || null,
    isMultiLeg: !!sp.isMultiLeg, legMultiplier,
    strategyName: sp.strategyName || (sp.call ? 'Long Call' : 'Long Put'),
    strategyLabel: sp.strategyLabel || lbl(sp),
    regime: sp.regime || sp.quantRegime?.name || 'Mixed',
    k: sp.k, call: sp.call, side: 'BUY', exp: sp.exp,
    qty: 1, entry, live: entry, src: sp.src || 'Strategy Engine',
    stop: plan.stop, initialStop: plan.stop, tgt: plan.tgt,
    autoClose: true, m: sp.m || 'intraday', rr: tierRR(sp.tier || 'Strict'),
    tier: sp.tier || 'Strict', score: sp.score || 85,
    autoEntered: isAuto, openedAt: Date.now(), highWater: entry, profitStage: 0
  });
  return { ok: true };
}

async function executeEligibleAutoPicks() {
  const eligible = picks.filter(p => isAutoPickEligible(p) && (!p.gemini || p.gemini.approved));
  let added = 0, stratAdded = 0, waiting = 0, waitReason = '';

  for (const p of eligible) {
    if (cfg.autoPickExecuted[p.code]) continue;
    const res = createPaperOrder(p, 'Auto-Picks Sniper');
    if (res.ok) { added++; cfg.autoPickExecuted[p.code] = Date.now(); }
    else if (res.retry) { waiting++; waitReason = res.reason; }
  }

  if (cfg.stratAutoRoute !== false) {
    for (const sp of strategyPicks) {
      if (cfg.stratAutoExecuted[sp.code]) continue;
      const sRes = createStrategyPaperOrder(sp, 'Auto-picks Strategy');
      if (sRes.ok) { stratAdded++; cfg.stratAutoExecuted[sp.code] = Date.now(); }
      else if (sRes.retry) { waiting++; waitReason = sRes.reason; }
    }
  }

  save();
  autoTradeMsg = `Sniper: ${added} single-leg · ${stratAdded} strategy added` + (waiting ? ` · Waiting (${waitReason})` : '');
  return added + stratAdded;
}

// --- Profit Shield & Auto-Close Engine ---
function updateProfitShield(p) {
  const risk = Math.max(0.01, p.entry - Number(p.initialStop || p.stop));
  const r = (p.live - p.entry) / risk;
  p.highWater = Math.max(Number(p.highWater || p.entry), p.live);
  let sl = Number(p.stop), stage = p.profitStage || 0;
  if (r >= 0.6 && stage < 1) { sl = Math.max(sl, p.entry + risk * 0.10); stage = 1; }
  if (r >= 1.0 && stage < 2) { sl = Math.max(sl, p.entry + risk * 0.40); stage = 2; }
  if (r >= 1.5) {
    const trail = p.highWater - Math.max(risk * 0.30, (p.highWater - p.entry) * 0.35);
    sl = Math.max(sl, trail, p.entry + risk * 0.80);
    stage = 3;
  }
  if (sl > p.stop) { p.stop = +sl.toFixed(2); p.profitStage = stage; }
}

function closePos(i, reason = 'Manual close') {
  const p = cfg.pos[i];
  if (!p) return;
  const exitPx = Number(p.live) || p.entry;
  const feeTotal = 2 * cfg.fee * p.qty;
  const realizedPL = (exitPx - p.entry) * 100 * p.qty - feeTotal;
  cfg.closed.unshift({
    ...p, exitPrice: exitPx, realizedPL, feeTotal, closedAt: Date.now(), closeReason: reason, autoClosed: reason !== 'Manual close'
  });
  cfg.pos.splice(i, 1);
  save();
  render();
}

function closeStratPos(i, reason = 'Manual close') {
  const p = cfg.stratPos[i];
  if (!p) return;
  const exitPx = Number(p.live) || p.entry;
  const mult = p.legMultiplier || (p.isMultiLeg ? 2 : 1);
  const feeTotal = 2 * cfg.fee * p.qty * mult;
  const realizedPL = (exitPx - p.entry) * 100 * p.qty - feeTotal;
  cfg.stratClosed.unshift({
    ...p, exitPrice: exitPx, realizedPL, feeTotal, closedAt: Date.now(), closeReason: reason, autoClosed: reason !== 'Manual close'
  });
  cfg.stratPos.splice(i, 1);
  save();
  render();
}

let quoteRefreshBusy = false;
async function refresh() {
  if (quoteRefreshBusy || document.hidden) return;
  if (!cfg.pos.length && !cfg.stratPos.length && !cfg.livePos.length) return;
  quoteRefreshBusy = true;
  try {
    for (const p of cfg.pos) {
      try {
        const q = (await api('/api/moomoo/quote?code=' + encodeURIComponent(p.code))).quote;
        if (q && q.last > 0) { p.live = q.last; p.src = 'Moomoo'; }
      } catch (e) {}
    }
    for (const p of cfg.stratPos) {
      try {
        if (p.isMultiLeg && p.callCode && p.putCode) {
          const [qc, qp] = await Promise.all([
            api('/api/moomoo/quote?code=' + encodeURIComponent(p.callCode)).catch(() => null),
            api('/api/moomoo/quote?code=' + encodeURIComponent(p.putCode)).catch(() => null)
          ]);
          if (qc?.quote?.last > 0 && qp?.quote?.last > 0) {
            p.live = +(qc.quote.last + qp.quote.last).toFixed(2);
            p.src = 'Moomoo Combo';
          }
        } else {
          const q = (await api('/api/moomoo/quote?code=' + encodeURIComponent(p.code))).quote;
          if (q && q.last > 0) { p.live = q.last; p.src = 'Moomoo'; }
        }
      } catch (e) {}
    }
    for (const p of (cfg.livePos || [])) {
      try {
        if (!p.exp || !p.sym) {
          const c = parseContractInput(p.code);
          if (c) { p.sym = p.sym || c.root; p.exp = p.exp || c.expMidTs; p.code = c.occ; }
        }
        const q = (await api('/api/moomoo/quote?code=' + encodeURIComponent(p.code))).quote;
        if (q && q.last > 0) {
          p.live = q.last;
          p.src = 'Moomoo';
          p.optionQuote = { bid:Number(q.bid||0), ask:Number(q.ask||0), oi:Number(q.oi||0), iv:Number(q.iv||0), delta:Number(q.delta||0), theta:Number(q.theta||0), volume:Number(q.volume||0), at:Date.now() };
          if (p.live > (p.highestSeen || p.entry)) p.highestSeen = p.live;
          evaluateLiveStrikeDecision(p);
        } else if (p.sym && p.exp) {
          const o = (await api(`/api/chain?symbol=${encodeURIComponent(p.sym)}&date=${p.exp}`)).optionChain.result[0]?.options?.[0];
          if (o) {
            const c = [...(o.calls || []), ...(o.puts || [])].find(x => x.contractSymbol === p.code);
            if (c) {
              const b = c.bid || 0, a = c.ask || 0, l = c.lastPrice || 0;
              p.live = l > 0 ? l : ((b > 0 && a > 0) ? +((b + a) / 2).toFixed(2) : p.live);
              p.src = l > 0 ? 'Yahoo Live' : 'Yahoo Mid';
              const occ = parseOccMeta(p.code);
              const T = Math.max(0.05, occ ? occ.dte : 3) / 365;
              const S = Number(p.ta?.lastUnderlying || occ?.strike || 100);
              const g = greeks(S, p.k || occ?.strike || S, T, Number(c.impliedVolatility || 0.35), p.call !== false);
              p.optionQuote = { bid:b, ask:a, oi:Number(c.openInterest||0), iv:Number(c.impliedVolatility||0), delta:g.d, theta:g.th, volume:Number(c.volume||0), at:Date.now() };
              if (p.live > (p.highestSeen || p.entry)) p.highestSeen = p.live;
              evaluateLiveStrikeDecision(p);
            }
          }
        }
      } catch (e) {}
    }

    const isRthOpen = marketPhase().code === 'open';
    const etNow = etParts();
    const closeMins = marketCalendar(etNow.y).early.has(ymd(etNow)) ? 780 : 960;
    const nowMins = etNow.h * 60 + etNow.min;
    const isEodWindow = isRthOpen && nowMins >= (closeMins - 5) && nowMins < closeMins;

    const exits = [];
    cfg.pos.forEach((p, i) => {
      if (p.autoClose === false || !(p.live > 0)) return;
      if (cfg.rthOnly !== false && !isRthOpen) return;
      updateProfitShield(p);
      if (p.tgt > 0 && p.live >= p.tgt) exits.push({ i, reason: 'Auto-close: Target hit' });
      else if (p.stop > 0 && p.live <= p.stop) exits.push({ i, reason: p.profitStage ? 'Auto-close: Profit Shield hit' : 'Auto-close: Stop loss hit' });
      else if (cfg.eodSquareOff !== false && (p.m || 'intraday') === 'intraday' && isEodWindow) exits.push({ i, reason: 'Auto-close: EOD square-off' });
    });
    exits.sort((a, b) => b.i - a.i).forEach(x => closePos(x.i, x.reason));

    const stratExits = [];
    cfg.stratPos.forEach((p, i) => {
      if (p.autoClose === false || !(p.live > 0)) return;
      if (cfg.rthOnly !== false && !isRthOpen) return;
      updateProfitShield(p);
      if (p.tgt > 0 && p.live >= p.tgt) stratExits.push({ i, reason: 'Auto-close: Strategy Target hit' });
      else if (p.stop > 0 && p.live <= p.stop) stratExits.push({ i, reason: p.profitStage ? 'Auto-close: Profit Shield hit' : 'Auto-close: Stop loss hit' });
      else if (cfg.eodSquareOff !== false && (p.m || 'intraday') === 'intraday' && isEodWindow) stratExits.push({ i, reason: 'Auto-close: EOD square-off' });
    });
    stratExits.sort((a, b) => b.i - a.i).forEach(x => closeStratPos(x.i, x.reason));

    save();
    if (tab === 'paper' || tab === 'stratPaper') render();
    if (tab === 'live') renderLiveMonitor();
  } finally { quoteRefreshBusy = false; }
}

window.exportCsv = function(isStrategy) {
  const openList = isStrategy ? cfg.stratPos : cfg.pos;
  const closedList = isStrategy ? cfg.stratClosed : cfg.closed;
  const rows = [['Status','Symbol','Strategy','Contract','Qty','Entry','Live/Exit','Stop','Target','Net P&L','Fees','Close Reason']];
  openList.forEach(p => {
    const mult = p.legMultiplier || (p.isMultiLeg ? 2 : 1);
    const fee = 2 * cfg.fee * p.qty * mult;
    const pl = (p.live - p.entry) * 100 * p.qty - fee;
    rows.push(['Open', p.sym, p.strategyName || 'Single Leg', p.code, p.qty, p.entry, p.live, p.stop, p.tgt, pl.toFixed(2), fee.toFixed(2), '']);
  });
  closedList.forEach(p => {
    const mult = p.legMultiplier || (p.isMultiLeg ? 2 : 1);
    const fee = p.feeTotal ?? (2 * cfg.fee * p.qty * mult);
    rows.push(['Closed', p.sym, p.strategyName || 'Single Leg', p.code, p.qty, p.entry, p.exitPrice, p.stop, p.tgt, Number(p.realizedPL).toFixed(2), fee.toFixed(2), p.closeReason || '']);
  });
  if (rows.length === 1) { alert('No trades to export.'); return; }
  const csv = '\uFEFF' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `AlphaPulse_${isStrategy ? 'Strategy' : 'SingleLeg'}_Trades_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
};

// Sizes quantity respecting Available Cash, 40% single-trade cap ($200 on $500), and Max Dollar Risk ($25)
function lsFitQty(entry, availableCash, maxRisk, stopPct) {
  const maxSingleTradeCap = (lsDraft.budget || 500) * 0.40;
  const effectiveCap = Math.min(availableCash, maxSingleTradeCap);
  const costPerContract = entry * 100 + cfg.fee;
  const riskPerContract = entry * 100 * (stopPct / 100) + (2 * cfg.fee);
  return Math.max(1, Math.min(Math.floor(effectiveCap / costPerContract), Math.floor(maxRisk / riskPerContract)));
}

window.buildLiveStrikeShortlist = async function() {
  updateLsCalculatorPreview();
  const c = parseContractInput(lsDraft.code);
  if (!c) { alert('Enter a contract including symbol, expiry and C/P first, e.g. SPY 11-13 595C.'); return; }
  lsShortlist = { loading: true, error: '', rows: [], at: Date.now() };
  renderLsShortlist();
  try {
    const res = (await api(`/api/chain?symbol=${encodeURIComponent(c.root)}&date=${c.expMidTs}`)).optionChain.result[0];
    const q = res.quote || {}, spot = Number(q.regularMarketPrice || q.postMarketPrice || 0), side = c.call ? 'calls' : 'puts', opts = res.options?.[0]?.[side] || [];
    const now = Date.now() / 1000, dte = Math.max(0, (c.expMidTs - now) / 86400), T = Math.max(1 / 365, dte / 365);
    const availCash = lsAvailableCash();
    const maxSingleCap = (lsDraft.budget || 500) * 0.40; // $200 cap on $500 account

    const rows = opts.map(o => {
      const bid = Number(o.bid || 0), ask = Number(o.ask || 0), mid = bid > 0 && ask > 0 ? (bid + ask) / 2 : Number(o.lastPrice || 0), iv = Number(o.impliedVolatility || 0);
      if (!(mid > 0) || !(spot > 0)) return null;
      const cost = mid * 100;
      if (cost > availCash || mid < 0.50 || mid > 3.50) return null; // Filter out unaffordable/toxic contracts for $500

      const delta = Math.abs(greeks(spot, Number(o.strike), T, iv || 0.35, c.call).d);
      const spread = bid > 0 && ask > 0 ? (ask - bid) / mid * 100 : 99;
      const oi = Number(o.openInterest || 0), vol = Number(o.volume || 0), cap = contextualSpreadCap(mid, dte);
      const feeDragPct = ((2 * cfg.fee) / cost) * 100;
      const inSweetSpot = mid >= 0.80 && mid <= 2.20;

      let score = 0;
      // Sweet spot premium ($0.80 - $2.20) gets highest priority
      score += inSweetSpot ? 28 : (mid >= 0.65 && mid <= 2.50 ? 15 : 4);
      // Ideal single-leg Delta (0.45 - 0.60)
      score += delta >= 0.45 && delta <= 0.60 ? 28 : delta >= 0.38 && delta <= 0.68 ? 18 : 6;
      // Tight spread
      score += spread <= 4 ? 18 : spread <= cap ? 12 : 4;
      // Liquidity
      score += oi >= 1000 ? 12 : oi >= 300 ? 8 : 3;
      score += vol >= 250 ? 8 : vol >= 75 ? 5 : 2;
      // Sweet spot DTE (2 - 7 DTE avoids extreme 0DTE Theta crush)
      score += dte >= 2 && dte <= 7 ? 10 : dte >= 1 ? 6 : 2;
      // Single-trade cap check ($200 max on $500)
      if (cost > maxSingleCap) score -= 12;

      score = Math.max(0, Math.min(100, Math.round(score)));
      const grade = score >= 82 ? 'A' : score >= 70 ? 'B' : score >= 58 ? 'C' : 'D';
      const note = inSweetSpot
        ? `Sweet Spot ($${cost.toFixed(0)} <= $${maxSingleCap.toFixed(0)} cap, Fee drag ${feeDragPct.toFixed(1)}%)`
        : (mid < 0.80 ? `High fee drag (${feeDragPct.toFixed(1)}%)` : `Above $200 single-trade cap ($${cost.toFixed(0)})`);

      return { code: o.contractSymbol, strike: o.strike, delta, spread, oi, vol, mid, dte, score, grade, note, feeDragPct };
    }).filter(Boolean).filter(r => r.spread <= 15).sort((a, b) => b.score - a.score || a.spread - b.spread).slice(0, 5);

    if (!rows.length) throw new Error(`No contracts found within your $${availCash.toFixed(0)} available cash & $0.50–$3.50 range.`);
    lsShortlist = { loading: false, error: '', rows, at: Date.now() };
  } catch (e) {
    lsShortlist = { loading: false, error: e.message || String(e), rows: [], at: Date.now() };
  }
  renderLsShortlist();
};

function lsMetrics(d) {
  const { entry, qty, budget, stopPct, tgtPct, trailPct, limitBufPct } = d;
  const maxRisk = d.maxRisk || 25;
  const capital = entry * 100 * qty;
  const roundtripFee = 2 * cfg.fee * qty;
  const totalOutlay = capital + (cfg.fee * qty);
  const deployed = lsDeployedCapital();
  const availableCash = Math.max(0, budget - deployed);
  const maxSingleAllocation = budget * 0.40; // 40% cap ($200 on $500)
  const feeDragPct = capital > 0 ? (roundtripFee / capital) * 100 : 0;

  // Standard % Stop & Target
  const slTrigger = +(entry * (1 - stopPct / 100)).toFixed(2);
  const slLimit = +(slTrigger * (1 - limitBufPct / 100)).toFixed(2);
  const t1Trigger = +(entry * 1.15).toFixed(2); // Mandatory +15% T1 Breakeven Lock trigger
  const beLockStop = +(entry + (roundtripFee / (100 * qty)) + 0.01).toFixed(2);
  const tpLimit = +(entry * (1 + tgtPct / 100)).toFixed(2);

  // Dollar-Capped Stop Loss (guarantees max net loss <= maxRisk, e.g. $25)
  const allowableOptionDrop = Math.max(0.01, (maxRisk - roundtripFee) / (100 * qty));
  const dollarCappedStop = +Math.max(0.01, entry - allowableOptionDrop).toFixed(2);
  const dollarCappedStopPct = entry > 0 ? ((entry - dollarCappedStop) / entry) * 100 : 0;

  const trailDrop = +(entry * (trailPct / 100)).toFixed(2);
  const trailFloorInit = +(entry - trailDrop).toFixed(2);
  const breakevenPx = +(entry + (roundtripFee / (100 * qty))).toFixed(2);
  const netProfitAtTp = (tpLimit - entry) * 100 * qty - roundtripFee;
  const netProfitPct = capital > 0 ? (netProfitAtTp / capital) * 100 : 0;
  const netLossAtSl = (slTrigger - entry) * 100 * qty - roundtripFee;
  const netLossPct = capital > 0 ? (netLossAtSl / capital) * 100 : 0;
  const worstLoss = (slLimit - entry) * 100 * qty - roundtripFee;
  const rr = Math.abs(netLossAtSl) > 0 ? Math.abs(netProfitAtTp / netLossAtSl) : 0;
  const prof = LS_PROFILES[d.profile] || {};
  const minRR = prof.minNetRR || 0;
  const riskPctOfBudget = budget > 0 ? Math.abs(netLossAtSl) / budget * 100 : 0;
  const occ = parseOccMeta(d.code);

  // Check 5m ATR noise vs Dollar-Capped Stop if cached TA exists
  const symTa = occ ? taCache5m[occ.root] : null;
  const est5mOptionNoise = symTa && symTa.atr ? +(symTa.atr * 0.50).toFixed(2) : null;
  const stopDistance = +(entry - slTrigger).toFixed(2);

  const warnings = [];
  if (totalOutlay > availableCash) {
    warnings.push(`Outlay $${totalOutlay.toFixed(2)} exceeds Available Cash $${availableCash.toFixed(2)} ($${deployed.toFixed(0)} already deployed).`);
  }
  if (capital > maxSingleAllocation) {
    warnings.push(`Single-trade allocation $${capital.toFixed(0)} exceeds 40% cap ($${maxSingleAllocation.toFixed(0)} max on $${budget} budget).`);
  }
  if (entry < 0.80) {
    warnings.push(`Premium $${entry.toFixed(2)} is below $0.80 sweet spot — Moomoo's $${roundtripFee.toFixed(2)} fee causes ${feeDragPct.toFixed(1)}% immediate fee drag.`);
  } else if (entry > 2.20) {
    warnings.push(`Premium $${entry.toFixed(2)} is above $2.20 sweet spot — ${stopPct}% stop risks $${Math.abs(netLossAtSl).toFixed(2)} (over $${maxRisk} cap).`);
  }
  if (maxRisk > 0 && Math.abs(netLossAtSl) > maxRisk + 0.50) {
    warnings.push(`Stop loss risks $${Math.abs(netLossAtSl).toFixed(2)} (above $${maxRisk} cap). Click "Apply $${maxRisk}-Cap Stop" ($${dollarCappedStop.toFixed(2)}).`);
  }
  if (est5mOptionNoise && stopDistance < est5mOptionNoise * 0.85) {
    warnings.push(`5m ATR noise (~$${est5mOptionNoise.toFixed(2)}/bar) is wider than your $${stopDistance.toFixed(2)} stop — high risk of noise stop-out; pick a cheaper strike (~$1.00–$1.25).`);
  }
  if (minRR && rr < minRR - 0.05) {
    warnings.push(`Net R:R 1:${rr.toFixed(2)} is below minimum 1:${minRR.toFixed(1)}.`);
  }
  if (occ && occ.dte < 1.5) {
    warnings.push(`Only ${occ.dte.toFixed(1)} DTE — high Theta decay risk; prefer 2–7 DTE.`);
  }

  return {
    capital, roundtripFee, totalOutlay, deployed, availableCash, maxSingleAllocation, feeDragPct,
    slTrigger, slLimit, t1Trigger, beLockStop, tpLimit, dollarCappedStop, dollarCappedStopPct,
    trailDrop, trailFloorInit, breakevenPx, netProfitAtTp, netProfitPct, netLossAtSl, netLossPct,
    worstLoss, rr, minRR, riskPctOfBudget, maxRisk, est5mOptionNoise, warnings
  };
}

const TA_STALE_MS = 30 * 60 * 1000;
const taIsStale = t => !!(t && t.barAt) && (Date.now() - t.barAt) > TA_STALE_MS;

function lsMinutesToClose() {
  try {
    const x = etParts(), cal = marketCalendar(x.y), close = cal.early.has(ymd(x)) ? 780 : 960;
    return Math.max(0, close - (x.h * 60 + x.min));
  } catch (e) { return 390; }
}

function adaptiveLivePlan(p) {
  const t = p.ta || {}, occ = parseOccMeta(p.code), dte = occ ? occ.dte : 7;
  const mins = lsMinutesToClose(), stale = taIsStale(t), rvol = Number(t.rvol || 0);
  const isCall = p.call !== false, S = Number(t.lastUnderlying || 0);
  const trend = isCall
    ? (S > t.vwap && t.e5 > t.e10 && t.e10 >= t.e20 && Number(t.macdHist) >= 0)
    : (S < t.vwap && t.e5 < t.e10 && t.e10 <= t.e20 && Number(t.macdHist) <= 0);
  const against = isCall
    ? (S < t.vwap && t.e5 < t.e20 && Number(t.macdHist) < 0)
    : (S > t.vwap && t.e5 > t.e20 && Number(t.macdHist) > 0);
  let finalPct = Number(p.tgtPct || 30);
  if (dte < 0.8) finalPct = Math.min(finalPct, 25);
  else if (dte < 2) finalPct = Math.min(finalPct, 30);
  if (mins < 90) finalPct = Math.min(finalPct, 22);
  if (mins < 35) finalPct = Math.min(finalPct, 15);
  if (!trend || rvol < 1.0) finalPct = Math.min(finalPct, 20);
  if (trend && rvol >= 1.25 && mins >= 90 && !stale) finalPct = Math.min(Number(p.tgtPct || 30), finalPct + 5);
  if (against) finalPct = Math.min(finalPct, 10);
  finalPct = Math.max(8, Math.round(finalPct));

  const t1Pct = 15; // Mandatory +15% T1 Breakeven Lock threshold
  const t1Price = +(p.entry * 1.15).toFixed(2);
  const roundtripFee = 2 * cfg.fee * Math.max(1, p.qty || 1);
  const beLockStop = +(p.entry + (roundtripFee / (100 * Math.max(1, p.qty || 1))) + 0.01).toFixed(2);
  const finalPrice = +(p.entry * (1 + finalPct / 100)).toFixed(2);
  const progress = finalPrice > p.entry ? cl((p.live - p.entry) / (finalPrice - p.entry), 0, 1) * 100 : 0;

  // Daily Theta Burn Ratio (|Theta| / Live Price * 100)
  const q = p.optionQuote || {};
  const estTheta = q.theta ? Math.abs(Number(q.theta)) : Math.abs(greeks(S || p.k || 100, p.k || 100, Math.max(0.05, dte) / 365, Number(q.iv || 0.35), isCall).th);
  const thetaBurnPct = p.live > 0 ? (estTheta / p.live) * 100 : 0;

  return { dte, mins, trend, against, stale, rvol, t1Pct, t1Price, beLockStop, finalPct, finalPrice, progress, estTheta, thetaBurnPct };
}

function liveStrikeSelection(p) {
  const q = p.optionQuote || {}, t = p.ta || {}, occ = parseOccMeta(p.code), dte = occ ? occ.dte : 0;
  const spot = Number(t.lastUnderlying || 0), strike = Number(p.k || occ?.strike || 0), absDelta = Math.abs(Number(q.delta || 0));
  const bid = Number(q.bid || 0), ask = Number(q.ask || 0), mid = bid > 0 && ask > 0 ? (bid + ask) / 2 : 0;
  const spreadPct = mid > 0 ? (ask - bid) / mid * 100 : 99, oi = Number(q.oi || 0), vol = Number(q.volume || 0);
  const cost = Number(p.entry || 0) * 100;
  const inSweetSpot = p.entry >= 0.80 && p.entry <= 2.20;

  let score = 0, risks = [];
  if (inSweetSpot) score += 25; else risks.push(`$${p.entry.toFixed(2)} outside $0.80–$2.20 sweet spot`);
  if (cost <= 200) score += 15; else risks.push(`$${cost.toFixed(0)} exceeds $200 (40%) single-trade cap`);
  if (absDelta >= 0.45 && absDelta <= 0.62) score += 25;
  else if (absDelta >= 0.38 && absDelta <= 0.70) score += 16;
  else { score += 5; risks.push(`delta ${absDelta ? absDelta.toFixed(2) : '--'} outside 0.45–0.62`); }
  if (spreadPct <= 5) score += 15; else if (spreadPct <= 8) score += 10; else risks.push('wide spread');
  if (oi >= 500) score += 10; else if (oi >= 200) score += 6;
  if (dte >= 2 && dte <= 7) score += 10; else if (dte >= 1) score += 6; else risks.push(`${dte.toFixed(1)} DTE high Theta burn`);

  score = Math.max(0, Math.min(100, Math.round(score)));
  const grade = score >= 82 ? 'A' : score >= 70 ? 'B' : score >= 58 ? 'C' : 'D';
  const verdict = grade === 'A' ? 'OPTIMAL $500 STRIKE' : grade === 'B' ? 'ACCEPTABLE WITH TIGHT STOP' : grade === 'C' ? 'SUBOPTIMAL FOR $500 BUDGET' : 'AVOID · HIGH FEE/THETA DRAG';
  const alternative = 'Target $0.80–$2.20 ATM contracts (2–7 DTE, |delta| 0.45–0.60, spread ≤5%) to keep risk ≤$25.';
  return { score, grade, verdict, absDelta, spreadPct, oi, vol, dte, risks, alternative };
}

function evaluateLiveStrikeDecision(p) {
  const t = p.ta || {};
  const peak = Math.max(p.entry, p.highestSeen || p.entry, p.live || p.entry);
  p.highestSeen = peak;
  const trailStopPx = +(peak * (1 - (p.trailPct || 12) / 100)).toFixed(2);
  const isCall = p.call !== false;
  const ap = adaptiveLivePlan(p);
  const closedNow = marketPhase().code !== 'open';
  const closedNote = closedNow ? ' (US market closed; using last quote).' : '';
  const sellNow = closedNow ? 'SELL AT OPEN' : 'SELL NOW';

  // Trigger Mandatory +15% T1 Breakeven Lock
  if (p.live >= ap.t1Price && !p.t1Locked) {
    p.t1Locked = true;
    if (p.slPrice < ap.beLockStop) {
      p.slPrice = ap.beLockStop;
      p.slLimit = +(ap.beLockStop * 0.98).toFixed(2);
    }
  }

  if (p.live <= p.slPrice) {
    t.action = p.t1Locked ? `${sellNow} · BREAKEVEN LOCK HIT ($${p.slPrice.toFixed(2)})` : `${sellNow} · STOP LOSS HIT`;
    t.tone = p.t1Locked ? 'warn' : 'sell';
    t.reason = p.t1Locked
      ? `Protected principal + Moomoo fees at $${p.slPrice.toFixed(2)} after reaching +15% T1.`
      : `Live premium ($${p.live.toFixed(2)}) breached -${p.stopPct}% Stop Loss ($${p.slPrice.toFixed(2)}).${closedNote}`;
    p.ta = t; return;
  }
  if (p.live >= ap.finalPrice) {
    t.action = closedNow ? 'SELL AT OPEN · TARGET HIT' : 'SELL / LOCK PROFIT · TARGET HIT';
    t.tone = 'sell';
    t.reason = `Live premium ($${p.live.toFixed(2)}) reached +${ap.finalPct}% target ($${ap.finalPrice.toFixed(2)}).${closedNote}`;
    p.ta = t; return;
  }
  if (p.t1Locked && p.live < ap.finalPrice) {
    t.action = `MOVE STOP TO BREAKEVEN ($${ap.beLockStop.toFixed(2)}) · T1 +15% HIT`;
    t.tone = 'keep';
    t.reason = `T1 (+15% / $${ap.t1Price.toFixed(2)}) hit! Stop raised to $${ap.beLockStop.toFixed(2)} (covers $1.38 Moomoo roundtrip fee). Trail remaining move toward $${ap.finalPrice.toFixed(2)}.`;
    p.ta = t; return;
  }
  if (peak > p.entry * 1.08 && p.live <= trailStopPx) {
    t.action = closedNow ? 'SELL AT OPEN · TRAILING STOP HIT' : 'SELL · TRAILING STOP TRIGGERED';
    t.tone = 'sell';
    t.reason = `Pulled back ${p.trailPct}% from peak ($${peak.toFixed(2)}) to trailing stop ($${trailStopPx.toFixed(2)}).${closedNote}`;
    p.ta = t; return;
  }

  if (!t.e20 || !t.vwap) {
    t.tone = 'warn';
    t.action = t.status === 'error' ? 'NO CHART DATA · SEE REASON' : 'HOLD · LOADING 5M CHART…';
    t.reason = t.error || 'Fetching 5m bars for EMA 5/10/20, VWAP, RSI & MACD…';
    p.ta = t; return;
  }

  let bullPts = 0, bearPts = 0;
  const S = t.lastUnderlying || t.e5;
  if (t.e5 > t.e10 && t.e10 > t.e20) bullPts += 2;
  else if (t.e5 < t.e10 && t.e10 < t.e20) bearPts += 2;
  else if (t.e5 > t.e10) bullPts += 1;
  else bearPts += 1;

  if (S > t.vwap) bullPts += 2; else bearPts += 2;
  if (t.rsi >= 53 && t.rsi <= 74) bullPts += 1;
  else if (t.rsi <= 47 && t.rsi >= 26) bearPts += 1;
  if (t.macdHist > 0) bullPts += 1; else bearPts += 1;
  if (/Bullish|Breakout|Hammer/.test(t.pattern)) bullPts += 1;
  if (/Bearish|Breakdown|Shooting/.test(t.pattern)) bearPts += 1;

  const favorPts = isCall ? bullPts : bearPts;
  const againstPts = isCall ? bearPts : bullPts;
  const burnNote = ap.thetaBurnPct > 10 ? ` ⚠ HIGH THETA BURN (${ap.thetaBurnPct.toFixed(1)}%/day) — exit quickly if stalled.` : '';

  if (favorPts >= 5) {
    t.action = ap.thetaBurnPct > 10 ? 'HOLD · HIGH THETA BURN WATCH' : 'KEEP / HOLD STRIKE (STRONG TREND)';
    t.tone = 'keep';
    t.reason = `${isCall ? 'Bullish' : 'Bearish'} alignment: EMA 5/10/20 stacked with VWAP ($${t.vwap.toFixed(2)}), MACD ${t.macdHist >= 0 ? '+' : ''}${t.macdHist.toFixed(3)}, RSI ${t.rsi.toFixed(0)}.${burnNote}`;
  } else if (againstPts >= 5) {
    t.action = 'SELL STRIKE (TA REVERSAL)';
    t.tone = 'sell';
    t.reason = `Trend flipped against ${isCall ? 'CALL' : 'PUT'}: EMA 5/10 crossed against VWAP ($${t.vwap.toFixed(2)}), RSI ${t.rsi.toFixed(0)}. Protect your $500 bankroll.`;
  } else {
    t.action = ap.against ? 'REDUCE / EXIT · MOMENTUM FAILED' : 'WAIT · NO NEW ADD (MIXED)';
    t.tone = 'warn';
    t.reason = `Mixed signals (${favorPts} pro vs ${againstPts} against). T1 Breakeven Lock at $${ap.t1Price.toFixed(2)} (+15%).${burnNote}`;
  }
  p.ta = t;
}

let taBusy = false;
async function updateLiveStrikesTA() {
  if (taBusy || !cfg.livePos || !cfg.livePos.length || document.hidden) return;
  taBusy = true;
  try {
    const bySym = {};
    cfg.livePos.forEach(p => (bySym[p.sym] ??= []).push(p));
    for (const sym of Object.keys(bySym)) {
      try {
        const ch = await api(`/api/chart?symbol=${encodeURIComponent(sym)}&range=5d&interval=5m`);
        const res = ch?.chart?.result?.[0];
        if (!res) throw new Error(`No chart data returned for ${sym}.`);
        const ta = computeIntradayTA(res);
        if (!ta) throw new Error(`Fewer than 6 five-minute bars for ${sym}.`);
        taCache5m[sym] = ta;

const BRIDGE_BUILD='3fafe5c11b9b';
window.dl=function(auto=false){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([$('#bridge').textContent.trim()+'\n'],{type:'text/javascript'}));a.href=u;a.download='server.js';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);if(auto)localStorage.setItem('bridgeBuild',BRIDGE_BUILD)};

window.mm = async function() {
  const out = $('#mst');
  try {
    await fetch(cfg.bridge + '/api/moomoo/config', {
      method: 'POST',
      body: JSON.stringify({ key: $('#mk').value, host: $('#mh').value, port: +$('#mp').value })
    });
    out.textContent = 'Connecting to OpenD...';
    const s = await api('/api/moomoo/status');
    out.textContent = s.connected ? '✔ Connected to OpenD' : (s.error || 'Waiting for OpenD login');
    ping();
  } catch (e) { out.textContent = 'Bridge offline.'; }
};

async function ping() {
  try {
    const st = await api('/api/moomoo/status');
    $('#dot').classList.add('online');
    $('#bs').textContent = 'BRIDGE ONLINE' + (st.connected ? ' · MOOMOO LINKED' : ' · YAHOO FALLBACK');
    $('#bs').style.color = 'var(--green)';
  } catch (e) {
    $('#dot').classList.remove('online');
    $('#bs').textContent = 'BRIDGE OFFLINE';
    $('#bs').style.color = 'var(--red)';
  }
}

// --- Resilient Main Render Function ---
function render() {
  const isPaperLike = tab === 'paper' || tab === 'stratPaper';
  document.body.classList.toggle('paper-view', isPaperLike);

  ['picks', 'paper', 'strat', 'stratPaper', 'live', 'set'].forEach(t => {
    const el = document.getElementById('btn-' + t);
    if (el) el.classList.toggle('on', tab === t);
  });

  const view = $('#v');
  if (!view) return;

  try {
    view.innerHTML =
      tab === 'picks'      ? rPicks() :
      tab === 'paper'      ? rPaper() :

      tab === 'stratPaper' ? rStratPaper() :
      tab === 'live'       ? rLive() : rSet();
  } catch (err) {
    console.error('[AlphaPulse Render Error]', err);
    view.innerHTML = `<div class="set" style="border-color:var(--red);">

}

// --- US Market Session Clock ---
const ET_ZONE = 'America/New_York';
const etPartsFmt = new Intl.DateTimeFormat('en-US', {timeZone:ET_ZONE, year:'numeric', month:'2-digit', day:'2-digit', weekday:'short', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'});
function etParts(d = new Date()) {
  const o = {};
  etPartsFmt.formatToParts(d).forEach(x => { if (x.type !== 'literal') o[x.type] = x.value; });
  return { y: +o.year, m: +o.month, d: +o.day, wd: o.weekday, h: +o.hour, min: +o.minute, s: +o.second };
}
function ymd(p) { return `${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`; }
function etWall(y, m, d, h, min) {
  const want = Date.UTC(y, m - 1, d, h, min);
  let t = want;
  for (let i = 0; i < 3; i++) { const p = etParts(new Date(t)); t -= Date.UTC(p.y, p.m - 1, p.d, p.h, p.min) - want; }
  return new Date(t);
}
function marketCalendar(y) {
  const z = (m, d) => `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  return { closed: new Set([z(1,1), z(7,4), z(12,25)]), early: new Set([z(12,24)]) };
}
function marketPhase(date = new Date()) {
  const p = etParts(date), key = ymd(p), cal = marketCalendar(p.y), mins = p.h * 60 + p.min;
  if (p.wd === 'Sat' || p.wd === 'Sun' || cal.closed.has(key)) return { code: 'closed', label: 'US MARKET · CLOSED', detail: 'Weekend / Holiday' };
  const close = cal.early.has(key) ? 780 : 960;
  if (mins >= 570 && mins < close) return { code: 'open', label: 'US MARKET · OPEN', detail: 'Closes 4:00 PM ET' };
  if (mins >= 240 && mins < 570) return { code: 'extended', label: 'US MARKET · PRE-MARKET', detail: 'Opens 9:30 AM ET' };
  if (mins >= close && mins < 1200) return { code: 'extended', label: 'US MARKET · AFTER-HOURS', detail: 'Extended to 8:00 PM ET' };
  return { code: 'closed', label: 'US MARKET · CLOSED', detail: 'Overnight' };
}
const localClockFmt = new Intl.DateTimeFormat(undefined, {weekday:'short', month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', timeZoneName:'short'});
function updateMarketClock() {
  const now = new Date(), phase = marketPhase(now);
  const led = $('#market-led'), state = $('#market-state'), time = $('#market-time'), next = $('#market-next');
  if (!led || !state || !time || !next) return;
  led.className = 'market-led ' + phase.code;
  state.textContent = phase.label;
  state.style.color = phase.code === 'open' ? 'var(--green)' : phase.code === 'extended' ? 'var(--amber)' : 'var(--red)';
  time.textContent = localClockFmt.format(now);
  next.textContent = phase.detail;
}
