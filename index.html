<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>US Options Auto-Picks</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--bd:#d9dee7;--tx:#16202e;--mu:#68758a;--g:#12805c;--r:#c8343f;--a:#1f5fd1;--y:#a8650a}
@media(prefers-color-scheme:dark){:root{--bg:#0f1722;--card:#16212f;--bd:#2a3a50;--tx:#e4eaf3;--mu:#8da0ba;--g:#37c997;--r:#ff6b78;--a:#6ea2ff;--y:#f0b44c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 Georgia,'Times New Roman',serif}
header{display:flex;gap:16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
h1{font-size:18px;margin:0}button,input{font:inherit}
.btn{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:5px 12px;border-radius:6px;cursor:pointer}
.btn.on,.btn.pri{background:var(--a);color:#fff;border-color:var(--a)}
main{padding:16px;max-width:1240px;margin:auto}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:8px}
table{width:100%;border-collapse:collapse}th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th{color:var(--mu);font-weight:normal}th:first-child,td:first-child{text-align:left}
.tag{padding:2px 8px;border-radius:10px;font-size:12px}.Strict{background:#12805c26;color:var(--g)}.Balanced{background:#1f5fd126;color:var(--a)}.Aggressive{background:#a8650a26;color:var(--y)}
.g{color:var(--g)}.r{color:var(--r)}.mu{color:var(--mu)}
input{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:4px;padding:4px 6px;width:84px}
.set label{display:block;margin:12px 0 2px;color:var(--mu)}.set input{width:100%;max-width:440px}
.row{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--r);display:inline-block}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
</style></head><body>
<header><h1>US Options Auto-Picks</h1>
<nav class="row" style="margin:0"><button class="btn" data-t="picks" onclick="tab='picks';render()">Auto-Picks</button><button class="btn" data-t="paper" onclick="tab='paper';render();refresh()">Paper Trading</button><button class="btn" data-t="set" onclick="tab='set';render()">Settings</button></nav>
<span class="mu"><span class="dot" id="dot"></span> <span id="bs">bridge offline</span></span></header>
<main id="v"></main>
<main class="mu" style="padding-top:0">Single-leg long calls/puts only. Paper trading, not financial advice. Yahoo option quotes are delayed about 15 minutes.</main>
<script>
const $=s=>document.querySelector(s);
const cfg=Object.assign({bridge:'http://localhost:8787',uni:'SPY,QQQ,IWM,AAPL,MSFT,NVDA,TSLA,AMZN,META',fee:0.65,chart:'https://www.moomoo.com/stock/{sym}-US',pos:[]},(()=>{try{return JSON.parse(localStorage.getItem('opt')||'{}')}catch(e){return{}}})());
const save=()=>{try{localStorage.setItem('opt',JSON.stringify(cfg))}catch(e){}};
const api=async p=>{const r=await fetch(cfg.bridge+p);if(!r.ok)throw Error(r.status);return r.json()};
let tab='picks',mode='intraday',tier='All',picks=[],msg='',busy=false;

// ---- math ----
const N=x=>{const t=1/(1+.2316419*Math.abs(x)),p=.3989423*Math.exp(-x*x/2)*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-p:p};
function greeks(S,K,T,iv,call){const r=.045,sd=iv*Math.sqrt(T),d1=(Math.log(S/K)+(r+iv*iv/2)*T)/sd,d2=d1-sd,pdf=.3989423*Math.exp(-d1*d1/2);
 return{d:call?N(d1):N(d1)-1,th:(-S*pdf*iv/(2*Math.sqrt(T))-(call?1:-1)*r*K*Math.exp(-r*T)*N(call?d2:-d2))/365}}
const ema=(a,n)=>{const k=2/(n+1);return a.reduce((e,x,i)=>i?x*k+e*(1-k):x,a[0])};
const rsi=(c,n=14)=>{let g=0,l=0;for(let i=c.length-n;i<c.length;i++){const d=c[i]-c[i-1];d>0?g+=d:l-=d}return l?100-100/(1+g/l):100};
const hv=c=>{const r=c.slice(-21).map((x,i,a)=>i?Math.log(x/a[i-1]):0).slice(1),m=r.reduce((a,b)=>a+b)/r.length;return Math.sqrt(r.reduce((a,b)=>a+(b-m)**2,0)/(r.length-1))*Math.sqrt(252)};
const cl=(x,a=0,z=1)=>Math.max(a,Math.min(z,x));

// ---- scoring: trend 25, delta fit 15, spread 15, volume 10, IV vs HV 10, theta burn 10, fundamentals 10 (earnings risk -8) ----
function pick(o,S,T,call,m,b,fs,H,ed){
 const iv=o.impliedVolatility,bid=o.bid||0,ask=o.ask||0,mid=(bid+ask)/2;
 if(!(ask>0)||mid<.1||(o.openInterest||0)<100||!(iv>0))return null;
 const g=greeks(S,o.strike,T,iv,call),sp=(ask-bid)/mid,tg=m==='intraday'?.45:.4,id=m==='intraday';
 let s=25*cl(Math.abs(b)/85)+15*cl(1-Math.abs(Math.abs(g.d)-tg)/.3)+15*cl(1-sp/.15)+10*cl((o.volume||0)/500)+10*cl(1.3-iv/H)+10*cl(1-Math.abs(g.th)/mid/(id?.5:.15))+10*fs;
 s=s*100/95-(ed<(id?1:10)?8:0);
 const tier=s>=75?'Strict':s>=60?'Balanced':s>=45?'Aggressive':null;
 return tier&&{code:o.contractSymbol,k:o.strike,bid,ask,mid,iv,d:g.d,th:g.th,oi:o.openInterest,v:o.volume||0,score:Math.round(s),tier,earn:ed<(id?1:10),stop:mid*(id?.65:.6),tgt:mid*(id?1.5:1.8)};
}
async function analyze(sym){
 const E=encodeURIComponent(sym);
 const[ch,qt,c0]=await Promise.all([api('/api/chart?symbol='+E),api('/api/quote?symbols='+E),api('/api/chain?symbol='+E)]);
 const c=ch.chart.result[0].indicators.quote[0].close.filter(x=>x!=null),q=qt.quoteResponse.result[0]||{},S=c.at(-1);
 const e20=ema(c,20),e50=ema(c,50),R=rsi(c),H=hv(c),chg=q.regularMarketChangePercent||0;
 const b=(S>e20?20:-20)+(e20>e50?25:-25)+(S>e50?10:-10)+(R>55?15:R<45?-15:0)+(chg>.3?15:chg<-.3?-15:0);
 if(Math.abs(b)<30)return[];
 const call=b>0,etf=q.quoteType==='ETF'||sym[0]==='^';let f=5;
 if(!etf){const ar=parseFloat(q.averageAnalystRating)||3;f+=ar<2.2?3:ar>3?-3:0;if(q.forwardPE&&q.trailingPE&&q.forwardPE<q.trailingPE)f+=2}
 const ed=q.earningsTimestamp?(q.earningsTimestamp*1000-Date.now())/864e5:99,fs=(call?f:10-f)/10;
 const dte=e=>(e*1000+864e5-Date.now())/864e5,ex=c0.optionChain.result[0].expirationDates,out=[];
 for(const m of['intraday','swing']){
  const e=ex.find(e=>m==='intraday'?dte(e)>0&&dte(e)<=3:dte(e)>=5&&dte(e)<=14);if(!e)continue;
  const res=(await api(`/api/chain?symbol=${E}&date=${e}`)).optionChain.result[0],op=res.options[0],S2=res.quote.regularMarketPrice||S;
  out.push(...(call?op.calls:op.puts).map(o=>pick(o,S2,Math.max(dte(e),.05)/365,call,m,b,fs,H,ed)).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,2).map(p=>({...p,sym,m,call,exp:e,b:Math.round(b),R:Math.round(R)})));
 }
 return out;
}
async function scan(){
 if(busy)return;busy=true;picks=[];
 for(const s of cfg.uni.split(',').map(s=>s.trim()).filter(Boolean)){msg='Scanning '+s+'…';render();try{picks.push(...await analyze(s))}catch(e){console.warn(s,e)}}
 busy=false;msg='Updated '+new Date().toLocaleTimeString();render();
}

// ---- views ----
const dt=e=>new Date(e*1000).toISOString().slice(5,10),lbl=p=>`${p.sym} ${dt(p.exp)} ${p.k}${p.call?'C':'P'}`;
function rPicks(){
 const L=picks.filter(p=>p.m===mode&&(tier==='All'||p.tier===tier)).sort((a,b)=>b.score-a.score);
 return `<div class="row">${[['intraday','Intraday (0-3 days)'],['swing','Weekly swing (5-14 days)']].map(([m,t])=>`<button class="btn ${mode===m?'on':''}" onclick="mode='${m}';render()">${t}</button>`).join('')}
 <span class="mu">Tier</span>${['All','Strict','Balanced','Aggressive'].map(t=>`<button class="btn ${tier===t?'on':''}" onclick="tier='${t}';render()">${t}</button>`).join('')}
 <button class="btn pri" onclick="scan()">Scan now</button><span class="mu">${msg}</span></div>
 <div class="wrap"><table><tr><th>Contract<th>Mid<th>Bid / Ask<th>Delta<th>Theta/day<th>IV<th>OI / Vol<th>Bias / RSI<th>Score<th>Stop → Target<th></tr>
 ${L.map(p=>`<tr><td>${lbl(p)} <span class="mu">${p.call?'long call':'long put'}</span>${p.earn?' <span class="r" title="Earnings inside the holding window">earnings</span>':''}<td>${p.mid.toFixed(2)}<td>${p.bid.toFixed(2)} / ${p.ask.toFixed(2)}<td>${p.d.toFixed(2)}<td>${p.th.toFixed(2)}<td>${(p.iv*100).toFixed(0)}%<td>${p.oi} / ${p.v}<td>${p.b} / ${p.R}<td><span class="tag ${p.tier}">${p.tier} ${p.score}</span><td>${p.stop.toFixed(2)} → ${p.tgt.toFixed(2)}<td><button class="btn" onclick="add('${p.code}')">Paper trade</button></tr>`).join('')||`<tr><td colspan="11" class="mu">${busy?'Scanning…':'No setups at this score yet. Start the bridge (node server.js), check Settings, then press Scan now.'}</tr>`}</table></div>`;
}
function add(code){const p=picks.find(x=>x.code===code);cfg.pos.push({id:Date.now(),sym:p.sym,code,k:p.k,call:p.call,exp:p.exp,qty:1,entry:+p.mid.toFixed(2),live:p.mid});save();tab='paper';render()}
function ed(i,k,v){cfg.pos[i][k]=Math.max(0,+v);save();render()}
function chart(i){const p=cfg.pos[i],u=cfg.chart.replace('{sym}',p.sym.replace('^','')).replace('{code}',p.code).replace('{strike}',p.k).replace('{type}',p.call?'C':'P').replace('{qty}',p.qty);navigator.clipboard?.writeText(p.code).catch(()=>{});window.open(u,'_blank')}
function rPaper(){
 let tot=0;
 const rows=cfg.pos.map((p,i)=>{const fee=2*cfg.fee*p.qty,pl=(p.live-p.entry)*100*p.qty-fee;tot+=pl;
  return `<tr><td>${lbl(p)}<td><input type="number" min="1" value="${p.qty}" onchange="ed(${i},'qty',this.value)"><td><input type="number" step="0.01" value="${p.entry}" onchange="ed(${i},'entry',this.value)"><td>${p.live.toFixed(2)}<td class="${pl>=0?'g':'r'}">${pl.toFixed(2)}<td class="mu">${fee.toFixed(2)}<td><button class="btn" title="Open Moomoo chart (contract code is copied)" onclick="chart(${i})">📈</button> <button class="btn" title="Remove" onclick="cfg.pos.splice(${i},1);save();render()">✕</button></tr>`}).join('');
 return `<div class="row"><b>Total P&amp;L after fees: <span class="${tot>=0?'g':'r'}">${tot.toFixed(2)}</span></b><span class="mu">Live price refreshes every 15 s (mid of bid/ask). Fees count open and close.</span></div>
 <div class="wrap"><table><tr><th>Contract<th>Qty<th>Entry<th>Live<th>P&amp;L<th>Fees<th></tr>${rows||'<tr><td colspan="7" class="mu">No paper trades yet. Add one from Auto-Picks.</tr>'}</table></div>`;
}
async function refresh(){
 const g={};cfg.pos.forEach(p=>(g[p.sym+'|'+p.exp]??=[]).push(p));
 for(const k in g){try{const[s,e]=k.split('|'),o=(await api(`/api/chain?symbol=${encodeURIComponent(s)}&date=${e}`)).optionChain.result[0].options[0];
  g[k].forEach(p=>{const c=[...o.calls,...o.puts].find(x=>x.contractSymbol===p.code);if(c)p.live=c.bid&&c.ask?(c.bid+c.ask)/2:c.lastPrice})}catch(e){}}
 save();if(tab==='paper'&&document.activeElement.tagName!=='INPUT')render();
}
function rSet(){return `<div class="set"><label>Bridge URL<input id="b" value="${cfg.bridge}"></label><label>Symbols, comma separated (use ^SPX for the index)<input id="u" value="${cfg.uni}"></label>
 <label>Moomoo fee per contract, each side ($)<input id="f" value="${cfg.fee}"></label><label>Moomoo chart URL template ({sym} {code} {strike} {type} {qty})<input id="c" value="${cfg.chart}"></label><p><button class="btn pri" onclick="sv()">Save settings</button></p>
 <h3>Moomoo OpenAPI</h3><p class="mu">Sent to your local bridge only and cleared from this page. Not stored in the browser.</p>
 <label>API key<input id="mk" autocomplete="off"></label><label>Secret ID<input id="ms" type="password" autocomplete="off"></label><label>OpenD host<input id="mh" value="127.0.0.1"></label><label>OpenD port<input id="mp" value="11111"></label>
 <p><button class="btn" onclick="mm()">Send to bridge</button> <span id="mst" class="mu"></span></p></div>`}
function sv(){cfg.bridge=$('#b').value.trim();cfg.uni=$('#u').value;cfg.fee=+$('#f').value||0;cfg.chart=$('#c').value;save();ping();msg='Settings saved';render()}
async function mm(){try{await fetch(cfg.bridge+'/api/moomoo/config',{method:'POST',body:JSON.stringify({key:$('#mk').value,secret:$('#ms').value,host:$('#mh').value,port:+$('#mp').value})});$('#mk').value=$('#ms').value='';$('#mst').textContent='Sent. Bridge status: '+JSON.stringify(await api('/api/moomoo/status'))}catch(e){$('#mst').textContent='Bridge not reachable'}}
async function ping(){try{await api('/api/moomoo/status');$('#dot').style.background='var(--g)';$('#bs').textContent='bridge online'}catch(e){$('#dot').style.background='var(--r)';$('#bs').textContent='bridge offline'}}
function render(){$('#v').innerHTML=tab==='picks'?rPicks():tab==='paper'?rPaper():rSet();document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}
setInterval(refresh,15000);render();ping();scan();refresh();
</script></body></html>
